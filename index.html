<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>AI 阅读器</title>
  <style>
    :root {
      --paper: #f7f1e8;
      --paper-deep: #efe5d8;
      --ink: #2b251f;
      --muted: #8a7a68;
      --line: #dfd0be;
      --panel: #fffaf3;
      --accent: #6f553a;
      --ai: #8a5f2d;
      --ai-bg: #f3e5cf;
      --dark: #2d241c;
      --green: #4a8c5c;
      --green-bg: rgba(74,140,92,0.12);
      --green-border: rgba(74,140,92,0.3);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Segoe UI", sans-serif;
      overflow: hidden;
      height: 100vh;
      height: 100dvh;
    }
    button, input, textarea, select { font: inherit; }
    button {
      border: none;
      background: var(--dark);
      color: white;
      border-radius: 999px;
      padding: 8px 16px;
      cursor: pointer;
      font-size: 14px;
      transition: opacity 0.15s;
    }
    button:active { opacity: 0.7; }
    button.secondary {
      background: rgba(255,255,255,0.6);
      color: var(--ink);
      border: 1px solid var(--line);
    }
    button.ghost {
      background: transparent;
      color: var(--accent);
      padding: 4px 8px;
    }
    button.mini {
      font-size: 12px;
      padding: 4px 10px;
      background: rgba(111,85,58,0.1);
      color: var(--accent);
      border: 1px solid rgba(111,85,58,0.15);
    }
    button.mini.green {
      background: rgba(74,140,92,0.1);
      color: var(--green);
      border-color: rgba(74,140,92,0.2);
    }
    input, textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      background: #fffaf3;
      color: var(--ink);
      border-radius: 12px;
      padding: 10px 12px;
      outline: none;
      font-size: 15px;
    }
    textarea { resize: vertical; min-height: 100px; line-height: 1.6; }
    label { display: block; margin: 14px 0 5px; font-size: 13px; color: var(--muted); }

    /* ===== 顶栏 ===== */
    .topbar {
      height: 52px;
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 30;
      background: rgba(247,241,232,0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(223,208,190,0.7);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      padding-top: env(safe-area-inset-top);
    }
    .topbar-left, .topbar-right { display: flex; align-items: center; gap: 8px; }
    .brand { font-size: 15px; color: var(--muted); letter-spacing: 0.06em; font-weight: 500; }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 18px; padding: 0;
      background: rgba(255,255,255,0.5);
      color: var(--ink);
      border: 1px solid var(--line);
    }

    /* ===== 主体布局 ===== */
    .app-body {
      position: fixed;
      top: 52px; left: 0; right: 0; bottom: 0;
      display: flex;
      padding-top: env(safe-area-inset-top);
    }

    /* 正文区 */
    .content-area {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 24px 18px 80px;
      transition: margin-right 0.25s ease;
    }
    .content-area.with-panel {
      margin-right: 0;
    }

    /* 侧边栏 */
    .side-panel {
      width: 0;
      min-width: 0;
      overflow: hidden;
      background: var(--panel);
      border-left: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      transition: width 0.25s ease, min-width 0.25s ease;
      position: relative;
    }
    .side-panel.open {
      width: 420px;
      min-width: 420px;
    }
    .side-panel-header {
      min-height: 52px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }
    .side-panel-header h3 {
      font-size: 16px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .side-panel-body {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 14px;
    }
    .side-panel-footer {
      border-top: 1px solid var(--line);
      padding: 10px 14px;
      display: flex;
      gap: 8px;
      align-items: flex-end;
      flex-shrink: 0;
    }
    .side-panel-footer textarea {
      min-height: 42px;
      max-height: 120px;
      flex: 1;
      border-radius: 14px;
      padding: 9px 12px;
      font-size: 14px;
    }

    /* ===== 首页 ===== */
    .home-wrap {
      max-width: 620px;
      margin: 0 auto;
    }
    .empty-state {
      min-height: 50vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--muted);
      line-height: 1.8;
    }
    .empty-state h1 { font-size: 22px; margin-bottom: 12px; color: var(--ink); }
    .book-list { display: grid; gap: 12px; margin-top: 20px; }
    .book-card {
      background: rgba(255,250,243,0.75);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px 18px;
      cursor: pointer;
      transition: box-shadow 0.15s;
    }
    .book-card:active { box-shadow: 0 2px 12px rgba(74,55,35,0.1); }
    .book-card h2 { font-size: 19px; font-weight: 600; margin-bottom: 6px; }
    .book-card .meta { color: var(--muted); font-size: 13px; line-height: 1.6; }

    /* ===== 阅读器 ===== */
    .reader-wrap {
      max-width: 720px;
      margin: 0 auto;
    }
    .reader-header {
      padding-bottom: 16px;
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(223,208,190,0.6);
    }
    .reader-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      gap: 8px;
    }
    .reader-header h1 {
      font-size: 24px;
      font-weight: 650;
      margin-bottom: 6px;
      letter-spacing: 0.02em;
    }
    .reader-header .desc {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    /* 正文排版 */
    .novel-body {
      font-family: "Songti SC", "STSong", "Noto Serif SC", "Source Han Serif SC", serif;
      font-size: 18px;
      line-height: 1.75;
      letter-spacing: 0.015em;
    }
    .para-block {
      margin-bottom: 0.4em;
      position: relative;
    }
    .novel-p {
      text-indent: 2em;
      white-space: pre-wrap;
      word-break: break-all;
    }

    /* 段尾三角 */
    .tri-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-left: 4px;
      width: 1.3em;
      height: 1.3em;
      border-radius: 50%;
      font-size: 0.65em;
      vertical-align: middle;
      padding: 0;
      cursor: pointer;
      border: 1.5px solid rgba(111,85,58,0.25);
      background: rgba(111,85,58,0.06);
      color: var(--accent);
      transform: translateY(-1px);
      transition: all 0.15s;
    }
    .tri-btn.has-comment {
      border-color: var(--green-border);
      background: var(--green-bg);
      color: var(--green);
    }
    .tri-btn:active { transform: translateY(-1px) scale(0.9); }

    /* 段内AI批注预览 */
    .inline-note {
      margin: 4px 0 8px 2.2em;
      padding: 7px 11px;
      max-width: 90%;
      border-left: 3px solid rgba(74,140,92,0.5);
      background: rgba(74,140,92,0.06);
      color: #3a6b47;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      font-size: 13px;
      line-height: 1.55;
      border-radius: 8px;
    }
    .inline-note .note-tag {
      display: inline-block;
      margin-right: 5px;
      font-size: 11px;
      color: #fff;
      background: rgba(74,140,92,0.75);
      border-radius: 999px;
      padding: 1px 7px;
    }

    /* ===== 思考指示器 ===== */
    .thinking-indicator {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      background: rgba(111,85,58,0.06);
      border: 1px solid rgba(111,85,58,0.12);
      border-radius: 14px;
      margin-bottom: 12px;
      font-size: 14px;
      color: var(--accent);
    }
    .thinking-dots {
      display: flex;
      gap: 4px;
    }
    .thinking-dots span {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 1.2s infinite;
    }
    .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
    .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.25; transform: scale(0.85); }
      40% { opacity: 1; transform: scale(1); }
    }
    .thinking-timer {
      font-variant-numeric: tabular-nums;
      font-size: 13px;
      color: var(--muted);
    }

    /* ===== 聊天 ===== */
    .chat-msg {
      margin-bottom: 10px;
      padding: 10px 12px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .chat-user {
      margin-left: 40px;
      background: var(--dark);
      color: white;
    }
    .chat-ai {
      margin-right: 40px;
      background: rgba(111,85,58,0.08);
      color: var(--ink);
      border: 1px solid rgba(111,85,58,0.1);
    }
    .chat-actions {
      display: flex;
      gap: 6px;
      margin-top: 6px;
      flex-wrap: wrap;
    }

    /* 当前段引用 */
    .para-quote {
      background: rgba(243,229,207,0.5);
      border: 1px solid rgba(223,208,190,0.8);
      border-radius: 14px;
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 14px;
      line-height: 1.65;
      color: var(--ink);
      white-space: pre-wrap;
      max-height: 120px;
      overflow-y: auto;
    }

    /* ===== 笔记面板 ===== */
    .note-card {
      background: rgba(255,255,255,0.5);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .note-card h4 {
      font-size: 15px;
      margin-bottom: 8px;
      font-weight: 600;
    }
    .note-card .note-time {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .note-card .note-content {
      font-size: 14px;
      line-height: 1.65;
      white-space: pre-wrap;
      color: var(--ink);
    }
    .note-card .note-excerpt {
      margin-top: 8px;
      padding: 6px 10px;
      background: rgba(111,85,58,0.05);
      border-left: 2px solid var(--accent);
      border-radius: 6px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
    }

    .small { color: var(--muted); font-size: 13px; line-height: 1.6; }

    /* toast */
    .toast-bar {
      position: fixed;
      left: 50%; bottom: 28px;
      transform: translateX(-50%);
      background: rgba(45,36,28,0.9);
      color: white;
      padding: 9px 16px;
      border-radius: 999px;
      font-size: 14px;
      z-index: 100;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .toast-bar.show { opacity: 1; }

    /* ===== iPad / 移动适配 ===== */
    @media (max-width: 900px) {
      .side-panel.open {
        position: fixed;
        top: 52px; right: 0; bottom: 0;
        width: 88vw;
        min-width: 88vw;
        z-index: 40;
        box-shadow: -8px 0 30px rgba(74,55,35,0.15);
      }
      .content-area.with-panel {
        margin-right: 0;
      }
    }
    @media (max-width: 600px) {
      .side-panel.open {
        width: 100vw;
        min-width: 100vw;
      }
      .brand { display: none; }
      .novel-body { font-size: 17px; }
      .reader-header h1 { font-size: 22px; }
    }

    /* 全局loading遮罩 */
    .global-loading {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(247,241,232,0.7);
      backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }
    .global-loading .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--line);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .global-loading .loading-text {
      font-size: 15px;
      color: var(--accent);
    }
    .global-loading .loading-timer {
      font-size: 13px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    /* 面板内遮罩（仅移动端） */
    .panel-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 35;
      background: rgba(45,36,28,0.2);
    }
    .panel-overlay.show { display: block; }
  </style>
</head>
<body>

<!-- 顶栏 -->
<header class="topbar">
  <div class="topbar-left">
    <button class="icon-btn" onclick="toggleNotesPanel()" title="阅读笔记">📒</button>
    <button class="icon-btn" onclick="openSettingsPanel()" title="设置">⚙</button>
  </div>
  <div class="brand">AI 阅读器</div>
  <div class="topbar-right">
    <button class="icon-btn" onclick="triggerUpload()" title="上传 TXT">＋</button>
    <input id="fileInput" type="file" accept=".txt,.text,text/plain" hidden />
  </div>
</header>

<!-- 主体 -->
<div class="app-body">
  <div id="contentArea" class="content-area">
    <div id="mainContent"></div>
  </div>

  <div id="panelOverlay" class="panel-overlay" onclick="closeSidePanel()"></div>

  <aside id="sidePanel" class="side-panel">
    <div class="side-panel-header">
      <h3 id="sidePanelTitle">面板</h3>
      <button class="secondary" onclick="closeSidePanel()" style="font-size:13px;padding:5px 12px;">关闭</button>
    </div>
    <div id="sidePanelBody" class="side-panel-body"></div>
    <div id="sidePanelFooter" class="side-panel-footer" style="display:none;"></div>
  </aside>
</div>

<div id="toastBar" class="toast-bar"></div>

<script>
// ===== 状态管理 =====
const STORAGE_KEY = "ai_reader_v3";
let state = loadState();
let currentTextId = null;
let currentPanelType = null; // 'chat' | 'notes' | 'allNotes' | 'settings'
let currentChatParaIndex = null;
let thinkingTimers = {};

function defaultState() {
  return {
    settings: {
      workerUrl: "https://ai-reader-proxy.shun83258.workers.dev",
      memoryMode: "none"
    },
    texts: []
  };
}

function loadState() {
  try {
    // 尝试读v3
    let raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return normalize(JSON.parse(raw));
    // 兼容v2
    raw = localStorage.getItem("ai_reader_v2");
    if (raw) return normalize(JSON.parse(raw));
    // 兼容v1
    raw = localStorage.getItem("ai_reader_v1");
    if (raw) return normalize(JSON.parse(raw));
    return defaultState();
  } catch(e) {
    return defaultState();
  }
}

function normalize(input) {
  const base = defaultState();
  const s = {
    ...base,
    ...input,
    settings: { ...base.settings, ...(input.settings || {}) },
    texts: Array.isArray(input.texts) ? input.texts : []
  };
  s.texts = s.texts.map(t => {
    // 兼容旧myNotes数组
    const oldMyNotes = Array.isArray(t.myNotes)
      ? t.myNotes.map(n => n.note || "").filter(Boolean).join("\n\n")
      : "";
    return {
      id: t.id || uid("t"),
      title: t.title || "未命名",
      content: t.content || "",
      paragraphs: Array.isArray(t.paragraphs)
        ? t.paragraphs.map((p, i) => ({
            id: p.id || uid("p"),
            index: i,
            text: typeof p === "string" ? p : (p.text || ""),
            chatHistory: Array.isArray(p.chatHistory) ? p.chatHistory : []
          }))
        : [],
      aiComments: Array.isArray(t.aiComments) ? t.aiComments : [],
      aiMemo: t.aiMemo || t.aiReadingNote || "",
      myMemo: t.myMemo || oldMyNotes || "",
      noteCards: Array.isArray(t.noteCards) ? t.noteCards : [],
      createdAt: t.createdAt || new Date().toISOString(),
      updatedAt: t.updatedAt || t.createdAt || new Date().toISOString()
    };
  });
  return s;
}

function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function uid(p) { return p + "_" + Math.random().toString(36).slice(2,8) + Date.now().toString(36); }
function getText(id) { return state.texts.find(t => t.id === id); }

function esc(s) {
  return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function fmtDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  const pad = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function toast(msg) {
  const el = document.getElementById("toastBar");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("show"), 1800);
}

// ===== 智能分段 =====
function smartSplit(text) {
  // 先统一换行
  let s = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n");

  // 策略1: 如果有双换行（空行分段），按此切分
  if (/\n\s*\n/.test(s)) {
    const parts = s.split(/\n\s*\n+/).map(p => p.trim()).filter(Boolean);
    if (parts.length >= 2) return parts;
  }

  // 策略2: 按单换行切分，然后合并过短的行
  const lines = s.split("\n").map(l => l.trim()).filter(Boolean);
  if (lines.length <= 1) return lines.length ? lines : [s.trim()];

  // 如果大部分行都较长（>50字），每行就是一个段落
  const longCount = lines.filter(l => l.length > 50).length;
  if (longCount > lines.length * 0.6) {
    return lines;
  }

  // 否则尝试合并短行：遇到长停顿或对话标记才断段
  const result = [];
  let buf = "";
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const isDialogStart = /^["""「『【（(]/.test(line);
    const prevEndsWithPunctuation = /[。！？…」』】）)"""]$/.test(buf);

    if (buf && (isDialogStart || (prevEndsWithPunctuation && buf.length > 80))) {
      result.push(buf);
      buf = line;
    } else {
      buf = buf ? buf + "\n" + line : line;
    }
  }
  if (buf) result.push(buf);

  // 如果合并后段落太少，回退到单换行
  if (result.length < 2 && lines.length >= 2) return lines;

  return result;
}

// ===== 收集跨文本记忆 =====
function collectAiMemos(excludeId) {
  return state.texts
    .filter(t => t.id !== excludeId)
    .map(t => {
      const memo = (t.aiMemo || "").trim();
      const cards = (t.noteCards || []).map(c => c.content).join("\n");
      const combined = [memo, cards].filter(Boolean).join("\n");
      return combined ? `《${t.title}》\n${combined}` : "";
    })
    .filter(Boolean).slice(-5);
}

function collectMyMemos(excludeId) {
  return state.texts
    .filter(t => t.id !== excludeId)
    .map(t => {
      const memo = (t.myMemo || "").trim();
      return memo ? `《${t.title}》\n${memo}` : "";
    })
    .filter(Boolean).slice(-5);
}

function commentsForPara(text, idx) {
  return (text.aiComments || []).filter(c => Number(c.paragraphIndex) === idx);
}

// ===== Worker 调用 =====
async function callWorker(path, body) {
  const base = state.settings.workerUrl.replace(/\/$/,"");
  const resp = await fetch(base + path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  const raw = await resp.text();
  let data;
  try { data = JSON.parse(raw); } catch(e) { throw new Error(raw || "Worker返回非JSON"); }
  if (!resp.ok || data.error) throw new Error(data.message || data.error || "请求失败");
  return data;
}

// ===== 全局Loading =====
let loadingEl = null;
let loadingStart = 0;
let loadingInterval = null;

function showLoading(text) {
  if (loadingEl) hideLoading();
  loadingStart = Date.now();
  loadingEl = document.createElement("div");
  loadingEl.className = "global-loading";
  loadingEl.innerHTML = `
    <div class="spinner"></div>
    <div class="loading-text">${esc(text)}</div>
    <div class="loading-timer">0 秒</div>
  `;
  document.body.appendChild(loadingEl);
  const timerEl = loadingEl.querySelector(".loading-timer");
  loadingInterval = setInterval(() => {
    const sec = Math.floor((Date.now() - loadingStart) / 1000);
    timerEl.textContent = sec + " 秒";
  }, 500);
}

function hideLoading() {
  if (loadingInterval) clearInterval(loadingInterval);
  if (loadingEl) loadingEl.remove();
  loadingEl = null;
  loadingInterval = null;
}

// ===== 文件上传 =====
function triggerUpload() {
  document.getElementById("fileInput").click();
}

document.getElementById("fileInput").addEventListener("change", async function(e) {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;

  if (!state.settings.workerUrl) {
    openSettingsPanel();
    toast("请先填写 Worker URL");
    return;
  }

  let content;
  try {
    content = await file.text();
  } catch(err) {
    alert("读取文件失败，请确认文件是 UTF-8 编码的 TXT");
    return;
  }

  const paragraphs = smartSplit(content);
  if (!paragraphs.length) {
    alert("没有读到有效段落。请确认 TXT 文件有内容。");
    return;
  }

  const text = {
    id: uid("t"),
    title: file.name.replace(/\.txt$/i, ""),
    content,
    paragraphs: paragraphs.map((p, i) => ({
      id: uid("p"), index: i, text: p, chatHistory: []
    })),
    aiComments: [],
    aiMemo: "",
    myMemo: "",
    noteCards: [],
    createdAt: new Date().toISOString(),
    updatedAt: new Date().toISOString()
  };

  state.texts.unshift(text);
  save();
  renderReader(text.id);

  // AI 阅读
  showLoading("AI 正在阅读全文…");
  try {
    const result = await callWorker("/annotate", {
      title: text.title,
      paragraphs: text.paragraphs.map(p => p.text),
      memoryMode: state.settings.memoryMode,
      aiNotes: collectAiMemos(text.id),
      myNotes: collectMyMemos(text.id)
    });

    const parsed = result.parsed;
    if (parsed) {
      text.aiMemo = parsed.overallNote || "";
      text.aiComments = Array.isArray(parsed.comments) ? parsed.comments : [];
    } else {
      text.aiMemo = result.raw || "";
      text.aiComments = [];
    }

    // 自动生成第一张笔记卡片
    if (text.aiMemo) {
      text.noteCards.unshift({
        id: uid("nc"),
        type: "ai-summary",
        title: "阅读概要",
        content: text.aiMemo,
        createdAt: new Date().toISOString()
      });
    }

    text.updatedAt = new Date().toISOString();
    save();
    renderReader(text.id);
    toast("AI 阅读完成");
  } catch(err) {
    text.aiMemo = "AI 阅读失败：" + err.message;
    save();
    renderReader(text.id);
    toast("AI 阅读失败");
  } finally {
    hideLoading();
  }
});

// ===== 渲染首页 =====
function renderHome() {
  currentTextId = null;
  closeSidePanel();
  const el = document.getElementById("mainContent");

  if (!state.texts.length) {
    el.innerHTML = `
      <div class="empty-state">
        <div>
          <h1>还没有文章</h1>
          <p>点右上角「＋」上传 TXT 文件<br>上传后 AI 会自动阅读并生成批注和阅读笔记</p>
        </div>
      </div>`;
    return;
  }

  el.innerHTML = `
    <div class="home-wrap">
      <div class="book-list">
        ${state.texts.map(t => `
          <div class="book-card" onclick="renderReader('${t.id}')">
            <h2>${esc(t.title)}</h2>
            <div class="meta">
              ${t.content.length} 字 · ${t.paragraphs.length} 段 · AI批注 ${(t.aiComments||[]).length} 条<br>
              ${fmtDate(t.updatedAt)}
            </div>
          </div>
        `).join("")}
      </div>
    </div>`;
}

// ===== 渲染阅读器 =====
function renderReader(id) {
  const text = getText(id);
  if (!text) return renderHome();
  currentTextId = id;
  text.updatedAt = new Date().toISOString();
  save();

  const el = document.getElementById("mainContent");
  el.innerHTML = `
    <div class="reader-wrap">
      <div class="reader-header">
        <div class="reader-nav">
          <button class="secondary" onclick="renderHome()">← 书架</button>
          <div style="display:flex;gap:8px;">
            <button class="mini" onclick="toggleNotesPanel()">📒 笔记</button>
            <button class="mini" style="color:#c55;" onclick="deleteText('${text.id}')">删除</button>
          </div>
        </div>
        <h1>${esc(text.title)}</h1>
        <div class="desc">${text.content.length} 字 · ${text.paragraphs.length} 段</div>
      </div>
      <div class="novel-body">
        ${text.paragraphs.map((p, i) => {
          const comments = commentsForPara(text, i);
          const hasComment = comments.length > 0;
          return `
            <div class="para-block" id="para_${i}">
              <p class="novel-p">${esc(p.text)}<button class="tri-btn ${hasComment ? 'has-comment' : ''}" onclick="openChatForPara('${text.id}',${i})" title="${hasComment ? 'AI有批注，点击查看' : '点击与AI聊聊这段'}">▸</button></p>
              ${comments.map(c => `
                <div class="inline-note">
                  <span class="note-tag">${esc(c.tag||"批注")}</span>${esc(c.comment||"")}
                </div>
              `).join("")}
            </div>`;
        }).join("")}
      </div>
    </div>`;
}

// ===== 侧边栏控制 =====
function openSidePanel(title, bodyHtml, footerHtml) {
  document.getElementById("sidePanelTitle").textContent = title;
  document.getElementById("sidePanelBody").innerHTML = bodyHtml;

  const footer = document.getElementById("sidePanelFooter");
  if (footerHtml) {
    footer.innerHTML = footerHtml;
    footer.style.display = "flex";
  } else {
    footer.innerHTML = "";
    footer.style.display = "none";
  }

  document.getElementById("sidePanel").classList.add("open");
  document.getElementById("contentArea").classList.add("with-panel");

  // 移动端显示遮罩
  if (window.innerWidth <= 900) {
    document.getElementById("panelOverlay").classList.add("show");
  }
}

function closeSidePanel() {
  document.getElementById("sidePanel").classList.remove("open");
  document.getElementById("contentArea").classList.remove("with-panel");
  document.getElementById("panelOverlay").classList.remove("show");
  currentPanelType = null;
  currentChatParaIndex = null;
}

// ===== 段落聊天面板 =====
function openChatForPara(textId, paraIndex) {
  currentPanelType = "chat";
  currentChatParaIndex = paraIndex;
  const text = getText(textId);
  if (!text) return;
  renderChatPanel(text, paraIndex);
}

function renderChatPanel(text, paraIndex) {
  if (!text) text = getText(currentTextId);
  if (paraIndex === undefined) paraIndex = currentChatParaIndex;
  if (!text || paraIndex === null) return;

  const p = text.paragraphs[paraIndex];
  if (!p) return;
  const history = p.chatHistory || [];
  const comments = commentsForPara(text, paraIndex);

  let bodyHtml = `<div class="para-quote">${esc(p.text.length > 300 ? p.text.slice(0,300)+"…" : p.text)}</div>`;

  // 显示AI批注
  if (comments.length) {
    bodyHtml += comments.map(c => `
      <div style="margin-bottom:10px;padding:8px 11px;background:rgba(74,140,92,0.06);border-left:3px solid rgba(74,140,92,0.4);border-radius:8px;font-size:13px;line-height:1.55;color:#3a6b47;">
        <span style="display:inline-block;margin-right:4px;font-size:11px;background:rgba(74,140,92,0.7);color:#fff;border-radius:99px;padding:1px 6px;">${esc(c.tag||"批注")}</span>${esc(c.comment||"")}
      </div>
    `).join("");
  }

  // 聊天记录
  if (history.length) {
    bodyHtml += history.map((m, idx) => `
      <div class="chat-msg ${m.role==="user"?"chat-user":"chat-ai"}">
        ${esc(m.content)}
        <div class="chat-actions">
          ${m.role === "assistant"
            ? `<button class="mini green" onclick="excerptToNotes(${idx})">摘到笔记</button>`
            : ""}
        </div>
      </div>
    `).join("");
  } else if (!comments.length) {
    bodyHtml += `<p class="small" style="margin:12px 0;">可以在这里聊聊这段内容。AI 只会看到当前段、前后段和阅读笔记。</p>`;
  }

  // 思考指示器
  const thinkKey = `${text.id}_${paraIndex}`;
  if (thinkingTimers[thinkKey]) {
    bodyHtml += `
      <div class="thinking-indicator" id="thinkInd_${paraIndex}">
        <div class="thinking-dots"><span></span><span></span><span></span></div>
        <span>AI 思考中</span>
        <span class="thinking-timer" id="thinkTimer_${paraIndex}">0 秒</span>
      </div>`;
  }

  openSidePanel(
    `第 ${paraIndex + 1} 段`,
    bodyHtml,
    `<textarea id="chatInput" placeholder="问问这段…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat();}"></textarea>
     <button onclick="sendChat()" style="flex-shrink:0;">发送</button>`
  );

  // 滚到底部
  setTimeout(() => {
    const body = document.getElementById("sidePanelBody");
    if (body) body.scrollTop = body.scrollHeight;
  }, 50);
}

async function sendChat() {
  const input = document.getElementById("chatInput");
  if (!input) return;
  const msg = input.value.trim();
  if (!msg) return;

  const text = getText(currentTextId);
  if (!text || currentChatParaIndex === null) return;
  const i = currentChatParaIndex;
  const p = text.paragraphs[i];
  if (!p) return;

  p.chatHistory = p.chatHistory || [];
  p.chatHistory.push({ role: "user", content: msg });
  save();
  renderChatPanel(text, i);

  // 开始思考计时
  const thinkKey = `${text.id}_${i}`;
  const thinkStart = Date.now();
  thinkingTimers[thinkKey] = true;
  renderChatPanel(text, i);

  const timerUpdate = setInterval(() => {
    const timerEl = document.getElementById(`thinkTimer_${i}`);
    if (timerEl) {
      timerEl.textContent = Math.floor((Date.now() - thinkStart)/1000) + " 秒";
    }
  }, 500);

  try {
    const result = await callWorker("/chat", {
      currentParagraph: p.text,
      previousParagraph: text.paragraphs[i-1]?.text || "",
      nextParagraph: text.paragraphs[i+1]?.text || "",
      userMessage: msg,
      chatHistory: p.chatHistory.slice(0, -1),
      textAiNote: text.aiMemo || "",
      memoryMode: state.settings.memoryMode,
      aiNotes: collectAiMemos(text.id),
      myNotes: collectMyMemos(text.id)
    });

    const reply = result.reply || "AI 没有返回内容。";
    p.chatHistory.push({ role: "assistant", content: reply });

    // AI 聊天过程中可能产生的笔记卡片（让AI自己决定是否值得记录）
    // 这里先简单处理：每3轮对话自动追加一张卡片
    const aiMsgCount = p.chatHistory.filter(m => m.role === "assistant").length;
    if (aiMsgCount > 0 && aiMsgCount % 3 === 0) {
      text.noteCards.push({
        id: uid("nc"),
        type: "ai-chat-insight",
        title: `第${i+1}段 对话感悟`,
        content: reply.length > 200 ? reply.slice(0, 200) + "…" : reply,
        excerpt: p.text.slice(0, 80),
        createdAt: new Date().toISOString()
      });
    }

    save();
  } catch(err) {
    p.chatHistory.push({ role: "assistant", content: "请求失败：" + err.message });
    save();
  } finally {
    clearInterval(timerUpdate);
    delete thinkingTimers[thinkKey];
    renderChatPanel(text, i);
  }
}

function excerptToNotes(msgIdx) {
  const text = getText(currentTextId);
  if (!text || currentChatParaIndex === null) return;
  const p = text.paragraphs[currentChatParaIndex];
  const msg = p.chatHistory[msgIdx];
  if (!msg) return;

  text.noteCards.push({
    id: uid("nc"),
    type: "excerpt",
    title: `第${currentChatParaIndex+1}段 摘录`,
    content: msg.content,
    excerpt: p.text.slice(0, 80),
    createdAt: new Date().toISOString()
  });
  save();
  toast("已摘到阅读笔记");
}

// ===== 笔记面板 =====
function toggleNotesPanel() {
  if (currentPanelType === "notes" || currentPanelType === "allNotes") {
    closeSidePanel();
    return;
  }
  if (currentTextId) {
    openTextNotesPanel();
  } else {
    openAllNotesPanel();
  }
}

function openTextNotesPanel() {
  currentPanelType = "notes";
  const text = getText(currentTextId);
  if (!text) return openAllNotesPanel();

  let bodyHtml = `
    <div class="small" style="margin-bottom:12px;">《${esc(text.title)}》的阅读笔记</div>

    <div class="note-card">
      <h4>📝 我的备忘录</h4>
      <textarea id="myMemoInput" placeholder="写你自己的阅读笔记…" style="min-height:80px;">${esc(text.myMemo||"")}</textarea>
      <div style="display:flex;gap:6px;margin-top:8px;">
        <button class="mini" onclick="saveMyMemo()">保存</button>
        <button class="mini" onclick="if(confirm('清空？'))document.getElementById('myMemoInput').value=''">清空</button>
      </div>
    </div>

    <div class="note-card">
      <h4>🤖 AI 备忘录</h4>
      <textarea id="aiMemoInput" placeholder="AI 的阅读备忘录" style="min-height:80px;">${esc(text.aiMemo||"")}</textarea>
      <div style="display:flex;gap:6px;margin-top:8px;">
        <button class="mini" onclick="saveAiMemo()">保存</button>
        <button class="mini" onclick="polishAiMemo()">AI 整理</button>
      </div>
    </div>

    <h4 style="margin:16px 0 10px;font-size:15px;">📌 笔记卡片</h4>
  `;

  const cards = text.noteCards || [];
  if (cards.length) {
    bodyHtml += cards.map((c, idx) => `
      <div class="note-card">
        <div class="note-time">${fmtDate(c.createdAt)}</div>
        <h4>${esc(c.title||"笔记")}</h4>
        <div class="note-content">${esc(c.content||"")}</div>
        ${c.excerpt ? `<div class="note-excerpt">原文：${esc(c.excerpt)}…</div>` : ""}
        <div style="margin-top:8px;">
          <button class="mini" style="color:#c55;" onclick="deleteNoteCard(${idx})">删除</button>
        </div>
      </div>
    `).join("");
  } else {
    bodyHtml += `<p class="small">还没有笔记卡片。在聊天中点「摘到笔记」可以添加。</p>`;
  }

  bodyHtml += `
    <div style="margin-top:16px;">
      <button class="mini" onclick="addManualCard()">＋ 手动添加卡片</button>
      <button class="mini" onclick="openAllNotesPanel()">查看全部文章笔记</button>
    </div>
  `;

  openSidePanel("阅读笔记", bodyHtml);
}

function saveMyMemo() {
  const text = getText(currentTextId);
  if (!text) return;
  const el = document.getElementById("myMemoInput");
  if (el) text.myMemo = el.value.trim();
  text.updatedAt = new Date().toISOString();
  save();
  toast("已保存");
}

function saveAiMemo() {
  const text = getText(currentTextId);
  if (!text) return;
  const el = document.getElementById("aiMemoInput");
  if (el) text.aiMemo = el.value.trim();
  text.updatedAt = new Date().toISOString();
  save();
  toast("已保存");
}

async function polishAiMemo() {
  const text = getText(currentTextId);
  if (!text) return;

  const aiBox = document.getElementById("aiMemoInput");
  const myBox = document.getElementById("myMemoInput");

  const material = [
    "当前 AI 备忘录：", aiBox?.value || "暂无", "",
    "我的阅读备忘录：", myBox?.value || "暂无", "",
    "AI 段落批注：",
    (text.aiComments||[]).map(c => `第${Number(c.paragraphIndex)+1}段：${c.tag||""} ${c.comment||""}`).join("\n") || "暂无"
  ].join("\n");

  showLoading("AI 正在整理备忘录…");
  try {
    const result = await callWorker("/chat", {
      currentParagraph: material,
      previousParagraph: "",
      nextParagraph: "",
      userMessage: "请把以上内容整理成一份简洁的阅读备忘录。保留关键判断和感受，控制在180字以内。不要写成作文。",
      chatHistory: [],
      textAiNote: aiBox?.value || "",
      memoryMode: "none",
      aiNotes: [],
      myNotes: []
    });
    if (aiBox) aiBox.value = result.reply || aiBox.value;
    toast("已整理");
  } catch(err) {
    toast("整理失败：" + err.message);
  } finally {
    hideLoading();
  }
}

function deleteNoteCard(idx) {
  const text = getText(currentTextId);
  if (!text) return;
  if (!confirm("删除这张卡片？")) return;
  text.noteCards.splice(idx, 1);
  save();
  openTextNotesPanel();
}

function addManualCard() {
  const content = prompt("写点什么：");
  if (!content || !content.trim()) return;
  const text = getText(currentTextId);
  if (!text) return;
  text.noteCards.push({
    id: uid("nc"),
    type: "manual",
    title: "手记",
    content: content.trim(),
    createdAt: new Date().toISOString()
  });
  save();
  openTextNotesPanel();
  toast("已添加");
}

function openAllNotesPanel() {
  currentPanelType = "allNotes";
  let bodyHtml = `<div class="small" style="margin-bottom:12px;">所有文章的阅读笔记</div>`;

  if (!state.texts.length) {
    bodyHtml += `<p class="small">暂无。</p>`;
  } else {
    bodyHtml += state.texts.map(t => `
      <div class="note-card">
        <div class="note-time">${fmtDate(t.updatedAt)}</div>
        <h4>${esc(t.title)}</h4>
        <div class="note-content" style="max-height:100px;overflow:hidden;">${esc((t.aiMemo||"").slice(0,200) || "暂无AI备忘录")}</div>
        ${t.myMemo ? `<div class="note-excerpt">我的笔记：${esc(t.myMemo.slice(0,100))}${t.myMemo.length>100?"…":""}</div>` : ""}
        <div class="small" style="margin-top:6px;">笔记卡片 ${(t.noteCards||[]).length} 张</div>
        <div style="margin-top:8px;">
          <button class="mini" onclick="renderReader('${t.id}');closeSidePanel();">打开</button>
        </div>
      </div>
    `).join("");
  }

  openSidePanel("全部笔记", bodyHtml);
}

// ===== 设置面板 =====
function openSettingsPanel() {
  currentPanelType = "settings";
  openSidePanel("设置", `
    <label>Worker URL</label>
    <input id="setWorkerUrl" value="${esc(state.settings.workerUrl||"")}" placeholder="https://xxx.workers.dev" />

    <label>记忆权限</label>
    <select id="setMemoryMode">
      <option value="none" ${state.settings.memoryMode==="none"?"selected":""}>不读取过往笔记</option>
      <option value="ai" ${state.settings.memoryMode==="ai"?"selected":""}>只读取过往 AI 备忘录</option>
      <option value="all" ${state.settings.memoryMode==="all"?"selected":""}>AI 备忘录 + 我的备忘录</option>
    </select>

    <p class="small" style="margin-top:14px;">
      API Key 存放在 Cloudflare Worker 的环境变量里，不会出现在网页中。
    </p>

    <div style="margin-top:18px;">
      <button onclick="saveSettings()">保存设置</button>
    </div>
  `);
}

function saveSettings() {
  state.settings.workerUrl = (document.getElementById("setWorkerUrl")?.value || "").trim();
  state.settings.memoryMode = document.getElementById("setMemoryMode")?.value || "none";
  save();
  toast("设置已保存");
  closeSidePanel();
}

// ===== 删除文章 =====
function deleteText(id) {
  const text = getText(id);
  if (!text) return;
  if (!confirm(`删除《${text.title}》？所有内容都会丢失。`)) return;
  state.texts = state.texts.filter(t => t.id !== id);
  save();
  renderHome();
}

// ===== 启动 =====
renderHome();
</script>
</body>
</html>
