r:var(--accent)}.spin{width:13px;height:13px;border-radius:50%;border:2px solid rgba(109,82,56,.22);border-top-color:var(--accent);animation:spin .85s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.block{padding:14px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.42);margin-bottom:12px}.block h4{margin:0 0 8px;font-size:15px}.box{padding:10px;border-radius:15px;border:1px solid var(--line);background:rgba(255,253,248,.72);margin-top:10px}.box.ok{border-color:rgba(64,133,89,.3);background:rgba(64,133,89,.08);color:var(--green)}.box.fail{border-color:rgba(180,73,61,.3);background:rgba(180,73,61,.08);color:var(--red);white-space:pre-wrap}.searchbar{display:flex;gap:8px;align-items:center}.searchbar input{flex:1}.search-result-grid{display:grid;gap:12px;margin-top:12px}.search-bucket{padding:14px;border:1px solid var(--line);border-radius:20px;background:rgba(255,249,240,.72)}.search-bucket h3{margin:0 0 10px;font-size:16px}.hit{padding:10px 11px;border-radius:14px;border:1px solid rgba(109,82,56,.13);background:rgba(255,253,248,.7);margin-top:8px;cursor:pointer}.hit:hover{background:rgba(109,82,56,.07)}.hit-title{font-weight:700;font-size:13px;margin-bottom:4px}.hit-text{font-size:13px;color:var(--muted);line-height:1.55}.quote{padding:12px 13px;margin-bottom:10px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(246,232,211,.65),rgba(255,249,240,.88));font-size:14px;line-height:1.65;max-height:140px;overflow:auto;white-space:pre-wrap}.comment-panel{padding:10px 12px;margin-bottom:12px;border-radius:16px;border:1px solid rgba(64,133,89,.25);background:rgba(64,133,89,.07);font-size:13px;line-height:1.6}.comment-panel h4{margin:0 0 7px;color:var(--green);font-size:14px}.comment-item{margin:7px 0;padding-top:7px;border-top:1px dashed rgba(64,133,89,.22)}.comment-item:first-of-type{border-top:0;padding-top:0}.anchor{font-size:12px;color:var(--muted);margin-top:4px}.thread{display:grid;gap:14p ound:rgba(255,255,255,.48);margin-bottom:12px}.card.outline{background:linear-gradient(180deg,rgba(255,249,240,.98),rgba(246,232,211,.45))}.card h4{font-size:15px;margin:0 0 8px}.time{font-size:12px;color:var(--muted);margin-bottom:6px}.content{font-size:14px;line-height:1.68;white-space:pre-wrap}.excerpt{margin-top:8px;padding:7px 10px;background:rgba(109,82,56,.05);border-left:2px solid var(--accent);border-radius:8px;font-size:13px;color:var(--muted);line-height:1.5}.pill{border-radius:999px;padding:6px 10px;border:1px solid rgba(109,82,56,.14);background:rgba(109,82,56,.06);color:var(--accent);font-size:12px}.labelmark{display:inline-flex;align-items:center;justify-content:center;min-width:3.4em;padding:2px 8px;margin-right:7px;border-radius:999px;border:1px solid rgba(109,82,56,.15);background:rgba(109,82,56,.06);color:var(--accent);font-size:12px;font-weight:600}.toast{position:fixed;z-index:100;left:50%;bottom:28px;transform:translateX(-50%);background:rgba(43,33,25,.93);color:white;border-radius:999px;padding:9px 16px;font-size:14px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}@media(max-width:900px){.side.open{position:fixed;z-index:40;top:56px;right:0;bottom:0;width:92vw;min-width:92vw}.overlay.show{display:block}}@media(max-width:600px){.brand{display:none}.side.open{width:100vw;min-width:100vw}.novel{font-size:17px}.wrap{max-width:86%}.searchbar{align-items:stretch}.searchbar button{padding-left:12px;padding-right:12px}.icon{min-width:auto;height:34px;padding:0 10px;font-size:12px}}

<body>
<header class="top"><div class="left"><button class="icon" onclick="toggleNotes()">记忆</button><button class="icon" onclick="openSettings()">设置</button></div><div class="brand">AI READER V7 · TEXT LABELS</div><div class="right"><button class="icon" onclick="pickTxt()">导入</button><input id="txt" type="file" accept=".txt,text/plain" hidden><input id="imp" type="file" accept=".json,application/json" hidden></div></header>
<div class="app"><main id="main" class="main"><div id="root"></div></main><div id="overlay" class="overlay" onclick="closeSide()"></div><aside id="side" class="side"><div class="side-h"><h3 id="sideTitle">面板</h3><button class="ghost" onclick="closeSide()" style="padding:5px 12px;font-size:13px">关闭</button></div><div id="sideBody" class="side-b"></div><div id="sideFoot" class="side-f"></div></aside></div><div id="toast" class="toast"></div>
<script>
const STORE='ai_reader_v5_anchored_stream';
let state=load(), current=null, panel=null, paraIndex=null, editing=-1, aborter=null, thinking=false, readTimer=null, chatTimer=null, chatStarted=0, searchDraft='', searchQuery='';
function defaults(){return{settings:{apiBaseUrl:'https://api.openai.com/v1',apiKey:'',model:'gpt-4.1-mini',endpoint:'auto',models:[],memoryScope:'cards',annotatePrompt:defaultAnnotate(),chatPrompt:defaultChat()},texts:[],miscMemory:[]}}
function defaultAnnotate(){return ['你是中文小说/长文阅读助手。','阅读全文后生成很详细、可长期保存的大纲和少量段落批注。','重要：批注必须绑定到段落 id，不能只凭 paragraphIndex。','每条 comments 必须包含 paragraphId、quote、tag、comment。quote 必须是被批注段落里的原文短句，8到40字。','如果找不到能复制的原文 quote，就不要生成那条批注。','大纲必须包含：整体概述、情节/论述推进、人物关系或核心对象、关键线索、情绪变化、主题判断、后续关注点。','只返回 JSON，不要 Markdown 代码块，不要解释。'].join('\n')}
function defaultChat(){return ['你是中文 AI 阅读陪伴助手。','围绕当前段落回答，不要剧透后文。','回答要有阅读感、解释力和情绪敏感度。','可以使用 Markdown。'].join('\n')}
function load(){try{return norm(JSON.parse(localStorage.getItem(STORE)||'null')||defaults())}catch(e){return defaults()}}
function norm(s){const d=defaults();s=s||d;s.settings={...d.settings,...(s.settings||{})};s.miscMemory=s.miscMemory||[];s.texts=(s.texts||[]).map(t=>({id:t.id||uid('t'),title:t.title||'未命名',content:t.content||'',paragraphs:(t.paragraphs||[]).map(p=>typeof p==='string'?{id:uid('p'),text:p,breakAfter:'',chat:[]}:{id:p.id||uid('p'),text:p.text||'',breakAfter:p.breakAfter||'',chat:(p.chat||p.chatHistory||[]).map(m=>({id:m.id||uid('m'),role:m.role==='user'?'user':'assistant',content:m.content||'',createdAt:m.createdAt||now(),updatedAt:m.updatedAt||m.createdAt||now(),seconds:m.seconds||0,tokens:m.tokens||null,edited:!!m.edited}))}),aiComments:t.aiComments||[],aiMemo:t.aiMemo||'',aiOutline:t.aiOutline||'',myMemo:t.myMemo||'',cards:(t.cards||t.noteCards||[]).map(c=>({id:c.id||uid('c'),owner:c.owner||((c.category||c.type)==='outline'||(c.category||c.type)==='chat'?'ai':'user'),category:c.category||c.type||'other',type:c.type||c.category||'other',title:c.title||'记忆卡片',content:c.content||'',excerpt:c.excerpt||'',enabled:c.enabled!==false,eventTime:c.eventTime||c.memoryTime||c.createdAt||now(),createdAt:c.createdAt||now(),updatedAt:c.updatedAt||c.createdAt||now()})),reading:false,started:null,error:t.error||'',createdAt:t.createdAt||now(),updatedAt:t.updatedAt||now()}));return s}
function save(){localStorage.setItem(STORE,JSON.stringify(state))}function uid(p){return p+'_'+Math.random().toString(36).slice(2,9)+Date.now().toString(36)}function now(){return new Date().toISOString()}function text(){return state.texts.find(t=>t.id===current)}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(iso){if(!iso)return'';const d=new Date(iso),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`}function toLocalInput(iso){const d=new Date(iso||Date.now()),p=n=>String(n).padStart(2,'0');return`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`}function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1800)}
function api(){const base=(state.settings.apiBaseUrl||'').replace(/\/$/,'');const key=(state.settings.apiKey||'').trim();const model=(state.settings.model||'').trim();if(!base)throw Error('API URL 为空');if(!key)throw Error('API Key 为空');if(!model)throw Error('模型为空');return{base,key,model}}
function errMsg(prefix,status,raw){let msg=raw||'';try{const j=JSON.parse(raw);msg=j.error?.message||j.message||raw}catch(e){}return `${prefix}${status?` HTTP ${status}`:''}: ${msg||'未知错误'}`}
function responseText(d){if(!d)return'';if(typeof d.output_text==='string')return d.output_text;const out=[];(d.output||[]).forEach(item=>(item.content||[]).forEach(p=>{if(typeof p.text==='string')out.push(p.text);if(typeof p.refusal==='string')out.push(p.refusal)}));return out.join('')}
async function responsesOnce(instructions,input){const{base,key,model}=api();const r=await fetch(base+'/responses',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model,instructions,input})});const raw=await r.text();if(!r.ok)throw Error(errMsg('Responses API 失败',r.status,raw));let d;try{d=JSON.parse(raw)}catch(e){throw Error('Responses API 返回非 JSON：'+raw.slice(0,500))}return{text:responseText(d),usage:d.usage||null,raw:d}}
async function chatOnce(instructions,input){const{base,key,model}=api();const r=await fetch(base+'/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model,messages:[{role:'system',content:instructions||''},{role:'user',content:input||''}]})});const raw=await r.text();if(!r.ok)throw Error(errMsg('Chat Completions 失败',r.status,raw));let d;try{d=JSON.parse(raw)}catch(e){throw Error('Chat Completions 返回非 JSON：'+raw.slice(0,500))}return{text:d.choices?.[0]?.message?.content||'',usage:d.usage||null,raw:d}}
async function ask(instructions,input){const ep=state.settings.endpoint||'auto';let firstErr=null;if(ep==='responses'||ep==='auto'){try{return await responsesOnce(instructions,input)}catch(e){firstErr=e;if(ep==='responses')throw e}}if(ep==='chat'||ep==='auto'){try{return await chatOnce(instructions,input)}catch(e){if(firstErr)throw Error(firstErr.message+'\n\n备用 Chat Completions 也失败：'+e.message);throw e}}throw Error('未知接口模式')}
async function responsesStream(instructions,input,onDelta){const{base,key,model}=api();aborter=new AbortController();const r=await fetch(base+'/responses',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model,instructions,input,stream:true}),signal:aborter.signal});if(!r.ok){const raw=await r.text();throw Error(errMsg('Responses 流式失败',r.status,raw))}const reader=r.body.getReader(),dec=new TextDecoder();let buf='',full='',usage=null;function block(b){b.split(/\r?\n/).forEach(line=>{if(!line.startsWith('data:'))return;const data=line.replace(/^data:\s?/, '').trim();if(!data||data==='[DONE]')return;let o;try{o=JSON.parse(data)}catch(e){return}if(o.type==='response.output_text.delta'||o.type==='response.refusal.delta'){full+=o.delta||'';onDelta(o.delta||'',full,null)}if(o.type==='response.completed'){usage=o.response?.usage||null;const final=responseText(o.response);if(final&&!full){full=final;onDelta(final,full,usage)}else onDelta('',full,usage)}})}while(true){const{value,done}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});const parts=buf.split(/\r?\n\r?\n/);buf=parts.pop()||'';parts.forEach(block)}if(buf)block(buf);return{text:full,usage}}
async function chatStream(instructions,input,onDelta){const{base,key,model}=api();aborter=new AbortController();const r=await fetch(base+'/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model,stream:true,messages:[{role:'system',content:instructions||''},{role:'user',content:input||''}]}),signal:aborter.signal});if(!r.ok){const raw=await r.text();throw Error(errMsg('Chat Completions 流式失败',r.status,raw))}const reader=r.body.getReader(),dec=new TextDecoder();let buf='',full='',usage=null;function block(b){b.split(/\r?\n/).forEach(line=>{if(!line.startsWith('data:'))return;const data=line.replace(/^data:\s?/,'').trim();if(!data||data==='[DONE]')return;let o;try{o=JSON.parse(data)}catch(e){return}const d=o.choices?.[0]?.delta?.content||'';if(d){full+=d;onDelta(d,full,null)}if(o.usage)usage=o.usage})}while(true){const{value,done}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});const parts=buf.split(/\r?\n\r?\n/);buf=parts.pop()||'';parts.forEach(block)}if(buf)block(buf);return{text:full,usage}}
async function askStream(instructions,input,onDelta){const ep=state.settings.endpoint||'auto';const start=Date.now();let firstErr=null;if(ep==='responses'||ep==='auto'){try{const r=await responsesStream(instructions,input,onDelta);aborter=null;return{...r,seconds:Math.round((Date.now()-start)/1000)}}catch(e){firstErr=e;aborter=null;if(ep==='responses')throw e}}if(ep==='chat'||ep==='auto'){try{const r=await chatStream(instructions,input,onDelta);aborter=null;return{...r,seconds:Math.round((Date.now()-start)/1000)}}catch(e){aborter=null;if(firstErr)throw Error(firstErr.message+'\n\n备用 Chat Completions 流式也失败：'+e.message);throw e}}}
function modelOk(id){id=String(id||'').toLowerCase();if(['embedding','embed','whisper','tts','dall-e','image','audio','moderation','realtime','transcribe'].some(x=>id.includes(x)))return false;return id.startsWith('gpt-')||id.startsWith('o')||id.startsWith('chatgpt-')}
async function pullModels(){const box=document.getElementById('testBox');try{saveSettings(false);box.className='box';box.textContent='正在拉取模型…';const{base,key}=api();const r=await fetch(base+'/models',{headers:{Authorization:'Bearer '+key}});const raw=await r.text();if(!r.ok)throw Error(errMsg('拉取模型失败',r.status,raw));const d=JSON.parse(raw);const all=(d.data||[]).map(m=>m.id).filter(Boolean).sort();const filtered=all.filter(modelOk);state.settings.models=filtered.length?filtered:all;save();openSettings();const b=document.getElementById('testBox');b.className='box ok';b.textContent=`拉取成功：已显示 ${state.settings.models.length} 个更可能用于文本回复的模型。`;toast('模型已拉取')}catch(e){box.className='box fail';box.textContent=e.message}}
async function testConnection(){const box=document.getElementById('testBox');try{saveSettings(false);box.className='box';box.textContent='正在发送真实测试消息…';const r=await ask('你是连接测试助手。','只回复 OK 两个字。');if(!(r.text||'').trim())throw Error('接口没有报错，但返回内容为空。');box.className='box ok';box.textContent='测试成功：模型可以回复。返回：'+r.text.trim().slice(0,80)}catch(e){box.className='box fail';box.textContent='测试失败，真实错误如下：\n'+e.message}}
function splitTxt(s){s=s.replace(/\r\n/g,'\n').replace(/\r/g,'\n');const rows=s.match(/[^\n]*(?:\n+|$)/g)||[],out=[];for(const row of rows){if(row==='')continue;const m=row.match(/^([\s\S]*?)(\n*)$/);const line=m?m[1]:row,br=m?m[2]:'';if(line.trim())out.push({id:uid('p'),text:line,breakAfter:br,chat:[]});else if(out.length)out[out.length-1].breakAfter+=(line+br)}return out}
function cardOwner(c){if(c.owner)return c.owner;if(cat(c)==='outline'||cat(c)==='chat')return'ai';return'user'}function cardEnabled(c){return c.enabled!==false}function cardWhen(c){return c.eventTime||c.memoryTime||c.createdAt||now()}function cat(c){return c.category||c.type||'other'}function catInfo(c){return{outline:['大纲','文章大纲'],chat:['聊天','聊天感悟'],excerpt:['摘录','摘录'],manual:['手记','手动记忆'],other:['其他','其他']}[c]||['其他','其他']}function articleCards(t,owner,category){return(t.cards||[]).filter(c=>cardOwner(c)===owner&&(!category||cat(c)===category))}function cardCount(t,owner,category){return articleCards(t,owner,category).length}
function memoryTextForArticle(t){const cards=(t.cards||[]).filter(cardEnabled).map(c=>`[${cardOwner(c)==='ai'?'AI':'用户'}记忆/${catInfo(cat(c))[1]}] 时间：${fmt(cardWhen(c))}\n标题：${c.title||'无标题'}\n内容：${c.content||''}`).join('\n\n');return cards||'无启用的记忆卡片。'}
function mem(except){const scope=state.settings.memoryScope||'cards';if(scope==='none')return'';const parts=[];state.texts.filter(t=>t.id!==except).forEach(t=>{let body=[];if(scope==='article_cards'||scope==='article_chat_cards')body.push(`【文章全文《${t.title}》】\n${t.paragraphs.map(p=>p.text).join('\n')}`);if(scope==='article_chat_cards')body.push(`【我和AI关于《${t.title}》的聊天记录】\n${t.paragraphs.map((p,i)=>(p.chat||[]).length?`第${i+1}段：\n`+(p.chat||[]).map(m=>(m.role==='user'?'用户':'AI')+'：'+m.content).join('\n'):'').filter(Boolean).join('\n\n')||'无'}`);body.push(`【《${t.title}》启用的记忆卡片】\n${memoryTextForArticle(t)}`);parts.push(body.join('\n\n'))});const misc=[];(state.miscMemory||[]).filter(cardEnabled).forEach(c=>misc.push(`[${cardOwner(c)==='ai'?'AI':'用户'}其他记忆] 时间：${fmt(cardWhen(c))}\n标题：${c.title||'无标题'}\n内容：${c.content||''}`));if(misc.length)parts.push('【其他启用记忆】\n'+misc.join('\n\n'));return parts.join('\n\n---\n\n')}
function parseJson(raw){let s=String(raw||'').trim().replace(/^```json\s*/i,'').replace(/^```\s*/i,'').replace(/```$/,'').trim();try{return JSON.parse(s)}catch(e){}const m=s.match(/\{[\s\S]*\}/);if(m){try{return JSON.parse(m[0])}catch(e){}}return null}
function normStr(s){return String(s||'').replace(/\s+/g,'').replace(/[“”"'《》【】（）()，。！？、；：,.!?;:]/g,'')}
function bestParagraphByQuote(t,quote){const q=normStr(quote);if(!q)return-1;let best=-1,score=0;t.paragraphs.forEach((p,i)=>{const tx=normStr(p.text);let s=0;if(tx.includes(q))s=q.length;else{for(let len=Math.min(q.length,24);len>=6;len--){for(let a=0;a+len<=q.length;a++){if(tx.includes(q.slice(a,a+len))){s=len;break}}if(s)break}}if(s>score){score=s;best=i}});return score>=6?best:-1}
function anchorComments(t,rawComments){const out=[];(Array.isArray(rawComments)?rawComments:[]).forEach(c=>{const pid=String(c.paragraphId||c.id||'');let idx=t.paragraphs.findIndex(p=>String(p.id)===pid);const byQuote=bestParagraphByQuote(t,c.quote||'');if(byQuote>=0)idx=byQuote;else if(idx<0&&Number.isInteger(Number(c.paragraphIndex)))idx=Number(c.paragraphIndex);if(idx<0||idx>=t.paragraphs.length)return;const p=t.paragraphs[idx];const quote=String(c.quote||'').trim();if(quote&&bestParagraphByQuote({paragraphs:[p]},quote)<0)return;out.push({paragraphId:p.id,paragraphIndex:idx,quote,tag:c.tag||'批注',comment:c.comment||'',createdAt:now()})});return out}
async function annotate(t){t.reading=true;t.started=Date.now();t.error='';save();renderReader(t.id);try{const paraPayload=t.paragraphs.map((p,i)=>({paragraphIndex:i,paragraphId:p.id,text:p.text}));const input=[`文章标题：${t.title}`,'',mem(t.id)||'无过往记忆。','','下面是段落数组。每段都有 paragraphIndex 和 paragraphId。批注必须优先使用 paragraphId，并复制该段里的 quote。',JSON.stringify(paraPayload),'','只返回 JSON：{"overallNote":"250字以内阅读概要","outline":"详细 Markdown 大纲","comments":[{"paragraphId":"p_xxx","paragraphIndex":0,"quote":"原文短句","tag":"氛围/人物/伏笔/情绪/结构/语言","comment":"30字以内批注"}]}','','硬性要求：comments 只挑重要段落；每条 quote 必须来自同一个 paragraphId 的原文；不要输出 JSON 外文字。'].join('\n');const r=await ask(state.settings.annotatePrompt,input);const j=parseJson(r.text);if(!j)throw Error('AI 没有返回可解析 JSON。原文：'+r.text.slice(0,800));t.aiMemo=j.overallNote||'';t.aiOutline=j.outline||'';t.aiComments=anchorComments(t,j.comments);const content=[t.aiMemo?'## 阅读概要\n'+t.aiMemo:'',t.aiOutline?'## 详细大纲\n'+t.aiOutline:''].filter(Boolean).join('\n\n');if(content)t.cards.unshift({id:uid('c'),owner:'ai',category:'outline',type:'outline',title:'文章大纲',content,createdAt:now(),eventTime:now(),enabled:true});toast(`AI 阅读完成，已锚定 ${t.aiComments.length} 条批注`)}catch(e){t.error=e.message;toast('AI 阅读失败，已记录错误')}finally{t.reading=false;t.started=null;t.updatedAt=now();save();renderReader(t.id)}}
function pickTxt(){document.getElementById('txt').click()}document.getElementById('txt').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(!state.settings.apiKey){openSettings();toast('请先填写 API Key');return}const content=await f.text();const ps=splitTxt(content);if(!ps.length)return alert('没有读到有效段落');const t={id:uid('t'),title:f.name.replace(/\.txt$/i,''),content,paragraphs:ps,aiComments:[],aiMemo:'',aiOutline:'',myMemo:'',cards:[],reading:false,started:null,error:'',createdAt:now(),updatedAt:now()};state.texts.unshift(t);save();renderReader(t.id);annotate(t)});
function comments(t,i){const p=t.paragraphs[i];return(t.aiComments||[]).filter(c=>c.paragraphId?p&&c.paragraphId===p.id:Number(c.paragraphIndex)===i)}
function runSearch(){searchQuery=searchDraft.trim();renderHome()}function clearSearch(){searchDraft='';searchQuery='';renderHome()}function searchHitText(s,q){const idx=String(s||'').toLowerCase().indexOf(q.toLowerCase());if(idx<0)return String(s||'').slice(0,180)+(String(s||'').length>180?'…':'');const start=Math.max(0,idx-50),end=Math.min(String(s||'').length,idx+q.length+110);return (start?'…':'')+String(s||'').slice(start,end)+(end<String(s||'').length?'…':'')}function buildSearch(q){const article=[],chat=[],cards=[];if(!q)return{article,chat,cards};state.texts.forEach(t=>{t.paragraphs.forEach((p,i)=>{if((p.text||'').toLowerCase().includes(q.toLowerCase()))article.push({t,i,text:p.text});(p.chat||[]).forEach((m,mi)=>{if((m.content||'').toLowerCase().includes(q.toLowerCase()))chat.push({t,i,mi,role:m.role,text:m.content})})});(t.cards||[]).forEach((c,ci)=>{const blob=[c.title,c.content,c.excerpt,catInfo(cat(c))[1],cardOwner(c)==='ai'?'AI':'用户'].join('\n');if(blob.toLowerCase().includes(q.toLowerCase()))cards.push({t,ci,c,text:blob})})});(state.miscMemory||[]).forEach((c,ci)=>{const blob=[c.title,c.content,catInfo(cat(c))[1],cardOwner(c)==='ai'?'AI':'用户'].join('\n');if(blob.toLowerCase().includes(q.toLowerCase()))cards.push({t:null,ci,c,text:blob,misc:true})});return{article,chat,cards}}
function searchBucket(title,count,items,empty){return`<div class="search-bucket"><h3>${title} <span class="small">(${count})</span></h3>${items.length?items.join(''):`<p class="small">${empty}</p>`}</div>`}function goPara(tid,i){renderReader(tid);setTimeout(()=>{const el=document.getElementById('para_'+i);if(el)el.scrollIntoView({behavior:'smooth',block:'center'});},60)}function goChat(tid,i){goPara(tid,i);setTimeout(()=>openChat(i),140)}function goCard(tid,owner,category){if(tid){current=tid;openMemoryList(owner,tid,category)}else openMiscMemory(owner)}
function renderHome(){current=null;closeSide();const r=document.getElementById('root');let searchHtml=`<div class="home"><div class="block"><label style="margin-top:0">搜索</label><div class="searchbar"><input value="${esc(searchDraft)}" placeholder="输入完整关键词后点击搜索…" oninput="searchDraft=this.value" onkeydown="if(event.key==='Enter'){event.preventDefault();searchDraft=this.value;runSearch()}"><button onclick="searchDraft=this.previousElementSibling.value;runSearch()">搜索</button>${searchQuery?'<button class="mini" onclick="clearSearch()">清空</button>':''}</div><div class="small" style="margin-top:8px">不会边打边搜。输入完后点搜索，结果会分为文章内容、聊天记录、记忆卡片三类。</div></div>`;if(searchQuery){const hits=buildSearch(searchQuery);searchHtml+=`<div class="search-result-grid">`;searchHtml+=searchBucket('文章内容',hits.article.length,hits.article.slice(0,50).map(h=>`<div class="hit" onclick="goPara('${h.t.id}',${h.i})"><div class="hit-title">《${esc(h.t.title)}》 · 第 ${h.i+1} 段</div><div class="hit-text">${esc(searchHitText(h.text,searchQuery))}</div></div>`),'没有在文章正文里找到。');searchHtml+=searchBucket('我和 AI 的聊天记录',hits.chat.length,hits.chat.slice(0,50).map(h=>`<div class="hit" onclick="goChat('${h.t.id}',${h.i})"><div class="hit-title">《${esc(h.t.title)}》 · 第 ${h.i+1} 段 · ${h.role==='user'?'我的消息':'AI 回复'}</div><div class="hit-text">${esc(searchHitText(h.text,searchQuery))}</div></div>`),'没有在聊天记录里找到。');searchHtml+=searchBucket('我和 AI 的记忆卡片',hits.cards.length,hits.cards.slice(0,50).map(h=>`<div class="hit" onclick="goCard(${h.t?`'${h.t.id}'`:'null'},'${cardOwner(h.c)}','${cat(h.c)}')"><div class="hit-title">${h.t?'《'+esc(h.t.title)+'》':'其他记忆'} · ${cardOwner(h.c)==='ai'?'AI 记忆':'用户记忆'} · ${esc(catInfo(cat(h.c))[1])}</div><div class="hit-text"><b>${esc(h.c.title||'未命名记忆')}</b><br>${esc(searchHitText(h.c.content||h.text,searchQuery))}</div></div>`),'没有在记忆卡片里找到。');searchHtml+=`</div>`}if(!state.texts.length){r.innerHTML=searchHtml+'<div class="empty"><div><h1>还没有文章</h1><p>点右上角“导入”上传 TXT。<br>V7 使用文字标签和三类搜索结果。</p></div></div></div>';return}r.innerHTML=searchHtml+'<div class="books">'+state.texts.map((t,i)=>`<div class="book" onclick="renderReader('${t.id}')"><h2>${esc(t.title)}</h2><div class="meta">文章 ${i+1} · ${t.content.length} 字 · ${t.paragraphs.length} 段 · 批注 ${(t.aiComments||[]).length} 条 · AI记忆 ${cardCount(t,'ai')} · 用户记忆 ${cardCount(t,'user')}<br>${fmt(t.updatedAt)}</div></div>`).join('')+'</div></div>'}
function renderReader(id){const t=state.texts.find(x=>x.id===id);if(!t)return renderHome();current=id;const stat=t.reading?`<div class="status"><span class="spin"></span>AI 正在阅读全文 <span data-start="${t.started||Date.now()}">0 秒</span></div>`:t.error?`<div class="box fail">AI 阅读失败：\n${esc(t.error)}</div>`:'';document.getElementById('root').innerHTML=`<div class="reader"><div class="sticky-back"><button class="ghost" onclick="renderHome()">返回书架</button></div><div class="reader-head"><div class="nav"><button class="ghost" onclick="renderHome()">书架</button><div class="row"><button class="mini" onclick="toggleNotes()">记忆</button><button class="mini blue" onclick="annotate(text())">重读全文</button><button class="mini red" onclick="delText('${t.id}')">删除</button></div></div><h1>${esc(t.title)}</h1><div class="meta">${t.content.length} 字 · ${t.paragraphs.length} 段</div>${stat}</div><div class="novel">${t.paragraphs.map((p,i)=>{const cs=comments(t,i),hasC=cs.length,hasH=(p.chat||[]).length;return`<div id="para_${i}" class="para"><p>${esc(p.text)}<button title="打开这一段" class="tri ${hasC?'c':''} ${hasH?'h':''}" onclick="openChat(${i})"></button>${esc(p.breakAfter||'')}</p>${cs.map(c=>`<div class="note-inline"><span class="tag">${esc(c.tag)}</span>${esc(c.comment)}</div>`).join('')}</div>`}).join('')}</div></div>`;tickReading()}

function chatHtml(m,i){const ai=m.role==='assistant';const meta=[fmt(m.createdAt),m.edited?'已编辑':'',ai&&m.seconds?m.seconds+' 秒':'',ai&&m.tokens?'tokens '+(m.tokens.total_tokens||m.tokens.total||'?'):''].filter(Boolean).join(' · ');const content=editing===i?`<textarea id="edit_${i}">${esc(m.content)}</textarea><div class="row" style="margin-top:7px"><button class="mini green" onclick="saveEdit(${i},false)">保存</button>${!ai?`<button class="mini red" onclick="saveEdit(${i},true)">保存并重新回复</button>`:''}<button class="mini" onclick="editing=-1;renderChat()">取消</button></div>`:(ai?md(m.content):esc(m.content));return`<div class="chat ${ai?'':'user'}"><div class="avatar">${ai?'AI':'我'}</div><div class="wrap"><div class="role">${ai?'阅读助手':'我的问题'}</div><div class="bubble ${ai?'ai':'me'}">${content}<div class="chat-meta">${esc(meta)}</div><div class="acts"><button class="mini" onclick="editing=${i};renderChat()">编辑</button>${ai?`<button class="mini green" onclick="saveInsight(${i})">摘到AI记忆</button>`:`<button class="mini red" onclick="regen(${i})">重新回复</button>`}<button class="mini red" onclick="deleteMsg(${i})">删除</button></div></div></div></div>`}
async function sendChat(){const box=document.getElementById('askBox'),q=(box?.value||'').trim();if(!q)return;const t=text(),p=t.paragraphs[paraIndex];p.chat.push({id:uid('m'),role:'user',content:q,createdAt:now(),updatedAt:now()});save();await replyFrom(p.chat.length-1,q)}
function chatInput(userMsg,history){const t=text(),i=paraIndex,p=t.paragraphs[i],cs=comments(t,i);return [mem(t.id)||'无额外阅读记忆。','','【当前段 AI 批注】',cs.map(c=>`${c.tag}：${c.comment}${c.quote?'｜锚点：'+c.quote:''}`).join('\n')||'无','','【上一段】',t.paragraphs[i-1]?.text||'无','','【当前段】',p.text,'','【下一段】',t.paragraphs[i+1]?.text||'无','','【本段已有对话】',history.map(m=>(m.role==='user'?'用户':'AI')+'：'+m.content).join('\n\n')||'无','','【用户现在的问题】',userMsg].join('\n')}
async function replyFrom(userIndex,userMsg){const t=text(),p=t.paragraphs[paraIndex];thinking=true;chatStarted=Date.now();let aiIndex=-1,full='',lastPaint=0;renderChat();try{const r=await askStream(state.settings.chatPrompt,chatInput(userMsg,p.chat.slice(0,userIndex)),(d,c,u)=>{full=c;if(aiIndex<0){p.chat.push({id:uid('m'),role:'assistant',content:'',createdAt:now(),updatedAt:now(),seconds:0,tokens:null});aiIndex=p.chat.length-1}p.chat[aiIndex].content=full;p.chat[aiIndex].updatedAt=now();if(u)p.chat[aiIndex].tokens=u;if(Date.now()-lastPaint>120){lastPaint=Date.now();renderChat()}});if(aiIndex<0){p.chat.push({id:uid('m'),role:'assistant',content:r.text||'AI 没有返回内容。',createdAt:now(),updatedAt:now(),seconds:r.seconds||0,tokens:r.usage||null});aiIndex=p.chat.length-1}else{p.chat[aiIndex].seconds=r.seconds||0;p.chat[aiIndex].tokens=r.usage||p.chat[aiIndex].tokens}if(p.chat.filter(m=>m.role==='assistant').length%3===0)t.cards.push({id:uid('c'),owner:'ai',category:'chat',type:'chat',title:`第${paraIndex+1}段 聊天感悟`,content:p.chat[aiIndex].content,excerpt:p.text.slice(0,120),eventTime:now(),createdAt:now(),enabled:true})}catch(e){if(e.name!=='AbortError')p.chat.push({id:uid('m'),role:'assistant',content:'请求失败：\n'+e.message,createdAt:now(),updatedAt:now()})}finally{thinking=false;chatStarted=0;stopChatTimer();aborter=null;t.updatedAt=now();save();renderReader(t.id);renderChat()}}
function stopReq(){if(aborter)aborter.abort();thinking=false;chatStarted=0;stopChatTimer();toast('已停止');renderChat()}function regen(i){const t=text(),p=t.paragraphs[paraIndex],m=p.chat[i];if(!m||m.role!=='user')return;p.chat=p.chat.slice(0,i+1);save();replyFrom(i,m.content)}function saveEdit(i,rerun){const t=text(),p=t.paragraphs[paraIndex],m=p.chat[i],el=document.getElementById('edit_'+i);m.content=(el.value||'').trim();m.updatedAt=now();m.edited=true;editing=-1;save();if(rerun&&m.role==='user'){p.chat=p.chat.slice(0,i+1);replyFrom(i,m.content)}else renderChat()}function deleteMsg(i){const t=text(),p=t?.paragraphs?.[paraIndex];if(!p||!confirm('删除这条消息？'))return;p.chat.splice(i,1);save();renderChat();renderReader(t.id)}function saveInsight(i){const t=text(),p=t.paragraphs[paraIndex],m=p.chat[i];t.cards=t.cards||[];t.cards.push({id:uid('c'),owner:'ai',category:'chat',type:'chat',title:`第${paraIndex+1}段 聊天感悟`,content:m.content,excerpt:p.text.slice(0,120),eventTime:now(),createdAt:now(),enabled:true});save();toast('已摘到 AI 记忆 / 聊天感悟')}
function toggleNotes(){if(panel&&String(panel).startsWith('mem'))return closeSide();openMemoryRoot()}function ownerTitle(owner){return owner==='ai'?'AI 记忆卡片':'用户记忆卡片'}function ownerLabel(owner){return owner==='ai'?'AI':'用户'}
function openMemoryRoot(){panel='memRoot';const body=`<div class="small">记忆库分成用户记忆和 AI 记忆。每张卡都有时间、标题、内容、是否启用。</div><div class="books" style="margin-top:12px"><div class="book" onclick="openMemoryOwner('user')"><h2><span class="labelmark">用户</span>用户记忆卡片</h2><div class="meta">你自己添加和编辑的记忆。</div></div><div class="book" onclick="openMemoryOwner('ai')"><h2><span class="labelmark">AI</span>AI 记忆卡片</h2><div class="meta">AI 生成的大纲、聊天感悟和其他想法。</div></div></div>`;openSide('记忆库',body)}
function openMemoryOwner(owner){panel='memOwner';const misc=(state.miscMemory||[]).filter(c=>cardOwner(c)===owner).length;let body=`<button class="mini" onclick="openMemoryRoot()">返回</button><div class="books" style="margin-top:12px">`;body+=state.texts.map((t,i)=>`<div class="book" onclick="openMemoryArticle('${owner}','${t.id}')"><h2><span class="labelmark">${ownerLabel(owner)}</span>${esc(t.title)} <span class="small">(${cardCount(t,owner)})</span></h2><div class="meta">文章 ${i+1} · 大纲 ${cardCount(t,owner,'outline')} · 聊天感悟 ${cardCount(t,owner,'chat')} · 其他 ${cardCount(t,owner,'other')}</div></div>`).join('');body+=`<div class="book" onclick="openMiscMemory('${owner}')"><h2><span class="labelmark">其他</span>其他 <span class="small">(${misc})</span></h2><div class="meta">${owner==='ai'?'AI 对自己、生活、你需要它记住的事情。':'你随手记录的其他记忆。'}</div></div></div>`;openSide(ownerTitle(owner),body)}
function openMemoryArticle(owner,id){panel='memArticle';const t=state.texts.find(x=>x.id===id);if(!t)return;current=id;let body=`<button class="mini" onclick="openMemoryOwner('${owner}')">返回</button><div class="books" style="margin-top:12px">`;['outline','chat','manual','other'].forEach(c=>{body+=`<div class="book" onclick="openMemoryList('${owner}','${id}','${c}')"><h2><span class="labelmark">${catInfo(c)[0]}</span>${c==='outline'?esc(t.title):catInfo(c)[1]} <span class="small">(${cardCount(t,owner,c)})</span></h2><div class="meta">${c==='outline'?'查看 / 修改大纲。':c==='chat'?'AI 在聊天里觉得值得记住的地方。':c==='manual'?'手动补充的记忆卡片。':'关于自己、生活、你需要它记住的事情。'}</div></div>`});body+='</div>';openSide((owner==='ai'?'AI':'用户')+' · '+t.title,body)}
function openMemoryList(owner,id,category){panel='memList';const t=state.texts.find(x=>x.id===id);if(!t)return;current=id;const list=(t.cards||[]).map((c,i)=>({c,i})).filter(o=>cardOwner(o.c)===owner&&cat(o.c)===category);let body=`<button class="mini" onclick="openMemoryArticle('${owner}','${id}')">返回</button><div class="row" style="margin:10px 0"><button class="mini green" onclick="addMemoryCard('${owner}','${id}','${category}')">新增记忆卡片</button></div>`;body+=list.length?list.map(o=>memoryCardHtml(o.c,o.i,owner,id,category)).join(''):'<p class="small">暂无记忆卡片。</p>';openSide(`${owner==='ai'?'AI':'用户'} · ${catInfo(category)[1]}`,body)}
function memoryCardHtml(c,i,owner,id,category){return`<div class="card"><div class="row" style="justify-content:space-between"><div class="time">${fmt(cardWhen(c))}</div><span class="pill">${cardEnabled(c)?'已启用':'已停用'}</span></div><h4>${esc(c.title||'未命名记忆')}</h4><div class="content">${cat(c)==='outline'||cat(c)==='chat'?md(c.content):esc(c.content)}</div>${c.excerpt?`<div class="excerpt">原文：${esc(c.excerpt)}…</div>`:''}<div class="row" style="margin-top:9px"><button class="mini" onclick="editMemoryCard(${i},'${owner}','${id}','${category}')">编辑</button><button class="mini ${cardEnabled(c)?'red':'green'}" onclick="toggleMemoryCard(${i},'${owner}','${id}','${category}')">${cardEnabled(c)?'停用':'启用'}</button><button class="mini red" onclick="deleteMemoryCard(${i},'${owner}','${id}','${category}')">删除</button></div></div>`}
function addMemoryCard(owner,id,category){const t=state.texts.find(x=>x.id===id);if(!t)return;const n={id:uid('c'),owner,category,type:category,title:category==='outline'?t.title:'新记忆',content:'',eventTime:now(),createdAt:now(),enabled:true};t.cards=t.cards||[];t.cards.push(n);save();editMemoryCard(t.cards.length-1,owner,id,category)}
function editMemoryCard(i,owner,id,category){const t=state.texts.find(x=>x.id===id);const c=t?.cards?.[i];if(!c)return;openSide('编辑记忆卡片',`<button class="mini" onclick="openMemoryList('${owner}','${id}','${category}')">返回</button><label>时间（AI 不知道准确时间时，你可以手动填）</label><input id="mcTime" type="datetime-local" value="${esc(toLocalInput(cardWhen(c)))}"><label>标题</label><input id="mcTitle" value="${esc(c.title||'')}"><label>内容</label><textarea id="mcContent" style="min-height:220px">${esc(c.content||'')}</textarea><label><input id="mcEnabled" type="checkbox" ${cardEnabled(c)?'checked':''} style="width:auto;margin-right:6px">启用这张记忆</label><div class="row" style="margin-top:12px"><button class="mini green" onclick="saveMemoryCard(${i},'${owner}','${id}','${category}')">保存</button><button class="mini" onclick="openMemoryList('${owner}','${id}','${category}')">取消</button></div>`)}
function saveMemoryCard(i,owner,id,category){const t=state.texts.find(x=>x.id===id);const c=t?.cards?.[i];if(!c)return;c.owner=owner;c.category=category;c.type=category;c.eventTime=new Date(document.getElementById('mcTime').value||Date.now()).toISOString();c.title=document.getElementById('mcTitle').value.trim()||'未命名记忆';c.content=document.getElementById('mcContent').value;c.enabled=document.getElementById('mcEnabled').checked;c.updatedAt=now();save();openMemoryList(owner,id,category);toast('记忆已保存')}function toggleMemoryCard(i,owner,id,category){const t=state.texts.find(x=>x.id===id);const c=t?.cards?.[i];if(!c)return;c.enabled=!cardEnabled(c);save();openMemoryList(owner,id,category)}function deleteMemoryCard(i,owner,id,category){const t=state.texts.find(x=>x.id===id);if(!t||!confirm('删除这张记忆卡片？'))return;t.cards.splice(i,1);save();openMemoryList(owner,id,category)}
function openMiscMemory(owner){panel='memMisc';state.miscMemory=state.miscMemory||[];const list=state.miscMemory.map((c,i)=>({c,i})).filter(o=>cardOwner(o.c)===owner);let body=`<button class="mini" onclick="openMemoryOwner('${owner}')">返回</button><div class="row" style="margin:10px 0"><button class="mini green" onclick="addMiscMemory('${owner}')">新增其他记忆</button></div>`+ (list.length?list.map(o=>miscCardHtml(o.c,o.i,owner)).join(''):'<p class="small">暂无。</p>');openSide((owner==='ai'?'AI':'用户')+' · 其他记忆',body)}
function miscCardHtml(c,i,owner){return`<div class="card"><div class="row" style="justify-content:space-between"><div class="time">${fmt(cardWhen(c))}</div><span class="pill">${cardEnabled(c)?'已启用':'已停用'}</span></div><h4>${esc(c.title||'其他记忆')}</h4><div class="content">${esc(c.content||'')}</div><div class="row" style="margin-top:9px"><button class="mini" onclick="editMiscMemory(${i},'${owner}')">编辑</button><button class="mini ${cardEnabled(c)?'red':'green'}" onclick="toggleMiscMemory(${i},'${owner}')">${cardEnabled(c)?'停用':'启用'}</button><button class="mini red" onclick="deleteMiscMemory(${i},'${owner}')">删除</button></div></div>`}
function addMiscMemory(owner){state.miscMemory=state.miscMemory||[];state.miscMemory.push({id:uid('c'),owner,category:'other',title:'其他记忆',content:'',eventTime:now(),createdAt:now(),enabled:true});save();editMiscMemory(state.miscMemory.length-1,owner)}function editMiscMemory(i,owner){const c=state.miscMemory?.[i];if(!c)return;openSide('编辑其他记忆',`<button class="mini" onclick="openMiscMemory('${owner}')">返回</button><label>时间</label><input id="mcTime" type="datetime-local" value="${esc(toLocalInput(cardWhen(c)))}"><label>标题</label><input id="mcTitle" value="${esc(c.title||'')}"><label>内容</label><textarea id="mcContent" style="min-height:220px">${esc(c.content||'')}</textarea><label><input id="mcEnabled" type="checkbox" ${cardEnabled(c)?'checked':''} style="width:auto;margin-right:6px">启用这张记忆</label><div class="row" style="margin-top:12px"><button class="mini green" onclick="saveMiscMemory(${i},'${owner}')">保存</button><button class="mini" onclick="openMiscMemory('${owner}')">取消</button></div>`)}function saveMiscMemory(i,owner){const c=state.miscMemory?.[i];if(!c)return;c.owner=owner;c.eventTime=new Date(document.getElementById('mcTime').value||Date.now()).toISOString();c.title=document.getElementById('mcTitle').value.trim()||'其他记忆';c.content=document.getElementById('mcContent').value;c.enabled=document.getElementById('mcEnabled').checked;c.updatedAt=now();save();openMiscMemory(owner);toast('记忆已保存')}function toggleMiscMemory(i,owner){const c=state.miscMemory?.[i];if(!c)return;c.enabled=!cardEnabled(c);save();openMiscMemory(owner)}function deleteMiscMemory(i,owner){if(!confirm('删除这张记忆？'))return;state.miscMemory.splice(i,1);save();openMiscMemory(owner)}
function openSettings(){panel='settings';const ms=state.settings.models||[];const opts=ms.map(m=>`<option value="${esc(m)}" ${m===state.settings.model?'selected':''}>${esc(m)}</option>`).join('');const scope=state.settings.memoryScope||'cards';openSide('设置',`<div class="block"><h4>API 配置</h4><label>API URL</label><input id="apiBase" value="${esc(state.settings.apiBaseUrl)}"><label>API Key</label><input id="apiKey" type="password" value="${esc(state.settings.apiKey)}"><label>接口模式</label><select id="endpoint"><option value="auto" ${state.settings.endpoint==='auto'?'selected':''}>自动：Responses 失败后试 Chat Completions</option><option value="responses" ${state.settings.endpoint==='responses'?'selected':''}>只用 Responses API</option><option value="chat" ${state.settings.endpoint==='chat'?'selected':''}>只用 Chat Completions</option></select><label>当前模型</label><input id="model" value="${esc(state.settings.model)}">${ms.length?`<div class="box"><label style="margin-top:0">从已拉取模型里选择</label><select onchange="document.getElementById('model').value=this.value"><option value="">选择模型…</option>${opts}</select></div>`:'<div class="box small">拉取模型后，这里会出现模型选择方框。</div>'}<div class="row" style="margin-top:10px"><button class="mini" onclick="pullModels()">拉取模型</button><button class="mini green" onclick="testConnection()">测试连接</button></div><div id="testBox" class="box">尚未测试。V7 会真的发消息给模型；失败会显示完整错误。</div></div><div class="block"><h4>跨文章记忆读取</h4><label>AI 打开段落聊天时，可以读取哪些过往记忆？</label><select id="memoryScope"><option value="none" ${scope==='none'?'selected':''}>不读取过往记忆</option><option value="cards" ${scope==='cards'?'selected':''}>只读取启用的记忆卡片</option><option value="article_cards" ${scope==='article_cards'?'selected':''}>读取文章全文 + 启用记忆卡片</option><option value="article_chat_cards" ${scope==='article_chat_cards'?'selected':''}>读取文章全文 + 我们的聊天记录 + 启用记忆卡片</option></select></div><div class="block"><h4>提示词</h4><label>全文阅读提示词</label><textarea id="ann">${esc(state.settings.annotatePrompt)}</textarea><label>段落聊天提示词</label><textarea id="chatp">${esc(state.settings.chatPrompt)}</textarea><button class="mini" onclick="resetPrompt()">恢复默认</button></div><div class="block"><h4>导入 / 导出</h4><div class="row"><button class="mini" onclick="exportData()">导出全部数据</button><button class="mini" onclick="document.getElementById('imp').click()">导入数据</button><button class="mini" onclick="exportNotes()">导出当前笔记</button></div><p class="small" style="margin-top:9px">导出不会包含 API Key。纯 HTML 会把 Key 保存在本机 localStorage。</p></div><button onclick="saveSettings(true)">保存设置</button>`)}
function saveSettings(close){const g=id=>document.getElementById(id);if(g('apiBase'))state.settings.apiBaseUrl=g('apiBase').value.trim().replace(/\/$/,'');if(g('apiKey'))state.settings.apiKey=g('apiKey').value.trim();if(g('model'))state.settings.model=g('model').value.trim();if(g('endpoint'))state.settings.endpoint=g('endpoint').value;if(g('memoryScope'))state.settings.memoryScope=g('memoryScope').value;if(g('ann'))state.settings.annotatePrompt=g('ann').value;if(g('chatp'))state.settings.chatPrompt=g('chatp').value;save();if(close){toast('已保存');closeSide()}}function resetPrompt(){document.getElementById('ann').value=defaultAnnotate();document.getElementById('chatp').value=defaultChat();toast('已恢复，记得保存')}
function exportData(){saveSettings(false);const copy=JSON.parse(JSON.stringify(state));copy.settings.apiKey='';download(`ai-reader-v7-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(copy,null,2),'application/json')}document.getElementById('imp').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const data=JSON.parse(await f.text());if(!confirm('导入会覆盖当前数据，确定？'))return;const old=state.settings.apiKey;state=norm(data);if(!state.settings.apiKey)state.settings.apiKey=old;save();renderHome();toast('导入完成')});function exportNotes(){const t=text();if(!t)return toast('请先打开一篇文章');const lines=[`# ${t.title}`,'','## AI 阅读概要',t.aiMemo||'暂无','','## AI 详细大纲',t.aiOutline||'暂无','','## 我的备忘录',t.myMemo||'暂无','','## 卡片'];(t.cards||[]).forEach(c=>lines.push('',`### ${c.title||'笔记'}`,fmt(c.createdAt),'',c.content||'',c.excerpt?`\n> 原文：${c.excerpt}…`:''));download(`${t.title}-笔记.md`,lines.join('\n'),'text/markdown;charset=utf-8')}function download(name,content,type){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(u)}function delText(id){const t=state.texts.find(x=>x.id===id);if(!t||!confirm(`删除《${t.title}》？`))return;state.texts=state.texts.filter(x=>x.id!==id);save();renderHome()}
renderHome();
</script>
