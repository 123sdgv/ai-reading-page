<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 阅读器</title>
  <style>
    :root {
      --paper: #f7f1e8;
      --paper-deep: #efe5d8;
      --ink: #2b251f;
      --muted: #8a7a68;
      --line: #dfd0be;
      --panel: #fffaf3;
      --accent: #6f553a;
      --ai: #8a5f2d;
      --ai-bg: #f3e5cf;
      --dark: #2d241c;
      --green: #4a8c5c;
      --green-bg: rgba(74,140,92,0.12);
      --green-border: rgba(74,140,92,0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Segoe UI", sans-serif;
      overflow: hidden;
      height: 100vh;
    }

    button, input, textarea, select { font: inherit; }

    button {
      border: none;
      background: var(--dark);
      color: white;
      border-radius: 999px;
      padding: 7px 14px;
      cursor: pointer;
      font-size: 13px;
      transition: opacity .15s;
    }
    button:active { opacity: .7; }

    button.secondary {
      background: rgba(255,255,255,0.55);
      color: var(--ink);
      border: 1px solid var(--line);
    }

    button.ghost {
      background: transparent;
      color: var(--accent);
      padding: 4px 8px;
    }

    button.mini {
      font-size: 12px;
      padding: 3px 9px;
      background: rgba(111,85,58,0.1);
      color: var(--accent);
      border: 1px solid rgba(111,85,58,0.15);
    }

    button.icon {
      width: 36px; height: 36px; padding: 0;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 17px;
    }

    input, textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      background: #fffaf3;
      color: var(--ink);
      border-radius: 12px;
      padding: 9px 11px;
      outline: none;
      font-size: 14px;
    }

    textarea { resize: vertical; min-height: 80px; line-height: 1.6; }
    label { display: block; margin: 14px 0 5px; font-size: 12px; color: var(--muted); }

    /* ─── topbar ─── */
    .topbar {
      height: 50px;
      position: relative; z-index: 20;
      background: rgba(247,241,232,0.92);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(223,208,190,0.7);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 14px;
      flex-shrink: 0;
    }
    .topbar-group { display: flex; align-items: center; gap: 8px; }
    .brand { font-size: 14px; color: var(--muted); letter-spacing: .06em; }

    /* ─── layout ─── */
    .app-layout {
      display: flex;
      height: calc(100vh - 50px);
      overflow: hidden;
    }

    .reader-pane {
      flex: 1;
      overflow-y: auto;
      padding: 20px 18px 80px;
      transition: padding-right .25s;
    }

    .reader-pane.with-sidebar {
      /* nothing special, flex handles it */
    }

    .sidebar {
      width: 0;
      overflow: hidden;
      border-left: 1px solid var(--line);
      background: var(--panel);
      display: flex;
      flex-direction: column;
      transition: width .25s ease;
      flex-shrink: 0;
    }

    .sidebar.open {
      width: min(420px, 45vw);
    }

    .sidebar-header {
      min-height: 48px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; flex-shrink: 0;
    }
    .sidebar-header h2 { font-size: 15px; margin: 0; white-space: nowrap; }

    .sidebar-body {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
    }

    .sidebar-footer {
      border-top: 1px solid var(--line);
      padding: 10px 12px;
      display: none;
      gap: 8px;
      flex-shrink: 0;
    }
    .sidebar-footer.show { display: flex; }
    .sidebar-footer textarea { min-height: 42px; max-height: 120px; flex: 1; }

    /* ─── home ─── */
    .content-area {
      width: min(780px, 100%);
      margin: 0 auto;
    }

    .empty {
      min-height: 50vh;
      display: flex; align-items: center; justify-content: center;
      text-align: center; color: var(--muted); line-height: 1.9;
    }
    .empty h1 { font-size: 22px; margin-bottom: 8px; }

    .home-list { display: grid; gap: 12px; max-width: 600px; margin: 20px auto 0; }

    .book-card {
      background: rgba(255,250,243,0.72);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px 18px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(74,55,35,0.04);
      transition: box-shadow .15s;
    }
    .book-card:hover { box-shadow: 0 8px 28px rgba(74,55,35,0.08); }
    .book-card h2 { margin: 0 0 6px; font-size: 18px; font-weight: 600; }
    .meta { color: var(--muted); font-size: 12px; line-height: 1.6; }

    /* ─── reader ─── */
    .reader-head {
      max-width: 680px;
      margin: 0 auto 16px;
      padding: 8px 0 14px;
      border-bottom: 1px solid rgba(223,208,190,0.6);
    }
    .reader-tools {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; margin-bottom: 14px;
    }
    .reader-head h1 { margin: 0 0 6px; font-size: 23px; font-weight: 650; letter-spacing: .02em; }
    .reader-head .summary { color: var(--muted); font-size: 13px; line-height: 1.6; }

    .novel {
      max-width: 680px;
      margin: 0 auto;
      font-family: "Songti SC", "STSong", "Noto Serif SC", "Source Han Serif SC", "PingFang SC", serif;
      font-size: 17px;
      line-height: 1.75;
      letter-spacing: .015em;
    }

    .para-wrap {
      margin: 0 0 0.3em;
    }

    .novel-p {
      margin: 0;
      text-indent: 2em;
      white-space: pre-wrap;
    }

    .tri {
      display: inline-flex;
      align-items: center; justify-content: center;
      margin-left: 0.3em;
      width: 1.3em; height: 1.3em;
      border-radius: 50%;
      border: 1px solid rgba(111,85,58,0.22);
      background: rgba(111,85,58,0.07);
      color: var(--accent);
      font-size: 0.65em;
      vertical-align: middle;
      padding: 0;
      cursor: pointer;
      transform: translateY(-1px);
      transition: all .15s;
    }
    .tri:hover { background: rgba(111,85,58,0.15); }

    .tri.has-note {
      border-color: var(--green-border);
      background: var(--green-bg);
      color: var(--green);
    }
    .tri.has-note:hover { background: rgba(74,140,92,0.2); }

    /* inline note preview */
    .ai-note-inline {
      margin: 0.15em 0 0.35em 2.4em;
      padding: 6px 10px;
      max-width: 90%;
      border-left: 3px solid rgba(74,140,92,0.45);
      background: rgba(74,140,92,0.06);
      color: #3d6b48;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      font-size: 13px;
      line-height: 1.55;
      letter-spacing: 0;
      border-radius: 8px;
      cursor: pointer;
    }
    .ai-note-inline .ntag {
      display: inline-block;
      margin-right: 5px;
      font-size: 11px;
      color: #fff;
      background: rgba(74,140,92,0.72);
      border-radius: 999px;
      padding: 0 6px;
    }

    /* ─── sidebar cards ─── */
    .note-card {
      background: rgba(255,255,255,0.5);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    .note-card h3 { font-size: 14px; margin: 0 0 6px; }
    .note-card .note-time { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
    .note-card .note-body { font-size: 13px; line-height: 1.6; white-space: pre-wrap; color: var(--ink); }
    .note-card .note-quote {
      margin: 6px 0;
      padding: 5px 8px;
      border-left: 2px solid var(--line);
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .note-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }

    .current-para-box {
      background: rgba(243,229,207,0.45);
      border: 1px solid rgba(223,208,190,0.8);
      border-radius: 14px;
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 13px;
      line-height: 1.7;
      color: var(--ink);
      white-space: pre-wrap;
      max-height: 150px;
      overflow-y: auto;
    }

    .chat-msg {
      margin-bottom: 10px;
      padding: 10px 12px;
      border-radius: 14px;
      font-size: 13px;
      line-height: 1.65;
      white-space: pre-wrap;
    }
    .chat-user {
      margin-left: 30px;
      background: var(--dark);
      color: white;
    }
    .chat-ai {
      margin-right: 30px;
      background: rgba(111,85,58,0.1);
      color: var(--ink);
      border: 1px solid rgba(111,85,58,0.1);
    }
    .chat-tools { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }

    /* ─── thinking indicator ─── */
    .thinking-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 8px 0;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(111,85,58,0.08);
      font-size: 13px;
      color: var(--muted);
    }
    .thinking-dots span {
      display: inline-block;
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--accent);
      animation: dot-bounce .9s infinite;
      margin-right: 3px;
    }
    .thinking-dots span:nth-child(2) { animation-delay: .15s; }
    .thinking-dots span:nth-child(3) { animation-delay: .3s; }
    @keyframes dot-bounce {
      0%, 60%, 100% { opacity: .25; transform: translateY(0); }
      30% { opacity: 1; transform: translateY(-3px); }
    }
    .thinking-timer { font-variant-numeric: tabular-nums; }

    /* ─── settings panel (modal) ─── */
    .modal-mask {
      position: fixed; inset: 0; z-index: 80;
      background: rgba(45,36,28,0.3);
      display: none; align-items: center; justify-content: center;
    }
    .modal-mask.open { display: flex; }
    .modal-box {
      background: var(--panel);
      border-radius: 22px;
      padding: 22px;
      width: min(440px, 90vw);
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 16px 48px rgba(45,36,28,0.18);
    }
    .modal-box h2 { font-size: 17px; margin: 0 0 12px; }

    .small { color: var(--muted); font-size: 12px; line-height: 1.6; }

    .toast {
      position: fixed; left: 50%; bottom: 22px;
      transform: translateX(-50%);
      background: rgba(45,36,28,0.9);
      color: white; padding: 8px 14px;
      border-radius: 999px; font-size: 13px;
      z-index: 100; display: none;
      pointer-events: none;
    }

    /* loading overlay */
    .loading-overlay {
      position: fixed; inset: 0; z-index: 90;
      background: rgba(247,241,232,0.6);
      display: none; align-items: center; justify-content: center;
      flex-direction: column; gap: 12px;
    }
    .loading-overlay.show { display: flex; }
    .loading-overlay .spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--line);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-overlay .load-text { font-size: 14px; color: var(--muted); }
    .loading-overlay .load-timer { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

    @media (max-width: 700px) {
      .brand { display: none; }
      .sidebar.open { width: min(360px, 80vw); }
      .novel { font-size: 16px; line-height: 1.72; }
      .reader-head h1 { font-size: 20px; }
      .ai-note-inline { margin-left: 1.2em; max-width: 95%; }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="topbar-group">
      <button class="icon secondary" onclick="openNotesView()" title="阅读笔记">📒</button>
      <button class="icon secondary" onclick="openSettings()" title="API 设置">⚙</button>
    </div>
    <div class="brand">AI 阅读器</div>
    <div class="topbar-group">
      <button class="icon" onclick="document.getElementById('fileInput').click()" title="上传 TXT">＋</button>
      <input id="fileInput" type="file" accept=".txt,text/plain" hidden onchange="handleFileUpload(event)" />
    </div>
  </header>

  <div class="app-layout">
    <div id="readerPane" class="reader-pane">
      <div id="main" class="content-area"></div>
    </div>

    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <h2 id="sidebarTitle">侧边栏</h2>
        <button class="secondary" onclick="closeSidebar()" style="font-size:12px;">关闭</button>
      </div>
      <div id="sidebarBody" class="sidebar-body"></div>
      <div id="sidebarFooter" class="sidebar-footer"></div>
    </aside>
  </div>

  <!-- Settings Modal -->
  <div id="settingsModal" class="modal-mask" onclick="if(event.target===this)closeSettings()">
    <div class="modal-box" id="settingsBox"></div>
  </div>

  <!-- Loading Overlay -->
  <div id="loadingOverlay" class="loading-overlay">
    <div class="spinner"></div>
    <div class="load-text">AI 正在阅读全文…</div>
    <div class="load-timer" id="loadTimer">0s</div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    /* ───────── 状态管理 ───────── */
    const STORAGE_KEY = "ai_reader_v3";
    let state = loadState();
    let currentTextId = null;
    let currentChat = null;  // { textId, paragraphIndex }
    let thinkingTimer = null;

    function defaultState() {
      return {
        settings: { workerUrl: "", memoryMode: "none" },
        texts: []
      };
    }

    function loadState() {
      try {
        for (const key of ["ai_reader_v3", "ai_reader_v2", "ai_reader_v1"]) {
          const raw = localStorage.getItem(key);
          if (raw) return normalizeState(JSON.parse(raw));
        }
        return defaultState();
      } catch { return defaultState(); }
    }

    function normalizeState(input) {
      const base = defaultState();
      const next = {
        ...base, ...input,
        settings: { ...base.settings, ...(input.settings || {}) },
        texts: Array.isArray(input.texts) ? input.texts : []
      };
      next.texts = next.texts.map(t => ({
        id: t.id || uid("t"),
        title: t.title || "未命名",
        content: t.content || "",
        paragraphs: Array.isArray(t.paragraphs)
          ? t.paragraphs.map((p, i) => ({
              id: p.id || uid("p"),
              index: i,
              text: typeof p === "string" ? p : (p.text || ""),
              chatHistory: Array.isArray(p.chatHistory) ? p.chatHistory : []
            }))
          : [],
        aiComments: Array.isArray(t.aiComments) ? t.aiComments : [],
        aiMemo: t.aiMemo || t.aiReadingNote || "",
        aiNoteCards: Array.isArray(t.aiNoteCards) ? t.aiNoteCards : [],
        myMemo: t.myMemo || "",
        createdAt: t.createdAt || new Date().toISOString(),
        updatedAt: t.updatedAt || t.createdAt || new Date().toISOString()
      }));
      return next;
    }

    function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    function uid(p) { return p + "_" + Math.random().toString(36).slice(2, 8) + Date.now().toString(36); }
    function esc(s) { return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
    function fmtDate(iso) { if (!iso) return ""; try { return new Date(iso).toLocaleString("zh-CN"); } catch { return ""; } }
    function fmtTime(iso) { if (!iso) return ""; try { return new Date(iso).toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"}); } catch { return ""; } }
    function getText(id) { return state.texts.find(t => t.id === id); }

    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg; el.style.display = "block";
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => el.style.display = "none", 1800);
    }

    /* ───────── 智能分段 ───────── */
    function smartSplit(text) {
      // 1. 统一换行
      let s = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n");

      // 2. 先尝试按"连续空行"分段（这是最常见的TXT段落标记）
      let paragraphs = s.split(/\n\s*\n+/).map(p => p.trim()).filter(Boolean);

      // 3. 如果全文只分出了 1-2 段（说明作者没有用空行分段），改用单换行分
      if (paragraphs.length <= 2 && s.length > 500) {
        paragraphs = s.split(/\n/).map(p => p.trim()).filter(Boolean);
      }

      // 4. 合并过短的段落（< 15字的独立行合并到下一段，除非它看起来像标题/对话）
      const merged = [];
      let buffer = "";

      for (let i = 0; i < paragraphs.length; i++) {
        const line = paragraphs[i];
        const isDialogue = /^["""「『（]/.test(line);
        const isShort = line.length < 15;
        const nextExists = i + 1 < paragraphs.length;

        if (isShort && !isDialogue && nextExists && buffer.length === 0) {
          // 可能是标题行或者很短的独立句，先看下一段
          // 如果下一段也很短就合并
          buffer = line;
        } else if (buffer) {
          merged.push(buffer + "\n" + line);
          buffer = "";
        } else {
          merged.push(line);
        }
      }
      if (buffer) merged.push(buffer);

      // 5. 如果段落数太多（比如一句一段的情况），按每3-5段合并
      if (merged.length > 80) {
        const grouped = [];
        const groupSize = Math.ceil(merged.length / Math.ceil(merged.length / 4));
        for (let i = 0; i < merged.length; i += groupSize) {
          grouped.push(merged.slice(i, i + groupSize).join("\n"));
        }
        return grouped;
      }

      return merged.length ? merged : [text.trim()];
    }

    /* ───────── AI 记忆收集（不变） ───────── */
    function collectAiMemos(excludeId) {
      return state.texts.filter(t => t.id !== excludeId)
        .map(t => {
          const memo = (t.aiMemo||"").trim();
          const cards = (t.aiNoteCards||[]).map(c => c.body).join("\n");
          const full = [memo, cards].filter(Boolean).join("\n");
          return full ? `《${t.title}》\n${full}` : "";
        }).filter(Boolean).slice(-5);
    }

    function collectMyMemos(excludeId) {
      return state.texts.filter(t => t.id !== excludeId)
        .map(t => {
          const memo = (t.myMemo||"").trim();
          return memo ? `《${t.title}》\n${memo}` : "";
        }).filter(Boolean).slice(-5);
    }

    function commentsFor(text, pIdx) {
      return (text.aiComments||[]).filter(c => Number(c.paragraphIndex) === Number(pIdx));
    }

    /* ───────── 渲染：首页 ───────── */
    function renderHome() {
      currentTextId = null;
      closeSidebar();
      const main = document.getElementById("main");
      if (!state.texts.length) {
        main.innerHTML = `<div class="empty"><div><h1>还没有文章</h1><p>点右上角「＋」上传 UTF-8 TXT 文件<br>上传后 AI 会阅读全文，生成批注和阅读笔记</p></div></div>`;
        return;
      }
      main.innerHTML = `<div class="home-list">${state.texts.map(t => `
        <article class="book-card" onclick="renderReader('${t.id}')">
          <h2>${esc(t.title)}</h2>
          <div class="meta">${t.content.length} 字 / ${t.paragraphs.length} 段 / AI批注 ${(t.aiComments||[]).length} 条<br>${fmtDate(t.updatedAt)}</div>
        </article>
      `).join("")}</div>`;
    }

    /* ───────── 渲染：阅读页 ───────── */
    function renderReader(textId) {
      const text = getText(textId);
      if (!text) return renderHome();
      currentTextId = textId;
      text.updatedAt = new Date().toISOString();
      save();

      const main = document.getElementById("main");
      main.innerHTML = `
        <section class="reader-head">
          <div class="reader-tools">
            <button class="secondary" onclick="renderHome()">← 书架</button>
            <div class="topbar-group">
              <button class="mini" onclick="openNotesView()">📒 笔记</button>
              <button class="secondary" style="font-size:12px;color:#b44;" onclick="deleteText('${text.id}')">删除</button>
            </div>
          </div>
          <h1>${esc(text.title)}</h1>
          <div class="summary">${text.content.length} 字 / ${text.paragraphs.length} 段</div>
        </section>
        <article class="novel">
          ${text.paragraphs.map((p, i) => {
            const hasNote = commentsFor(text, i).length > 0;
            return `<section class="para-wrap">
              <p class="novel-p">${esc(p.text)}<button class="tri${hasNote ? " has-note" : ""}" onclick="openParaChat('${text.id}',${i})" title="${hasNote ? "有AI批注，点击查看" : "和AI聊聊这段"}">▸</button></p>
              ${commentsFor(text, i).map(c => `
                <div class="ai-note-inline" onclick="openParaChat('${text.id}',${i})">
                  <span class="ntag">${esc(c.tag||"AI")}</span>${esc(c.comment||"")}
                </div>
              `).join("")}
            </section>`;
          }).join("")}
        </article>
      `;
    }

    /* ───────── 侧边栏 ───────── */
    function openSidebar(title, bodyHtml, footerHtml) {
      document.getElementById("sidebarTitle").textContent = title;
      document.getElementById("sidebarBody").innerHTML = bodyHtml;
      const footer = document.getElementById("sidebarFooter");
      if (footerHtml) { footer.innerHTML = footerHtml; footer.classList.add("show"); }
      else { footer.innerHTML = ""; footer.classList.remove("show"); }
      document.getElementById("sidebar").classList.add("open");
    }

    function closeSidebar() {
      document.getElementById("sidebar").classList.remove("open");
      document.getElementById("sidebarFooter").classList.remove("show");
      currentChat = null;
      stopThinking();
    }

    /* ───────── 段落聊天侧边栏 ───────── */
    function openParaChat(textId, pIdx) {
      currentChat = { textId, paragraphIndex: pIdx };
      renderParaChat();
    }

    function renderParaChat() {
      if (!currentChat) return;
      const text = getText(currentChat.textId);
      const i = currentChat.paragraphIndex;
      const p = text.paragraphs[i];
      const comments = commentsFor(text, i);
      const history = p.chatHistory || [];

      let body = `<div class="current-para-box">${esc(p.text)}</div>`;

      if (comments.length) {
        body += `<div class="note-card"><h3 style="color:var(--green)">AI 批注</h3>`;
        comments.forEach(c => {
          body += `<div style="margin:4px 0;font-size:13px;line-height:1.55;"><span class="ntag" style="background:rgba(74,140,92,0.7);color:#fff;font-size:11px;border-radius:999px;padding:0 6px;margin-right:4px;">${esc(c.tag||"AI")}</span>${esc(c.comment||"")}</div>`;
        });
        body += `</div>`;
      }

      if (history.length) {
        history.forEach((m, idx) => {
          body += `<div class="chat-msg ${m.role==="user"?"chat-user":"chat-ai"}">${esc(m.content)}<div class="chat-tools">
            <button class="mini" onclick="excerptToMemo(${idx},'${m.role==="assistant"?"ai":"my"}')">${m.role==="assistant"?"摘到AI笔记":"摘到我的笔记"}</button>
          </div></div>`;
        });
      } else if (!comments.length) {
        body += `<p class="small" style="text-align:center;padding:12px;">可以和 AI 聊聊这一段</p>`;
      }

      body += `<div id="thinkingArea"></div>`;

      openSidebar(
        `第 ${i+1} 段`,
        body,
        `<textarea id="chatInput" placeholder="说点什么…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat()}"></textarea><button onclick="sendChat()">发送</button>`
      );

      // scroll to bottom
      setTimeout(() => {
        const sb = document.getElementById("sidebarBody");
        sb.scrollTop = sb.scrollHeight;
      }, 50);
    }

    /* ───────── thinking indicator ───────── */
    function startThinking() {
      stopThinking();
      const area = document.getElementById("thinkingArea");
      if (!area) return;
      const start = Date.now();
      area.innerHTML = `<div class="thinking-indicator"><div class="thinking-dots"><span></span><span></span><span></span></div><span>AI 思考中…</span><span class="thinking-timer" id="thinkTimer">0s</span></div>`;
      thinkingTimer = setInterval(() => {
        const el = document.getElementById("thinkTimer");
        if (el) el.textContent = Math.floor((Date.now() - start) / 1000) + "s";
      }, 500);
    }

    function stopThinking() {
      if (thinkingTimer) { clearInterval(thinkingTimer); thinkingTimer = null; }
      const area = document.getElementById("thinkingArea");
      if (area) area.innerHTML = "";
    }

    /* ───────── 发送聊天 ───────── */
    async function sendChat() {
      if (!currentChat) return;
      const input = document.getElementById("chatInput");
      const msg = (input.value || "").trim();
      if (!msg) return;
      input.value = "";

      const text = getText(currentChat.textId);
      const i = currentChat.paragraphIndex;
      const p = text.paragraphs[i];
      p.chatHistory = p.chatHistory || [];
      p.chatHistory.push({ role: "user", content: msg });
      save();
      renderParaChat();
      startThinking();

      try {
        const result = await callWorker("/chat", {
          currentParagraph: p.text,
          previousParagraph: text.paragraphs[i-1]?.text || "",
          nextParagraph: text.paragraphs[i+1]?.text || "",
          userMessage: msg,
          chatHistory: p.chatHistory.slice(0, -1),
          textAiNote: text.aiMemo || "",
          memoryMode: state.settings.memoryMode,
          aiNotes: collectAiMemos(text.id),
          myNotes: collectMyMemos(text.id)
        });

        stopThinking();
        const reply = result.reply || "AI 没有返回内容。";
        p.chatHistory.push({ role: "assistant", content: reply });

        // AI 可能在聊天中产生新感悟，尝试自动生成笔记卡片
        maybeAutoNoteCard(text, i, msg, reply);

        save();
        renderParaChat();
      } catch (err) {
        stopThinking();
        p.chatHistory.push({ role: "assistant", content: "请求失败：" + err.message });
        save();
        renderParaChat();
      }
    }

    /* 根据聊天内容，自动在 AI 笔记里追加卡片 */
    function maybeAutoNoteCard(text, pIdx, userMsg, aiReply) {
      // 简单规则：如果AI回复里提到了"值得注意""关键""精彩""有意思""摘抄"等关键词，
      // 或回复超过 80 字，就自动记一张卡片
      const triggers = ["值得注意","关键","精彩","有意思","亮点","摘抄","印象深","巧妙","核心","重要"];
      const shouldNote = aiReply.length > 80 || triggers.some(w => aiReply.includes(w));
      if (!shouldNote) return;

      text.aiNoteCards = text.aiNoteCards || [];
      text.aiNoteCards.push({
        id: uid("nc"),
        time: new Date().toISOString(),
        paraIndex: pIdx,
        trigger: userMsg.slice(0, 50),
        body: aiReply.length > 150 ? aiReply.slice(0, 150) + "…" : aiReply,
        quote: text.paragraphs[pIdx]?.text.slice(0, 80) || ""
      });
    }

    function excerptToMemo(msgIdx, kind) {
      if (!currentChat) return;
      const text = getText(currentChat.textId);
      const p = text.paragraphs[currentChat.paragraphIndex];
      const m = p.chatHistory[msgIdx];
      if (!m) return;
      const line = `【第${currentChat.paragraphIndex+1}段】${m.content}`;
      if (kind === "ai") {
        text.aiMemo = (text.aiMemo||"").trim() ? text.aiMemo.trim()+"\n\n"+line : line;
      } else {
        text.myMemo = (text.myMemo||"").trim() ? text.myMemo.trim()+"\n\n"+line : line;
      }
      save();
      showToast(kind==="ai" ? "已摘到 AI 笔记" : "已摘到我的笔记");
    }

    /* ───────── 笔记视图 ───────── */
    function openNotesView() {
      if (currentTextId) {
        openTextNotes(currentTextId);
      } else {
        openAllNotes();
      }
    }

    function openTextNotes(textId) {
      const text = getText(textId);
      if (!text) return;
      const cards = text.aiNoteCards || [];

      let body = `
        <div class="note-card">
          <h3>📘 AI 阅读笔记</h3>
          <div class="note-time">${fmtDate(text.createdAt)} · ${text.content.length}字</div>
          <textarea id="aiMemoEdit" style="min-height:100px;">${esc(text.aiMemo||"")}</textarea>
          <div class="note-actions"><button class="mini" onclick="saveTextNotes()">保存</button></div>
        </div>

        ${cards.length ? `<div class="small" style="margin:10px 0 6px;">AI 聊天感悟 (${cards.length})</div>` : ""}
        ${cards.map(c => `
          <div class="note-card">
            <div class="note-time">${fmtTime(c.time)} · 第${(c.paraIndex||0)+1}段</div>
            <div class="note-body">${esc(c.body)}</div>
            ${c.quote ? `<div class="note-quote">${esc(c.quote)}</div>` : ""}
            <div class="note-actions">
              <button class="mini" onclick="deleteNoteCard('${text.id}','${c.id}')">删除</button>
            </div>
          </div>
        `).join("")}

        <div class="note-card" style="margin-top:14px;">
          <h3>📝 我的笔记</h3>
          <textarea id="myMemoEdit" style="min-height:80px;">${esc(text.myMemo||"")}</textarea>
          <div class="note-actions">
            <button class="mini" onclick="saveTextNotes()">保存</button>
          </div>
        </div>

        <div class="note-actions" style="margin-top:12px;">
          <button class="mini" onclick="openAllNotes()">查看全部文章笔记</button>
        </div>
      `;
      openSidebar("阅读笔记 · " + text.title.slice(0,8), body);
    }

    function saveTextNotes() {
      const text = getText(currentTextId);
      if (!text) return;
      const aiBox = document.getElementById("aiMemoEdit");
      const myBox = document.getElementById("myMemoEdit");
      if (aiBox) text.aiMemo = aiBox.value.trim();
      if (myBox) text.myMemo = myBox.value.trim();
      text.updatedAt = new Date().toISOString();
      save();
      showToast("笔记已保存");
    }

    function deleteNoteCard(textId, cardId) {
      const text = getText(textId);
      if (!text) return;
      text.aiNoteCards = (text.aiNoteCards||[]).filter(c => c.id !== cardId);
      save();
      openTextNotes(textId);
      showToast("已删除");
    }

    function openAllNotes() {
      let body = "";
      if (!state.texts.length) {
        body = `<p class="small">暂无笔记</p>`;
      } else {
        state.texts.forEach(t => {
          body += `<div class="note-card">
            <h3>${esc(t.title)}</h3>
            <div class="note-time">${fmtDate(t.createdAt)}</div>
            <div class="small" style="margin:4px 0;">AI笔记</div>
            <div class="note-body" style="max-height:80px;overflow:hidden;">${esc((t.aiMemo||"暂无").slice(0,200))}</div>
            <div class="small" style="margin:4px 0;">我的笔记</div>
            <div class="note-body" style="max-height:60px;overflow:hidden;">${esc((t.myMemo||"暂无").slice(0,150))}</div>
            <div class="note-actions">
              <button class="mini" onclick="renderReader('${t.id}');closeSidebar();">打开</button>
              <button class="mini" onclick="openTextNotes('${t.id}')">编辑笔记</button>
            </div>
          </div>`;
        });
      }
      openSidebar("全部笔记", body);
    }

    /* ───────── 设置弹窗 ───────── */
    function openSettings() {
      const box = document.getElementById("settingsBox");
      box.innerHTML = `
        <h2>⚙ 设置</h2>
        <label>Worker URL</label>
        <input id="setUrl" value="${esc(state.settings.workerUrl)}" placeholder="https://xxx.workers.dev" />
        <label>记忆权限</label>
        <select id="setMemory">
          <option value="none" ${state.settings.memoryMode==="none"?"selected":""}>不读取过往笔记</option>
          <option value="ai" ${state.settings.memoryMode==="ai"?"selected":""}>只读取 AI 备忘录</option>
          <option value="all" ${state.settings.memoryMode==="all"?"selected":""}>AI + 我的备忘录</option>
        </select>
        <p class="small" style="margin:12px 0;">API Key 在 Worker 环境变量中，不在网页里存储。</p>
        <div style="display:flex;gap:8px;margin-top:14px;">
          <button onclick="saveSettings()">保存</button>
          <button class="secondary" onclick="closeSettings()">取消</button>
        </div>
      `;
      document.getElementById("settingsModal").classList.add("open");
    }

    function closeSettings() {
      document.getElementById("settingsModal").classList.remove("open");
    }

    function saveSettings() {
      state.settings.workerUrl = document.getElementById("setUrl").value.trim();
      state.settings.memoryMode = document.getElementById("setMemory").value;
      save();
      showToast("设置已保存");
      closeSettings();
    }

    /* ───────── 文件上传 ───────── */
    async function handleFileUpload(event) {
      const file = event.target.files[0];
      event.target.value = "";
      if (!file) return;

      if (!state.settings.workerUrl) {
        openSettings();
        showToast("请先填写 Worker URL");
        return;
      }

      const content = await file.text();
      const paragraphs = smartSplit(content);

      if (!paragraphs.length) {
        showToast("未读到有效段落，请检查文件编码");
        return;
      }

      const text = {
        id: uid("t"),
        title: file.name.replace(/\.txt$/i, ""),
        content,
        paragraphs: paragraphs.map((p, i) => ({ id: uid("p"), index: i, text: p, chatHistory: [] })),
        aiComments: [],
        aiMemo: "",
        aiNoteCards: [],
        myMemo: "",
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };

      state.texts.unshift(text);
      save();
      renderReader(text.id);

      // AI annotate
      showLoading(true);
      try {
        const result = await callWorker("/annotate", {
          title: text.title,
          paragraphs: text.paragraphs.map(p => p.text),
          memoryMode: state.settings.memoryMode,
          aiNotes: collectAiMemos(text.id),
          myNotes: collectMyMemos(text.id)
        });

        const parsed = result.parsed;
        if (parsed) {
          text.aiMemo = parsed.overallNote || "AI 已读完，未留下总结。";
          text.aiComments = Array.isArray(parsed.comments) ? parsed.comments : [];
        } else {
          text.aiMemo = result.raw || "AI 返回内容无法解析。";
          text.aiComments = [];
        }

        // 初始笔记卡片
        text.aiNoteCards = [{
          id: uid("nc"),
          time: new Date().toISOString(),
          paraIndex: -1,
          trigger: "初次阅读",
          body: text.aiMemo.slice(0, 200),
          quote: ""
        }];

        save();
        renderReader(text.id);
        showToast("AI 阅读完成！");
      } catch (err) {
        text.aiMemo = "AI 阅读失败：" + err.message;
        save();
        renderReader(text.id);
        showToast("AI 阅读失败");
      } finally {
        showLoading(false);
      }
    }

    /* ───────── Loading ───────── */
    let loadTimerInterval = null;
    function showLoading(show) {
      const el = document.getElementById("loadingOverlay");
      if (show) {
        el.classList.add("show");
        const start = Date.now();
        loadTimerInterval = setInterval(() => {
          document.getElementById("loadTimer").textContent = Math.floor((Date.now()-start)/1000) + "s";
        }, 500);
      } else {
        el.classList.remove("show");
        if (loadTimerInterval) { clearInterval(loadTimerInterval); loadTimerInterval = null; }
      }
    }

    /* ───────── Worker 调用 ───────── */
    async function callWorker(path, body) {
      const base = state.settings.workerUrl.replace(/\/$/,"");
      const resp = await fetch(base + path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      const raw = await resp.text();
      let data;
      try { data = JSON.parse(raw); } catch { throw new Error(raw || "Worker 返回非 JSON"); }
      if (!resp.ok || data.error) throw new Error(data.message || "Worker 请求失败");
      return data;
    }

    /* ───────── 删除 ───────── */
    function deleteText(textId) {
      const text = getText(textId);
      if (!text) return;
      if (!confirm(`确定删除《${text.title}》？`)) return;
      state.texts = state.texts.filter(t => t.id !== textId);
      save();
      closeSidebar();
      renderHome();
    }

    /* ───────── 启动 ───────── */
    renderHome();
  </script>
</body>
</html>
