<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 阅读器</title>

  <style>
    :root {
      --paper: #f7f1e8;
      --paper-deep: #efe5d8;
      --ink: #2b251f;
      --muted: #8a7a68;
      --line: #dfd0be;
      --panel: #fffaf3;
      --accent: #6f553a;
      --ai: #8a5f2d;
      --ai-bg: #f3e5cf;
      --dark: #2d241c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Segoe UI", sans-serif;
    }

    button, input, textarea, select {
      font: inherit;
    }

    button {
      border: none;
      background: var(--dark);
      color: white;
      border-radius: 999px;
      padding: 8px 14px;
      cursor: pointer;
    }

    button.secondary {
      background: rgba(255,255,255,0.55);
      color: var(--ink);
      border: 1px solid var(--line);
    }

    button.ghost {
      background: transparent;
      color: var(--accent);
      border: 1px solid transparent;
      padding: 4px 8px;
    }

    button.mini {
      font-size: 12px;
      padding: 4px 9px;
      background: rgba(111, 85, 58, 0.12);
      color: var(--accent);
      border: 1px solid rgba(111, 85, 58, 0.18);
    }

    button.icon {
      width: 38px;
      height: 38px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    input, textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      background: #fffaf3;
      color: var(--ink);
      border-radius: 14px;
      padding: 10px 12px;
      outline: none;
    }

    textarea {
      resize: vertical;
      min-height: 160px;
      line-height: 1.7;
    }

    label {
      display: block;
      margin: 16px 0 6px;
      font-size: 13px;
      color: var(--muted);
    }

    .topbar {
      height: 58px;
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(247, 241, 232, 0.9);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(223, 208, 190, 0.75);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }

    .left-actions, .right-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand {
      font-size: 15px;
      color: var(--muted);
      letter-spacing: 0.08em;
    }

    main {
      width: min(860px, 100%);
      margin: 0 auto;
      padding: 26px 18px 90px;
    }

    .empty {
      min-height: 58vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--muted);
      line-height: 1.9;
    }

    .home-list {
      display: grid;
      gap: 14px;
      width: min(620px, 100%);
      margin: 24px auto 0;
    }

    .book-card {
      background: rgba(255, 250, 243, 0.72);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 18px 20px;
      cursor: pointer;
      box-shadow: 0 10px 26px rgba(74, 55, 35, 0.04);
    }

    .book-card h2 {
      margin: 0 0 9px;
      font-size: 21px;
      font-weight: 650;
    }

    .meta {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .reader-head {
      width: min(720px, 100%);
      margin: 0 auto 20px;
      padding: 10px 0 18px;
      border-bottom: 1px solid rgba(223, 208, 190, 0.65);
    }

    .reader-tools {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .reader-head h1 {
      margin: 0 0 8px;
      font-size: 27px;
      font-weight: 650;
      letter-spacing: 0.03em;
    }

    .reader-head .summary {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .novel {
      width: min(720px, 100%);
      margin: 0 auto;
      font-family: "Songti SC", "STSong", "Noto Serif SC", "PingFang SC", serif;
      font-size: 19px;
      line-height: 2.05;
      letter-spacing: 0.02em;
    }

    .para-wrap {
      margin: 0 0 0.72em;
    }

    .novel-p {
      margin: 0;
      text-indent: 2em;
      white-space: pre-wrap;
    }

    .tri {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-left: 0.35em;
      width: 1.45em;
      height: 1.45em;
      border-radius: 50%;
      border: 1px solid rgba(111, 85, 58, 0.25);
      background: rgba(111, 85, 58, 0.08);
      color: var(--accent);
      font-size: 0.7em;
      vertical-align: middle;
      padding: 0;
      transform: translateY(-1px);
    }

    .ai-note-inline {
      margin: 0.25em 0 0.95em 2.4em;
      padding: 8px 12px;
      max-width: 92%;
      border-left: 3px solid rgba(138, 95, 45, 0.45);
      background: rgba(243, 229, 207, 0.55);
      color: var(--ai);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      font-size: 14px;
      line-height: 1.65;
      letter-spacing: 0;
      border-radius: 10px;
    }

    .ai-note-inline .tag {
      display: inline-block;
      margin-right: 6px;
      font-size: 12px;
      color: #fff;
      background: rgba(138, 95, 45, 0.78);
      border-radius: 999px;
      padding: 1px 7px;
    }

    .panel-mask {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(45, 36, 28, 0.28);
      display: none;
    }

    .panel-mask.open {
      display: block;
    }

    .panel {
      position: fixed;
      top: 0;
      right: 0;
      width: min(470px, 94vw);
      height: 100vh;
      z-index: 60;
      background: var(--panel);
      border-left: 1px solid var(--line);
      transform: translateX(105%);
      transition: transform 0.22s ease;
      display: flex;
      flex-direction: column;
      box-shadow: -16px 0 42px rgba(74, 55, 35, 0.12);
    }

    .panel.open {
      transform: translateX(0);
    }

    .panel-header {
      min-height: 60px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .panel-header h2 {
      margin: 0;
      font-size: 18px;
    }

    .panel-body {
      padding: 16px;
      flex: 1;
      overflow: auto;
    }

    .panel-footer {
      border-top: 1px solid var(--line);
      padding: 12px;
      display: none;
      gap: 8px;
    }

    .panel-footer textarea {
      min-height: 48px;
      max-height: 140px;
      flex: 1;
    }

    .memo-box {
      background: rgba(255,255,255,0.48);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .memo-box h3 {
      margin: 0 0 10px;
      font-size: 17px;
    }

    .memo-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 10px 0 0;
    }

    .current-para {
      background: rgba(243, 229, 207, 0.55);
      border: 1px solid rgba(223, 208, 190, 0.9);
      border-radius: 18px;
      padding: 13px;
      margin-bottom: 14px;
      font-size: 15px;
      line-height: 1.8;
      color: var(--ink);
      white-space: pre-wrap;
    }

    .chat-msg {
      margin-bottom: 12px;
      padding: 12px 13px;
      border-radius: 17px;
      font-size: 15px;
      line-height: 1.75;
      white-space: pre-wrap;
    }

    .chat-user {
      margin-left: 34px;
      background: var(--dark);
      color: white;
    }

    .chat-ai {
      margin-right: 34px;
      background: rgba(111, 85, 58, 0.12);
      color: var(--ink);
      border: 1px solid rgba(111, 85, 58, 0.13);
    }

    .chat-tools {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .small {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      background: rgba(45, 36, 28, 0.92);
      color: white;
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 14px;
      z-index: 100;
      display: none;
    }

    .loading {
      opacity: 0.66;
      pointer-events: none;
    }

    @media (max-width: 700px) {
      main {
        padding: 18px 14px 80px;
      }

      .brand {
        display: none;
      }

      .novel {
        font-size: 18px;
        line-height: 2;
      }

      .reader-head h1 {
        font-size: 24px;
      }

      .ai-note-inline {
        margin-left: 1.4em;
        max-width: 96%;
      }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="left-actions">
      <button class="icon secondary" onclick="openNotesPanel()" title="阅读笔记">□</button>
      <button class="icon secondary" onclick="openSettingsPanel()" title="API 设置">□</button>
    </div>

    <div class="brand">AI 阅读器</div>

    <div class="right-actions">
      <button class="icon" onclick="document.getElementById('fileInput').click()" title="上传 TXT">＋</button>
      <input id="fileInput" type="file" accept=".txt,text/plain" hidden onchange="handleFileUpload(event)" />
    </div>
  </header>

  <main id="main"></main>

  <div id="panelMask" class="panel-mask" onclick="closePanel()"></div>

  <aside id="panel" class="panel">
    <div class="panel-header">
      <h2 id="panelTitle">面板</h2>
      <button class="secondary" onclick="closePanel()">关闭</button>
    </div>
    <div id="panelBody" class="panel-body"></div>
    <div id="panelFooter" class="panel-footer"></div>
  </aside>

  <div id="toast" class="toast"></div>

  <script>
    const STORAGE_KEY = "ai_reader_v2";

    let state = loadState();
    let currentTextId = null;
    let currentChat = null;

    function defaultState() {
      return {
        settings: {
          workerUrl: "https://ai-reader-proxy.shun83258.workers.dev",
          memoryMode: "none"
        },
        texts: []
      };
    }

    function loadState() {
      try {
        const savedV2 = localStorage.getItem(STORAGE_KEY);
        if (savedV2) return normalizeState(JSON.parse(savedV2));

        const old = localStorage.getItem("ai_reader_v1");
        if (old) return normalizeState(JSON.parse(old));

        return defaultState();
      } catch {
        return defaultState();
      }
    }

    function normalizeState(input) {
      const base = defaultState();
      const next = {
        ...base,
        ...input,
        settings: {
          ...base.settings,
          ...(input.settings || {})
        },
        texts: Array.isArray(input.texts) ? input.texts : []
      };

      next.texts = next.texts.map(text => {
        const aiReadingNote = text.aiReadingNote || "";
        const oldMyNotes = Array.isArray(text.myNotes)
          ? text.myNotes.map(n => n.note || "").filter(Boolean).join("\n\n")
          : "";

        return {
          ...text,
          title: text.title || "未命名文本",
          content: text.content || "",
          paragraphs: Array.isArray(text.paragraphs)
            ? text.paragraphs.map((p, i) => ({
                id: p.id || uid("p"),
                index: i,
                text: typeof p === "string" ? p : (p.text || ""),
                chatHistory: Array.isArray(p.chatHistory) ? p.chatHistory : []
              }))
            : [],
          aiComments: Array.isArray(text.aiComments) ? text.aiComments : [],
          aiReadingNote,
          aiMemo: text.aiMemo || aiReadingNote || "",
          myMemo: text.myMemo || oldMyNotes || "",
          createdAt: text.createdAt || new Date().toISOString(),
          updatedAt: text.updatedAt || text.createdAt || new Date().toISOString()
        };
      });

      return next;
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function uid(prefix) {
      return prefix + "_" + Math.random().toString(36).slice(2) + Date.now().toString(36);
    }

    function escapeHtml(str) {
      return String(str || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatDate(iso) {
      if (!iso) return "";
      return new Date(iso).toLocaleString("zh-CN");
    }

    function showToast(text) {
      const el = document.getElementById("toast");
      el.textContent = text;
      el.style.display = "block";
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => {
        el.style.display = "none";
      }, 1800);
    }

    function splitParagraphs(text) {
      return text
        .replace(/\r/g, "")
        .split(/\n\s*\n+/)
        .map(p => p.trim())
        .filter(Boolean);
    }

    function getText(id) {
      return state.texts.find(t => t.id === id);
    }

    function collectAiMemos(excludeTextId) {
      return state.texts
        .filter(t => t.id !== excludeTextId)
        .map(t => {
          const memo = (t.aiMemo || "").trim();
          return memo ? `《${t.title}》\n${memo}` : "";
        })
        .filter(Boolean)
        .slice(-5);
    }

    function collectMyMemos(excludeTextId) {
      return state.texts
        .filter(t => t.id !== excludeTextId)
        .map(t => {
          const memo = (t.myMemo || "").trim();
          return memo ? `《${t.title}》\n${memo}` : "";
        })
        .filter(Boolean)
        .slice(-5);
    }

    function commentsFor(text, paragraphIndex) {
      return (text.aiComments || []).filter(c => Number(c.paragraphIndex) === Number(paragraphIndex));
    }

    function renderHome() {
      currentTextId = null;

      const main = document.getElementById("main");

      if (!state.texts.length) {
        main.innerHTML = `
          <div class="empty">
            <div>
              <h1>这里暂时是空白</h1>
              <p>点右上角「＋」上传 UTF-8 TXT。<br>上传后会生成正文阅读页、AI 小批注和可编辑阅读备忘录。</p>
            </div>
          </div>
        `;
        return;
      }

      main.innerHTML = `
        <div class="home-list">
          ${state.texts.map(text => `
            <article class="book-card" onclick="renderReader('${text.id}')">
              <h2>${escapeHtml(text.title)}</h2>
              <div class="meta">
                ${text.content.length} 字 / ${text.paragraphs.length} 段 / AI 批注 ${(text.aiComments || []).length} 条<br>
                最近阅读：${formatDate(text.updatedAt || text.createdAt)}
              </div>
            </article>
          `).join("")}
        </div>
      `;
    }

    function renderReader(textId) {
      const text = getText(textId);
      if (!text) return renderHome();

      currentTextId = textId;
      text.updatedAt = new Date().toISOString();
      saveState();

      const main = document.getElementById("main");

      main.innerHTML = `
        <section class="reader-head">
          <div class="reader-tools">
            <button class="secondary" onclick="renderHome()">← 返回书架</button>
            <button class="secondary" onclick="deleteText('${text.id}')">删除</button>
          </div>

          <h1>${escapeHtml(text.title)}</h1>
          <div class="summary">
            ${text.content.length} 字 / ${text.paragraphs.length} 段
            ${text.aiMemo ? `<br>AI 备忘录：${escapeHtml(text.aiMemo.slice(0, 90))}${text.aiMemo.length > 90 ? "…" : ""}` : ""}
          </div>
        </section>

        <article class="novel">
          ${text.paragraphs.map((p, i) => `
            <section class="para-wrap">
              <p class="novel-p">
                ${escapeHtml(p.text)}
                <button class="tri" onclick="openChatPanel('${text.id}', ${i})" title="聊聊这段">▸</button>
              </p>

              ${commentsFor(text, i).map(c => `
                <div class="ai-note-inline">
                  <span class="tag">${escapeHtml(c.tag || "AI")}</span>
                  ${escapeHtml(c.comment || "")}
                </div>
              `).join("")}
            </section>
          `).join("")}
        </article>
      `;
    }

    async function handleFileUpload(event) {
      const file = event.target.files[0];
      event.target.value = "";
      if (!file) return;

      if (!state.settings.workerUrl) {
        openSettingsPanel();
        showToast("请先填写 Worker URL");
        return;
      }

      const content = await file.text();
      const paragraphs = splitParagraphs(content);

      if (!paragraphs.length) {
        alert("没有读到有效段落。请确认 TXT 是 UTF-8 编码，并且段落之间有换行。");
        return;
      }

      const text = {
        id: uid("text"),
        title: file.name.replace(/\.txt$/i, ""),
        content,
        paragraphs: paragraphs.map((p, i) => ({
          id: uid("p"),
          index: i,
          text: p,
          chatHistory: []
        })),
        aiComments: [],
        aiReadingNote: "",
        aiMemo: "AI 正在阅读中……",
        myMemo: "",
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };

      state.texts.unshift(text);
      saveState();
      renderReader(text.id);

      try {
        document.body.classList.add("loading");

        const result = await callWorker("/annotate", {
          title: text.title,
          paragraphs: text.paragraphs.map(p => p.text),
          memoryMode: state.settings.memoryMode,
          aiNotes: collectAiMemos(text.id),
          myNotes: collectMyMemos(text.id)
        });

        const parsed = result.parsed;

        if (parsed) {
          text.aiReadingNote = parsed.overallNote || "";
          text.aiMemo = parsed.overallNote || "AI 已阅读，但没有留下整篇备忘录。";
          text.aiComments = Array.isArray(parsed.comments) ? parsed.comments : [];
        } else {
          text.aiReadingNote = result.raw || "";
          text.aiMemo = result.raw || "AI 返回内容无法解析。";
          text.aiComments = [];
        }

        saveState();
        renderReader(text.id);
      } catch (err) {
        text.aiMemo = "AI 阅读失败：" + err.message;
        saveState();
        renderReader(text.id);
        alert("AI 阅读失败：" + err.message);
      } finally {
        document.body.classList.remove("loading");
      }
    }

    async function callWorker(path, body) {
      const base = state.settings.workerUrl.replace(/\/$/, "");
      const response = await fetch(base + path, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(body)
      });

      const text = await response.text();

      let data;
      try {
        data = JSON.parse(text);
      } catch {
        throw new Error(text || "Worker 返回的不是 JSON");
      }

      if (!response.ok || data.error) {
        throw new Error(data.message || "Worker 请求失败");
      }

      return data;
    }

    function openPanel(title, bodyHtml, footerHtml = "") {
      document.getElementById("panelTitle").textContent = title;
      document.getElementById("panelBody").innerHTML = bodyHtml;

      const footer = document.getElementById("panelFooter");
      if (footerHtml) {
        footer.innerHTML = footerHtml;
        footer.style.display = "flex";
      } else {
        footer.innerHTML = "";
        footer.style.display = "none";
      }

      document.getElementById("panel").classList.add("open");
      document.getElementById("panelMask").classList.add("open");
    }

    function closePanel() {
      document.getElementById("panel").classList.remove("open");
      document.getElementById("panelMask").classList.remove("open");
      document.getElementById("panelFooter").style.display = "none";
      currentChat = null;
    }

    function openSettingsPanel() {
      openPanel("API 设置", `
        <label>Worker URL</label>
        <input id="workerUrlInput" value="${escapeHtml(state.settings.workerUrl || "")}" placeholder="https://xxx.workers.dev" />

        <label>记忆权限</label>
        <select id="memoryModeInput">
          <option value="none" ${state.settings.memoryMode === "none" ? "selected" : ""}>不读取过往笔记</option>
          <option value="ai" ${state.settings.memoryMode === "ai" ? "selected" : ""}>只读取过往 AI 备忘录</option>
          <option value="all" ${state.settings.memoryMode === "all" ? "selected" : ""}>读取 AI 备忘录 + 我的备忘录</option>
        </select>

        <p class="small">
          API Key 不在网页里填写。它仍然放在 Cloudflare Worker 的环境变量里。
        </p>

        <div class="memo-actions">
          <button onclick="saveSettings()">保存设置</button>
        </div>
      `);
    }

    function saveSettings() {
      state.settings.workerUrl = document.getElementById("workerUrlInput").value.trim();
      state.settings.memoryMode = document.getElementById("memoryModeInput").value;
      saveState();
      showToast("设置已保存");
      closePanel();
    }

    function openNotesPanel() {
      if (!currentTextId) {
        openAllNotesPanel();
        return;
      }

      const text = getText(currentTextId);
      if (!text) return openAllNotesPanel();

      openPanel("阅读笔记", `
        <div class="small" style="margin-bottom:12px;">
          当前文本：${escapeHtml(text.title)}
        </div>

        <div class="memo-box">
          <h3>我的阅读备忘录</h3>
          <textarea id="myMemoInput" placeholder="这里写你自己的阅读笔记。它不会自动混入聊天记录。">${escapeHtml(text.myMemo || "")}</textarea>
          <div class="memo-actions">
            <button class="mini" onclick="appendMemoLine('my')">＋ 追加一条</button>
            <button class="mini" onclick="clearMemo('my')">清空</button>
          </div>
        </div>

        <div class="memo-box">
          <h3>AI 阅读备忘录</h3>
          <textarea id="aiMemoInput" placeholder="这里是 AI 对这篇文章的长期备忘录，可以编辑。">${escapeHtml(text.aiMemo || "")}</textarea>
          <div class="memo-actions">
            <button class="mini" onclick="appendMemoLine('ai')">＋ 追加一条</button>
            <button class="mini" onclick="polishAiMemo()">AI 整理</button>
            <button class="mini" onclick="clearMemo('ai')">清空</button>
          </div>
        </div>

        <div class="memo-actions">
          <button onclick="saveMemos()">保存两份备忘录</button>
          <button class="secondary" onclick="openAllNotesPanel()">查看全部文章备忘录</button>
        </div>
      `);
    }

    function openAllNotesPanel() {
      openPanel("全部阅读笔记", `
        ${state.texts.length ? state.texts.map(text => `
          <div class="memo-box">
            <h3>${escapeHtml(text.title)}</h3>
            <div class="small">我的备忘录</div>
            <div style="white-space:pre-wrap; line-height:1.7; margin-bottom:10px;">${escapeHtml((text.myMemo || "").slice(0, 260) || "暂无")}</div>
            <div class="small">AI 备忘录</div>
            <div style="white-space:pre-wrap; line-height:1.7;">${escapeHtml((text.aiMemo || "").slice(0, 260) || "暂无")}</div>
            <div class="memo-actions">
              <button class="mini" onclick="renderReader('${text.id}'); closePanel();">打开这篇</button>
            </div>
          </div>
        `).join("") : `<p class="small">暂无阅读笔记。</p>`}
      `);
    }

    function saveMemos() {
      const text = getText(currentTextId);
      if (!text) return;

      text.myMemo = document.getElementById("myMemoInput").value.trim();
      text.aiMemo = document.getElementById("aiMemoInput").value.trim();
      text.updatedAt = new Date().toISOString();

      saveState();
      showToast("备忘录已保存");
      renderReader(text.id);
      openNotesPanel();
    }

    function appendMemoLine(kind) {
      const id = kind === "my" ? "myMemoInput" : "aiMemoInput";
      const box = document.getElementById(id);
      if (!box) return;

      const line = prompt(kind === "my" ? "追加到我的阅读备忘录：" : "追加到 AI 阅读备忘录：", "");
      if (!line || !line.trim()) return;

      const prefix = box.value.trim() ? "\n\n" : "";
      box.value = box.value + prefix + "＋ " + line.trim();
    }

    function clearMemo(kind) {
      const id = kind === "my" ? "myMemoInput" : "aiMemoInput";
      const box = document.getElementById(id);
      if (!box) return;

      if (!confirm("确定清空这一块备忘录？")) return;
      box.value = "";
    }

    async function polishAiMemo() {
      const text = getText(currentTextId);
      if (!text) return;

      const aiBox = document.getElementById("aiMemoInput");
      const myBox = document.getElementById("myMemoInput");

      const material = [
        "当前 AI 备忘录：",
        aiBox.value || "暂无",
        "",
        "我的阅读备忘录：",
        myBox.value || "暂无",
        "",
        "AI 段落批注：",
        (text.aiComments || []).map(c => `第${Number(c.paragraphIndex) + 1}段：${c.tag || ""} ${c.comment || ""}`).join("\n") || "暂无"
      ].join("\n");

      try {
        showToast("AI 正在整理备忘录……");

        const result = await callWorker("/chat", {
          currentParagraph: material,
          previousParagraph: "",
          nextParagraph: "",
          userMessage: "请把以上内容整理成一份适合作为本篇文章长期记忆的 AI 阅读备忘录。要求：不要像作文，不要复述原文，保留具体判断和阅读感受，控制在 180 字以内。",
          chatHistory: [],
          textAiNote: aiBox.value,
          memoryMode: "none",
          aiNotes: [],
          myNotes: []
        });

        aiBox.value = result.reply || aiBox.value;
        showToast("AI 备忘录已整理");
      } catch (err) {
        alert("整理失败：" + err.message);
      }
    }

    function openChatPanel(textId, paragraphIndex) {
      currentChat = { textId, paragraphIndex };
      renderChatPanel();
    }

    function renderChatPanel() {
      if (!currentChat) return;

      const text = getText(currentChat.textId);
      const i = currentChat.paragraphIndex;
      const p = text.paragraphs[i];
      const history = p.chatHistory || [];

      openPanel(
        `第 ${i + 1} 段`,
        `
          <div class="current-para">${escapeHtml(p.text)}</div>

          ${history.length ? history.map((m, idx) => `
            <div class="chat-msg ${m.role === "user" ? "chat-user" : "chat-ai"}">
              ${escapeHtml(m.content)}
              <div class="chat-tools">
                ${m.role === "assistant"
                  ? `<button class="mini" onclick="appendChatToMemo(${idx}, 'ai')">摘到 AI 备忘录</button>`
                  : `<button class="mini" onclick="appendChatToMemo(${idx}, 'my')">摘到我的备忘录</button>`
                }
              </div>
            </div>
          `).join("") : `
            <p class="small">
              这里可以只聊当前这一段。系统只会发送当前段落、相邻段落、当前文本备忘录，以及你允许的少量过往备忘录。
            </p>
          `}
        `,
        `
          <textarea id="chatInput" placeholder="问问这段……"></textarea>
          <button onclick="sendChat()">发送</button>
        `
      );
    }

    async function sendChat() {
      if (!currentChat) return;

      const input = document.getElementById("chatInput");
      const userMessage = input.value.trim();
      if (!userMessage) return;

      const text = getText(currentChat.textId);
      const i = currentChat.paragraphIndex;
      const p = text.paragraphs[i];

      p.chatHistory = p.chatHistory || [];
      p.chatHistory.push({
        role: "user",
        content: userMessage
      });

      saveState();
      renderChatPanel();

      try {
        const result = await callWorker("/chat", {
          currentParagraph: text.paragraphs[i]?.text || "",
          previousParagraph: text.paragraphs[i - 1]?.text || "",
          nextParagraph: text.paragraphs[i + 1]?.text || "",
          userMessage,
          chatHistory: p.chatHistory.slice(0, -1),
          textAiNote: text.aiMemo || text.aiReadingNote || "",
          memoryMode: state.settings.memoryMode,
          aiNotes: collectAiMemos(text.id),
          myNotes: collectMyMemos(text.id)
        });

        p.chatHistory.push({
          role: "assistant",
          content: result.reply || "AI 没有返回内容。"
        });

        saveState();
        renderChatPanel();
      } catch (err) {
        p.chatHistory.push({
          role: "assistant",
          content: "聊天失败：" + err.message
        });

        saveState();
        renderChatPanel();
      }
    }

    function appendChatToMemo(messageIndex, kind) {
      if (!currentChat) return;

      const text = getText(currentChat.textId);
      const p = text.paragraphs[currentChat.paragraphIndex];
      const msg = p.chatHistory[messageIndex];

      if (!msg) return;

      const line = `【第 ${currentChat.paragraphIndex + 1} 段】${msg.content}`;

      if (kind === "ai") {
        text.aiMemo = (text.aiMemo || "").trim()
          ? text.aiMemo.trim() + "\n\n" + line
          : line;
      } else {
        text.myMemo = (text.myMemo || "").trim()
          ? text.myMemo.trim() + "\n\n" + line
          : line;
      }

      saveState();
      showToast(kind === "ai" ? "已摘到 AI 备忘录" : "已摘到我的备忘录");
    }

    function deleteText(textId) {
      const text = getText(textId);
      if (!text) return;

      if (!confirm(`确定删除《${text.title}》？原文、批注、聊天、备忘录都会删除。`)) return;

      state.texts = state.texts.filter(t => t.id !== textId);
      saveState();
      renderHome();
    }

    renderHome();
  </script>
</body>
</html>
