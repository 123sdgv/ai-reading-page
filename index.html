<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 阅读器</title>

  <style>
    :root {
      --paper: #f7f1e8;
      --paper-deep: #efe5d8;
      --ink: #2b251f;
      --muted: #8a7a68;
      --line: #dfd0be;
      --panel: #fffaf3;
      --accent: #6f553a;
      --ai: #8a5f2d;
      --ai-bg: #f3e5cf;
      --dark: #2d241c;
      --panel-width: 470px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Segoe UI", sans-serif;
      overflow-x: hidden;
    }

    button, input, textarea, select { font: inherit; }

    button {
      border: none;
      background: var(--dark);
      color: white;
      border-radius: 999px;
      padding: 8px 14px;
      cursor: pointer;
    }

    button:disabled { opacity: 0.55; cursor: not-allowed; }

    button.secondary {
      background: rgba(255,255,255,0.55);
      color: var(--ink);
      border: 1px solid var(--line);
    }

    button.ghost {
      background: transparent;
      color: var(--accent);
      border: 1px solid transparent;
      padding: 4px 8px;
    }

    button.mini {
      font-size: 12px;
      padding: 4px 9px;
      background: rgba(111, 85, 58, 0.12);
      color: var(--accent);
      border: 1px solid rgba(111, 85, 58, 0.18);
    }

    button.icon {
      width: 38px;
      height: 38px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    input, textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      background: #fffaf3;
      color: var(--ink);
      border-radius: 14px;
      padding: 10px 12px;
      outline: none;
    }

    textarea {
      resize: vertical;
      min-height: 150px;
      line-height: 1.62;
    }

    label {
      display: block;
      margin: 16px 0 6px;
      font-size: 13px;
      color: var(--muted);
    }

    .topbar {
      height: 58px;
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(247, 241, 232, 0.9);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(223, 208, 190, 0.75);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }

    .left-actions, .right-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand {
      font-size: 15px;
      color: var(--muted);
      letter-spacing: 0.08em;
    }

    main {
      width: min(860px, 100%);
      margin: 0 auto;
      padding: 24px 18px 90px;
      transition: width 0.22s ease, margin 0.22s ease, padding 0.22s ease;
    }

    body.panel-open main {
      width: calc(100vw - var(--panel-width));
      margin-left: 0;
      margin-right: var(--panel-width);
      padding-left: 24px;
      padding-right: 24px;
    }

    body.panel-open .reader-head,
    body.panel-open .novel {
      width: min(680px, 100%);
    }

    .empty {
      min-height: 58vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--muted);
      line-height: 1.9;
    }

    .home-list {
      display: grid;
      gap: 14px;
      width: min(620px, 100%);
      margin: 24px auto 0;
    }

    .book-card {
      background: rgba(255, 250, 243, 0.72);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 18px 20px;
      cursor: pointer;
      box-shadow: 0 10px 26px rgba(74, 55, 35, 0.04);
    }

    .book-card h2 {
      margin: 0 0 9px;
      font-size: 21px;
      font-weight: 650;
    }

    .meta {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .reader-head {
      width: min(720px, 100%);
      margin: 0 auto 18px;
      padding: 8px 0 16px;
      border-bottom: 1px solid rgba(223, 208, 190, 0.65);
    }

    .reader-tools {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .reader-head h1 {
      margin: 0 0 8px;
      font-size: 27px;
      font-weight: 650;
      letter-spacing: 0.03em;
    }

    .reader-head .summary {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
    }

    .novel {
      width: min(720px, 100%);
      margin: 0 auto;
      font-family: "Songti SC", "STSong", "Noto Serif SC", "PingFang SC", serif;
      font-size: 18px;
      line-height: 1.46;
      letter-spacing: 0.006em;
    }

    .para-wrap {
      margin: 0 0 0.42em;
      padding: 0;
    }

    .novel-p {
      margin: 0;
      text-indent: 2em;
      white-space: pre-wrap;
    }

    .tri {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-left: 0.42em;
      width: 1.42em;
      height: 1.42em;
      border-radius: 50%;
      border: 1px solid rgba(111, 85, 58, 0.25);
      background: rgba(111, 85, 58, 0.08);
      color: var(--accent);
      font-size: 0.68em;
      vertical-align: middle;
      padding: 0;
      transform: translateY(-1px);
    }

    .tri.has-comment {
      border-color: rgba(78, 128, 84, 0.48);
      background: rgba(78, 128, 84, 0.14);
      color: #4e8054;
      font-weight: 700;
    }

    .ai-note-inline {
      margin: 0.32em 0 0.85em 2.4em;
      padding: 8px 12px;
      max-width: 92%;
      border-left: 3px solid rgba(138, 95, 45, 0.45);
      background: rgba(243, 229, 207, 0.52);
      color: var(--ai);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      font-size: 14px;
      line-height: 1.55;
      letter-spacing: 0;
      border-radius: 10px;
    }

    .ai-note-inline .tag {
      display: inline-block;
      margin-right: 6px;
      font-size: 12px;
      color: #fff;
      background: rgba(138, 95, 45, 0.78);
      border-radius: 999px;
      padding: 1px 7px;
    }

    .panel-mask {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(45, 36, 28, 0.28);
      display: none;
    }

    .panel-mask.open { display: none; }

    .panel {
      position: fixed;
      top: 0;
      right: 0;
      width: var(--panel-width);
      max-width: 94vw;
      height: 100vh;
      z-index: 60;
      background: var(--panel);
      border-left: 1px solid var(--line);
      transform: translateX(105%);
      transition: transform 0.22s ease;
      display: flex;
      flex-direction: column;
      box-shadow: -16px 0 42px rgba(74, 55, 35, 0.12);
    }

    .panel.open { transform: translateX(0); }

    .panel-header {
      min-height: 60px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .panel-header h2 { margin: 0; font-size: 18px; }

    .panel-body {
      padding: 16px;
      flex: 1;
      overflow: auto;
    }

    .panel-footer {
      border-top: 1px solid var(--line);
      padding: 12px;
      display: none;
      gap: 8px;
      align-items: flex-end;
    }

    .panel-footer textarea {
      min-height: 48px;
      max-height: 140px;
      flex: 1;
    }

    .memo-box, .note-card {
      background: rgba(255,255,255,0.48);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .memo-box h3, .note-card h3 {
      margin: 0 0 10px;
      font-size: 17px;
    }

    .note-card {
      background: rgba(243, 229, 207, 0.42);
    }

    .note-card .time {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 8px;
    }

    .memo-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 10px 0 0;
    }

    .current-para {
      background: rgba(243, 229, 207, 0.55);
      border: 1px solid rgba(223, 208, 190, 0.9);
      border-radius: 18px;
      padding: 13px;
      margin-bottom: 14px;
      font-size: 15px;
      line-height: 1.65;
      color: var(--ink);
      white-space: pre-wrap;
    }

    .chat-msg {
      margin-bottom: 12px;
      padding: 12px 13px;
      border-radius: 17px;
      font-size: 15px;
      line-height: 1.65;
      white-space: pre-wrap;
    }

    .chat-user {
      margin-left: 34px;
      background: var(--dark);
      color: white;
    }

    .chat-ai {
      margin-right: 34px;
      background: rgba(111, 85, 58, 0.12);
      color: var(--ink);
      border: 1px solid rgba(111, 85, 58, 0.13);
    }

    .thinking {
      margin-right: 34px;
      background: rgba(111, 85, 58, 0.08);
      color: var(--muted);
      border: 1px dashed rgba(111, 85, 58, 0.25);
    }

    .dot::after {
      content: "";
      animation: dots 1.1s infinite;
    }

    @keyframes dots {
      0% { content: ""; }
      33% { content: "."; }
      66% { content: ".."; }
      100% { content: "..."; }
    }

    .chat-tools {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .small {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      background: rgba(45, 36, 28, 0.92);
      color: white;
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 14px;
      z-index: 100;
      display: none;
    }

    .loading { opacity: 0.66; pointer-events: none; }

    @media (max-width: 920px) {
      body.panel-open main {
        width: 100%;
        margin: 0 auto;
        padding-left: 14px;
        padding-right: 14px;
      }

      .panel-mask.open { display: block; }

      .panel { width: min(470px, 94vw); }
    }

    @media (max-width: 700px) {
      main { padding: 18px 14px 80px; }
      .brand { display: none; }
      .novel { font-size: 17px; line-height: 1.46; }
      .reader-head h1 { font-size: 24px; }
      .ai-note-inline { margin-left: 1.4em; max-width: 96%; }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="left-actions">
      <button class="icon secondary" onclick="openNotesPanel()" title="阅读笔记" aria-label="阅读笔记">笔</button>
      <button class="icon secondary" onclick="openSettingsPanel()" title="API 设置" aria-label="API 设置">设</button>
    </div>

    <div class="brand">AI 阅读器</div>

    <div class="right-actions">
      <button class="icon" onclick="document.getElementById('fileInput').click()" title="上传 TXT" aria-label="上传 TXT">＋</button>
      <input id="fileInput" type="file" accept=".txt,text/plain" hidden onchange="handleFileUpload(event)" />
    </div>
  </header>

  <main id="main"></main>

  <div id="panelMask" class="panel-mask" onclick="closePanel()"></div>

  <aside id="panel" class="panel">
    <div class="panel-header">
      <h2 id="panelTitle">面板</h2>
      <button class="secondary" onclick="closePanel()">关闭</button>
    </div>
    <div id="panelBody" class="panel-body"></div>
    <div id="panelFooter" class="panel-footer"></div>
  </aside>

  <div id="toast" class="toast"></div>

  <script>
    const STORAGE_KEY = "ai_reader_v3";

    let state = loadState();
    let currentTextId = null;
    let currentChat = null;
    let thinkingTimer = null;
    let thinkingStartedAt = null;

    function defaultState() {
      return {
        settings: {
          workerUrl: "https://ai-reader-proxy.shun83258.workers.dev",
          memoryMode: "none"
        },
        texts: []
      };
    }

    function loadState() {
      try {
        const savedV3 = localStorage.getItem(STORAGE_KEY);
        if (savedV3) return normalizeState(JSON.parse(savedV3));

        const savedV2 = localStorage.getItem("ai_reader_v2");
        if (savedV2) return normalizeState(JSON.parse(savedV2));

        const old = localStorage.getItem("ai_reader_v1");
        if (old) return normalizeState(JSON.parse(old));

        return defaultState();
      } catch {
        return defaultState();
      }
    }

    function normalizeState(input) {
      const base = defaultState();
      const next = {
        ...base,
        ...input,
        settings: {
          ...base.settings,
          ...(input.settings || {})
        },
        texts: Array.isArray(input.texts) ? input.texts : []
      };

      next.texts = next.texts.map(text => {
        const aiReadingNote = text.aiReadingNote || "";
        const oldMyNotes = Array.isArray(text.myNotes)
          ? text.myNotes.map(n => n.note || "").filter(Boolean).join("\n\n")
          : "";

        let rawParagraphs = Array.isArray(text.paragraphs)
          ? text.paragraphs.map((p, i) => ({
              id: p.id || uid("p"),
              index: i,
              text: typeof p === "string" ? p : (p.text || ""),
              chatHistory: Array.isArray(p.chatHistory) ? p.chatHistory : []
            }))
          : smartSplitParagraphs(text.content || "").map((p, i) => ({
              id: uid("p"),
              index: i,
              text: p,
              chatHistory: []
            }));

        // 兼容之前被“一句话一段”切坏的旧文本：
        // 只有在还没有聊天记录、没有 AI 批注时才自动重分，避免破坏已有索引。
        if (shouldAutoResegment(text, rawParagraphs)) {
          rawParagraphs = smartSplitParagraphs(text.content || "").map((p, i) => ({
            id: uid("p"),
            index: i,
            text: p,
            chatHistory: []
          }));
        }

        return {
          ...text,
          title: text.title || "未命名文本",
          content: text.content || "",
          paragraphs: rawParagraphs,
          aiComments: Array.isArray(text.aiComments) ? text.aiComments : [],
          aiReadingNote,
          aiMemo: text.aiMemo || aiReadingNote || "",
          aiMemoCards: Array.isArray(text.aiMemoCards) ? text.aiMemoCards : [],
          myMemo: text.myMemo || oldMyNotes || "",
          createdAt: text.createdAt || new Date().toISOString(),
          updatedAt: text.updatedAt || text.createdAt || new Date().toISOString()
        };
      });

      return next;
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function uid(prefix) {
      return prefix + "_" + Math.random().toString(36).slice(2) + Date.now().toString(36);
    }

    function escapeHtml(str) {
      return String(str || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatDate(iso) {
      if (!iso) return "";
      const date = new Date(iso);
      if (Number.isNaN(date.getTime())) return "";
      return date.toLocaleString("zh-CN");
    }

    function showToast(text) {
      const el = document.getElementById("toast");
      el.textContent = text;
      el.style.display = "block";
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => {
        el.style.display = "none";
      }, 1800);
    }

    function sentenceLike(line) {
      const s = String(line || "").trim();
      if (!s) return false;
      const end = s[s.length - 1];
      return "。！？!?…」”』）)]".includes(end);
    }

    function compactLen(str) {
      let count = 0;
      for (const ch of String(str || "")) {
        if (ch.trim()) count += 1;
      }
      return count;
    }

    function splitSentences(text) {
      const closers = "」”』）)]";
      const stops = "。！？!?…";
      const result = [];
      let buf = "";

      for (let i = 0; i < text.length; i += 1) {
        const ch = text[i];
        buf += ch;

        if (stops.includes(ch)) {
          while (i + 1 < text.length && closers.includes(text[i + 1])) {
            i += 1;
            buf += text[i];
          }
          if (buf.trim()) result.push(buf.trim());
          buf = "";
        }
      }

      if (buf.trim()) result.push(buf.trim());
      return result;
    }

    function splitByBlankLines(text) {
      const NL = String.fromCharCode(10);
      const blocks = [];
      let buf = [];

      for (const rawLine of text.split(NL)) {
        const line = rawLine.trim();
        if (!line) {
          if (buf.length) {
            blocks.push(buf.join(NL).trim());
            buf = [];
          }
        } else {
          buf.push(line);
        }
      }

      if (buf.length) blocks.push(buf.join(NL).trim());
      return blocks.filter(Boolean);
    }

    function smartSplitParagraphs(text) {
      const NL = String.fromCharCode(10);
      const CR = String.fromCharCode(13);
      const TAB = String.fromCharCode(9);
      const NBSP = String.fromCharCode(160);

      const clean = String(text || "")
        .split(CR).join("")
        .split(TAB).join(" ")
        .split(NBSP).join(" ")
        .trim();

      if (!clean) return [];

      // 1. 最优先：尊重作者自己用空行打出来的自然段。
      // 只要你原文里段落之间有空行，这里就不会再把一句话拆成一个阅读段。
      const blankBlocks = splitByBlankLines(clean);
      if (blankBlocks.length >= 2) {
        return blankBlocks.flatMap(block => normalizeAuthorParagraph(block));
      }

      // 2. 没有空行，但有单换行：这通常有两种情况：
      // A. 你每段手动换行；B. 编辑器把一句一句/一行一行折开。
      // 这里会把短行继续合并，避免每句话后面都有三角形。
      const lines = clean.split(NL).map(line => line.trim()).filter(Boolean);
      if (lines.length >= 2) {
        const avgLen = lines.reduce((sum, line) => sum + compactLen(line), 0) / lines.length;
        const veryShortRate = lines.filter(line => compactLen(line) <= 45).length / lines.length;
        const sentenceEndRate = lines.filter(sentenceLike).length / lines.length;

        // 短行多，或每行都像一句话：合并成 260-520 字左右的阅读段。
        if (avgLen < 120 || veryShortRate > 0.35 || sentenceEndRate > 0.72) {
          return packAuthorLines(lines);
        }

        // 如果每行本来就比较长，更像作者自然段，就保留为段落；过长才温和拆开。
        return lines.flatMap(line => normalizeAuthorParagraph(line));
      }

      // 3. 完全没有换行：按 420-680 字左右合成阅读段。
      // 注意：不是一句话一段，而是多句话组成一个可聊天的段落。
      return packLongParagraph(clean, 420, 680);
    }

    function normalizeAuthorParagraph(block) {
      const NL = String.fromCharCode(10);
      const one = String(block || "").split(NL).map(line => line.trim()).filter(Boolean).join(NL);
      const len = compactLen(one);

      // 20,000 字以内的短篇，作者自然段不乱拆；只有很长的段才拆。
      if (len <= 1100) return [one];
      return packLongParagraph(one.split(NL).join(""), 520, 760);
    }

    function packAuthorLines(lines) {
      const NL = String.fromCharCode(10);
      const result = [];
      let buf = "";

      for (const line of lines) {
        const next = buf ? buf + NL + line : line;
        const plainLen = compactLen(next);

        // 这里故意把阈值调高，避免一句话/两句话就生成一个三角形。
        const closeByLength = plainLen >= 520;
        const closeByNaturalStop = plainLen >= 300 && sentenceLike(line);
        const closeByDialogueTurn = plainLen >= 260 && /[。！？!?…」”』）)]$/.test(line) && /^「|^“|^『/.test(line.trim());

        if (closeByLength || closeByNaturalStop || closeByDialogueTurn) {
          result.push(next.trim());
          buf = "";
        } else {
          buf = next;
        }
      }

      if (buf.trim()) result.push(buf.trim());
      return result;
    }

    function packLongParagraph(text, softLimit = 420, hardLimit = 680) {
      const sentences = splitSentences(String(text || ""));
      if (sentences.length <= 1) return [String(text || "")];

      const result = [];
      let buf = "";

      for (const sentence of sentences) {
        const next = buf ? buf + sentence : sentence;
        const len = compactLen(next);

        // 至少攒到 softLimit 附近才切，hardLimit 是兜底。
        if (len >= hardLimit || (len >= softLimit && sentenceLike(sentence))) {
          result.push(next.trim());
          buf = "";
        } else {
          buf = next;
        }
      }

      if (buf.trim()) result.push(buf.trim());
      return result;
    }

    function shouldAutoResegment(text, paragraphs) {
      if (!text || !text.content || !Array.isArray(paragraphs) || paragraphs.length < 8) return false;

      const hasChat = paragraphs.some(p => Array.isArray(p.chatHistory) && p.chatHistory.length);
      const hasComments = Array.isArray(text.aiComments) && text.aiComments.length;
      if (hasChat || hasComments) return false;

      const avgLen = paragraphs.reduce((sum, p) => sum + compactLen(p.text || ""), 0) / paragraphs.length;
      const tooManyTinyParas = paragraphs.filter(p => compactLen(p.text || "") <= 70).length / paragraphs.length > 0.65;

      return avgLen < 90 || tooManyTinyParas;
    }

    function getText(id) {
      return state.texts.find(t => t.id === id);
    }

    function collectAiMemos(excludeTextId) {
      return state.texts
        .filter(t => t.id !== excludeTextId)
        .map(t => {
          const cards = (t.aiMemoCards || []).map(card => `- ${card.title || "阅读卡片"}：${card.content || ""}`).join("\n");
          const memo = [t.aiMemo || "", cards].filter(Boolean).join("\n").trim();
          return memo ? `《${t.title}》\n${memo}` : "";
        })
        .filter(Boolean)
        .slice(-5);
    }

    function collectMyMemos(excludeTextId) {
      return state.texts
        .filter(t => t.id !== excludeTextId)
        .map(t => {
          const memo = (t.myMemo || "").trim();
          return memo ? `《${t.title}》\n${memo}` : "";
        })
        .filter(Boolean)
        .slice(-5);
    }

    function commentsFor(text, paragraphIndex) {
      return (text.aiComments || []).filter(c => Number(c.paragraphIndex) === Number(paragraphIndex));
    }

    function renderHome() {
      currentTextId = null;
      document.body.classList.remove("panel-open");

      const main = document.getElementById("main");

      if (!state.texts.length) {
        main.innerHTML = `
          <div class="empty">
            <div>
              <h1>这里暂时是空白</h1>
              <p>点右上角「＋」上传 UTF-8 TXT。<br>上传后会生成正文阅读页、AI 小批注和可编辑阅读备忘录。</p>
            </div>
          </div>
        `;
        return;
      }

      main.innerHTML = `
        <div class="home-list">
          ${state.texts.map(text => `
            <article class="book-card" onclick="renderReader('${text.id}')">
              <h2>${escapeHtml(text.title)}</h2>
              <div class="meta">
                ${text.content.length} 字 / ${text.paragraphs.length} 个阅读段 / AI 批注 ${(text.aiComments || []).length} 条<br>
                最近阅读：${formatDate(text.updatedAt || text.createdAt)}
              </div>
            </article>
          `).join("")}
        </div>
      `;
    }

    function renderReader(textId) {
      const text = getText(textId);
      if (!text) return renderHome();

      currentTextId = textId;
      text.updatedAt = new Date().toISOString();
      saveState();

      const main = document.getElementById("main");

      main.innerHTML = `
        <section class="reader-head">
          <div class="reader-tools">
            <button class="secondary" onclick="renderHome(); closePanel();">← 返回书架</button>
            <button class="secondary" onclick="deleteText('${text.id}')">删除</button>
          </div>

          <h1>${escapeHtml(text.title)}</h1>
          <div class="summary">
            ${text.content.length} 字 / ${text.paragraphs.length} 个阅读段
            ${text.aiMemo ? `<br>AI 备忘录：${escapeHtml(text.aiMemo.slice(0, 90))}${text.aiMemo.length > 90 ? "…" : ""}` : ""}
          </div>
        </section>

        <article class="novel">
          ${text.paragraphs.map((p, i) => `
            <section class="para-wrap">
              <p class="novel-p">
                ${escapeHtml(p.text)}
                <button class="tri ${commentsFor(text, i).length ? "has-comment" : ""}" onclick="openChatPanel('${text.id}', ${i})" title="${commentsFor(text, i).length ? "查看 AI 批注并聊聊这一段" : "聊聊这一段"}" aria-label="${commentsFor(text, i).length ? "查看 AI 批注并聊聊这一段" : "聊聊这一段"}">▸</button>
              </p>

            </section>
          `).join("")}
        </article>
      `;
    }

    async function handleFileUpload(event) {
      const file = event.target.files[0];
      event.target.value = "";
      if (!file) return;

      if (!state.settings.workerUrl) {
        openSettingsPanel();
        showToast("请先填写 Worker URL");
        return;
      }

      const content = await file.text();
      const paragraphs = smartSplitParagraphs(content);

      if (!paragraphs.length) {
        alert("没有读到有效段落。请确认 TXT 是 UTF-8 编码。若原文没有空行，本版也会尝试自动智能分段。");
        return;
      }

      const text = {
        id: uid("text"),
        title: file.name.replace(/\.txt$/i, ""),
        content,
        paragraphs: paragraphs.map((p, i) => ({
          id: uid("p"),
          index: i,
          text: p,
          chatHistory: []
        })),
        aiComments: [],
        aiReadingNote: "",
        aiMemo: "AI 正在阅读中……",
        aiMemoCards: [],
        myMemo: "",
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };

      state.texts.unshift(text);
      saveState();
      renderReader(text.id);

      try {
        document.body.classList.add("loading");
        showToast("AI 正在阅读文本……");

        const result = await callWorker("/annotate", {
          title: text.title,
          paragraphs: text.paragraphs.map(p => p.text),
          memoryMode: state.settings.memoryMode,
          aiNotes: collectAiMemos(text.id),
          myNotes: collectMyMemos(text.id)
        });

        const parsed = result.parsed;

        if (parsed) {
          const overall = parsed.overallNote || "AI 已阅读，但没有留下整篇备忘录。";
          text.aiReadingNote = overall;
          text.aiMemo = makeInitialAiMemo(text.title, overall, text.content.length, text.paragraphs.length);
          text.aiComments = Array.isArray(parsed.comments) ? parsed.comments : [];
        } else {
          const raw = result.raw || "AI 返回内容无法解析。";
          text.aiReadingNote = raw;
          text.aiMemo = makeInitialAiMemo(text.title, raw, text.content.length, text.paragraphs.length);
          text.aiComments = [];
        }

        saveState();
        renderReader(text.id);
      } catch (err) {
        text.aiMemo = "AI 阅读失败：" + err.message;
        saveState();
        renderReader(text.id);
        alert("AI 阅读失败：" + err.message);
      } finally {
        document.body.classList.remove("loading");
      }
    }

    function makeInitialAiMemo(title, note, charCount, paragraphCount) {
      return [
        `时间：${formatDate(new Date().toISOString())}`,
        `文本：${title}`,
        `规模：约 ${charCount} 字，${paragraphCount} 个阅读段`,
        "",
        "概览：",
        note || "暂无"
      ].join("\n");
    }

    async function callWorker(path, body) {
      const base = state.settings.workerUrl.replace(/\/$/, "");
      const response = await fetch(base + path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });

      const text = await response.text();

      let data;
      try {
        data = JSON.parse(text);
      } catch {
        throw new Error(text || "Worker 返回的不是 JSON");
      }

      if (!response.ok || data.error) {
        throw new Error(data.message || "Worker 请求失败");
      }

      return data;
    }

    function openPanel(title, bodyHtml, footerHtml = "") {
      document.getElementById("panelTitle").textContent = title;
      document.getElementById("panelBody").innerHTML = bodyHtml;

      const footer = document.getElementById("panelFooter");
      if (footerHtml) {
        footer.innerHTML = footerHtml;
        footer.style.display = "flex";
      } else {
        footer.innerHTML = "";
        footer.style.display = "none";
      }

      document.getElementById("panel").classList.add("open");
      document.getElementById("panelMask").classList.add("open");
      document.body.classList.add("panel-open");
    }

    function closePanel() {
      document.getElementById("panel").classList.remove("open");
      document.getElementById("panelMask").classList.remove("open");
      document.getElementById("panelFooter").style.display = "none";
      document.body.classList.remove("panel-open");
      currentChat = null;
      stopThinkingTimer();
    }

    function openSettingsPanel() {
      openPanel("API 设置", `
        <label>Worker URL</label>
        <input id="workerUrlInput" value="${escapeHtml(state.settings.workerUrl || "")}" placeholder="https://xxx.workers.dev" />

        <label>记忆权限</label>
        <select id="memoryModeInput">
          <option value="none" ${state.settings.memoryMode === "none" ? "selected" : ""}>不读取过往笔记</option>
          <option value="ai" ${state.settings.memoryMode === "ai" ? "selected" : ""}>只读取过往 AI 备忘录</option>
          <option value="all" ${state.settings.memoryMode === "all" ? "selected" : ""}>读取 AI 备忘录 + 我的备忘录</option>
        </select>

        <p class="small">API Key 不在网页里填写。它仍然放在 Cloudflare Worker 的环境变量里。</p>

        <div class="memo-actions">
          <button onclick="saveSettings()">保存设置</button>
        </div>
      `);
    }

    function saveSettings() {
      state.settings.workerUrl = document.getElementById("workerUrlInput").value.trim();
      state.settings.memoryMode = document.getElementById("memoryModeInput").value;
      saveState();
      showToast("设置已保存");
      closePanel();
    }

    function openNotesPanel() {
      if (!currentTextId) {
        openAllNotesPanel();
        return;
      }

      const text = getText(currentTextId);
      if (!text) return openAllNotesPanel();

      openPanel("阅读笔记", `
        <div class="small" style="margin-bottom:12px;">当前文本：${escapeHtml(text.title)}</div>

        <div class="memo-box">
          <h3>我的阅读备忘录</h3>
          <textarea id="myMemoInput" placeholder="这里写你自己的阅读笔记。AI 之后可以在你允许时读取它。">${escapeHtml(text.myMemo || "")}</textarea>
          <div class="memo-actions">
            <button class="mini" onclick="appendMemoLine('my')">＋ 追加一条</button>
            <button class="mini" onclick="clearMemo('my')">清空</button>
          </div>
        </div>

        <div class="memo-box">
          <h3>AI 阅读备忘录</h3>
          <textarea id="aiMemoInput" placeholder="这里是 AI 对这篇文章的长期备忘录，可以编辑。">${escapeHtml(text.aiMemo || "")}</textarea>
          <div class="memo-actions">
            <button class="mini" onclick="appendMemoLine('ai')">＋ 追加一条</button>
            <button class="mini" onclick="polishAiMemo()">AI 整理</button>
            <button class="mini" onclick="clearMemo('ai')">清空</button>
          </div>
        </div>

        <div class="memo-box">
          <h3>AI 过程卡片</h3>
          ${(text.aiMemoCards || []).length ? text.aiMemoCards.map(card => `
            <div class="note-card">
              <h3>${escapeHtml(card.title || "阅读卡片")}</h3>
              <div class="time">${formatDate(card.createdAt)}</div>
              <div style="white-space:pre-wrap; line-height:1.65;">${escapeHtml(card.content || "")}</div>
            </div>
          `).join("") : `<p class="small">聊天过程中，AI 可以把它觉得值得留下的判断、摘抄或感受自动沉淀成卡片。</p>`}
        </div>

        <div class="memo-actions">
          <button onclick="saveMemos()">保存两份备忘录</button>
          <button class="secondary" onclick="openAllNotesPanel()">查看全部文章备忘录</button>
        </div>
      `);
    }

    function openAllNotesPanel() {
      openPanel("全部阅读笔记", `
        ${state.texts.length ? state.texts.map(text => `
          <div class="memo-box">
            <h3>${escapeHtml(text.title)}</h3>
            <div class="small">我的备忘录</div>
            <div style="white-space:pre-wrap; line-height:1.65; margin-bottom:10px;">${escapeHtml((text.myMemo || "").slice(0, 260) || "暂无")}</div>
            <div class="small">AI 备忘录</div>
            <div style="white-space:pre-wrap; line-height:1.65;">${escapeHtml((text.aiMemo || "").slice(0, 260) || "暂无")}</div>
            ${(text.aiMemoCards || []).length ? `<div class="small" style="margin-top:8px;">AI 过程卡片：${text.aiMemoCards.length} 张</div>` : ""}
            <div class="memo-actions">
              <button class="mini" onclick="renderReader('${text.id}'); closePanel();">打开这篇</button>
            </div>
          </div>
        `).join("") : `<p class="small">暂无阅读笔记。</p>`}
      `);
    }

    function saveMemos() {
      const text = getText(currentTextId);
      if (!text) return;

      text.myMemo = document.getElementById("myMemoInput").value.trim();
      text.aiMemo = document.getElementById("aiMemoInput").value.trim();
      text.updatedAt = new Date().toISOString();

      saveState();
      showToast("备忘录已保存");
      renderReader(text.id);
      openNotesPanel();
    }

    function appendMemoLine(kind) {
      const id = kind === "my" ? "myMemoInput" : "aiMemoInput";
      const box = document.getElementById(id);
      if (!box) return;

      const line = prompt(kind === "my" ? "追加到我的阅读备忘录：" : "追加到 AI 阅读备忘录：", "");
      if (!line || !line.trim()) return;

      const prefix = box.value.trim() ? "\n\n" : "";
      box.value = box.value + prefix + "＋ " + line.trim();
    }

    function clearMemo(kind) {
      const id = kind === "my" ? "myMemoInput" : "aiMemoInput";
      const box = document.getElementById(id);
      if (!box) return;

      if (!confirm("确定清空这一块备忘录？")) return;
      box.value = "";
    }

    async function polishAiMemo() {
      const text = getText(currentTextId);
      if (!text) return;

      const aiBox = document.getElementById("aiMemoInput");
      const myBox = document.getElementById("myMemoInput");

      const material = [
        "当前 AI 备忘录：",
        aiBox.value || "暂无",
        "",
        "我的阅读备忘录：",
        myBox.value || "暂无",
        "",
        "AI 段落批注：",
        (text.aiComments || []).map(c => `第${Number(c.paragraphIndex) + 1}段：${c.tag || ""} ${c.comment || ""}`).join("\n") || "暂无",
        "",
        "AI 过程卡片：",
        (text.aiMemoCards || []).map(card => `${card.title || "阅读卡片"}：${card.content || ""}`).join("\n") || "暂无"
      ].join("\n");

      try {
        showToast("AI 正在整理备忘录……");

        const result = await callWorker("/chat", {
          currentParagraph: material,
          previousParagraph: "",
          nextParagraph: "",
          userMessage: "请把以上内容整理成一份适合作为本篇文章长期记忆的 AI 阅读备忘录。要求：不要像作文，不要复述原文，保留具体判断和阅读感受，控制在 220 字以内。",
          chatHistory: [],
          textAiNote: aiBox.value,
          memoryMode: "none",
          aiNotes: [],
          myNotes: []
        });

        aiBox.value = result.reply || aiBox.value;
        showToast("AI 备忘录已整理");
      } catch (err) {
        alert("整理失败：" + err.message);
      }
    }

    function openChatPanel(textId, paragraphIndex) {
      currentChat = { textId, paragraphIndex, isThinking: false };
      renderChatPanel();
    }

    function renderChatPanel() {
      if (!currentChat) return;

      const text = getText(currentChat.textId);
      const i = currentChat.paragraphIndex;
      const p = text.paragraphs[i];
      const history = p.chatHistory || [];
      const paraComments = commentsFor(text, i);

      openPanel(
        `第 ${i + 1} 段`,
        `
          <div class="current-para">${escapeHtml(p.text)}</div>

          ${paraComments.length ? `
            <div class="memo-box">
              <h3>AI 对这一段的批注</h3>
              ${paraComments.map(c => `
                <div class="ai-note-inline" style="margin-left:0; max-width:100%;">
                  <span class="tag">${escapeHtml(c.tag || "AI")}</span>
                  ${escapeHtml(c.comment || "")}
                </div>
              `).join("")}
            </div>
          ` : `
            <p class="small">这一段暂时没有 AI 批注。你可以直接在下面问它。</p>
          `}

          ${history.length ? history.map((m, idx) => `
            <div class="chat-msg ${m.role === "user" ? "chat-user" : "chat-ai"}">
              ${escapeHtml(m.content)}
              <div class="chat-tools">
                ${m.role === "assistant"
                  ? `<button class="mini" onclick="appendChatToMemo(${idx}, 'ai')">摘到 AI 备忘录</button>`
                  : `<button class="mini" onclick="appendChatToMemo(${idx}, 'my')">摘到我的备忘录</button>`
                }
              </div>
            </div>
          `).join("") : `
            <p class="small">这里可以只聊当前这一段。系统只会发送当前段落、相邻段落、当前文本备忘录，以及你允许的少量过往备忘录。</p>
          `}

          ${currentChat.isThinking ? `
            <div class="chat-msg thinking">
              <span class="dot">AI 正在思考</span>
              <span id="thinkingSeconds">0</span> 秒
            </div>
          ` : ""}
        `,
        `
          <textarea id="chatInput" placeholder="问问这一段……" ${currentChat.isThinking ? "disabled" : ""}></textarea>
          <button id="sendBtn" onclick="sendChat()" ${currentChat.isThinking ? "disabled" : ""}>发送</button>
        `
      );

      const body = document.getElementById("panelBody");
      body.scrollTop = body.scrollHeight;
      if (currentChat.isThinking) startThinkingTimer();
    }

    function startThinkingTimer() {
      stopThinkingTimer();
      thinkingStartedAt = Date.now();
      thinkingTimer = setInterval(() => {
        const el = document.getElementById("thinkingSeconds");
        if (el && thinkingStartedAt) {
          el.textContent = String(Math.floor((Date.now() - thinkingStartedAt) / 1000));
        }
      }, 300);
    }

    function stopThinkingTimer() {
      clearInterval(thinkingTimer);
      thinkingTimer = null;
      thinkingStartedAt = null;
    }

    async function sendChat() {
      if (!currentChat || currentChat.isThinking) return;

      const input = document.getElementById("chatInput");
      const userMessage = input.value.trim();
      if (!userMessage) return;

      const text = getText(currentChat.textId);
      const i = currentChat.paragraphIndex;
      const p = text.paragraphs[i];

      p.chatHistory = p.chatHistory || [];
      p.chatHistory.push({ role: "user", content: userMessage });

      currentChat.isThinking = true;
      saveState();
      renderChatPanel();

      try {
        const result = await callWorker("/chat", {
          currentParagraph: text.paragraphs[i]?.text || "",
          previousParagraph: text.paragraphs[i - 1]?.text || "",
          nextParagraph: text.paragraphs[i + 1]?.text || "",
          userMessage,
          chatHistory: p.chatHistory.slice(0, -1),
          textAiNote: [text.aiMemo || text.aiReadingNote || "", ...(text.aiMemoCards || []).map(card => `${card.title || "阅读卡片"}：${card.content || ""}`)].filter(Boolean).join("\n\n"),
          memoryMode: state.settings.memoryMode,
          aiNotes: collectAiMemos(text.id),
          myNotes: collectMyMemos(text.id)
        });

        p.chatHistory.push({
          role: "assistant",
          content: result.reply || "AI 没有返回内容。"
        });

        maybeAddAiMemoCard(text, i, userMessage, result.reply || "");

        text.updatedAt = new Date().toISOString();
        saveState();
      } catch (err) {
        p.chatHistory.push({
          role: "assistant",
          content: "聊天失败：" + err.message
        });
        saveState();
      } finally {
        currentChat.isThinking = false;
        stopThinkingTimer();
        renderChatPanel();
      }
    }

    function maybeAddAiMemoCard(text, paragraphIndex, userMessage, aiReply) {
      const shouldKeep = /摘|记|笔记|备忘|喜欢|好|妙|重要|伏笔|人物|情绪|结构|语言|原文|保留|卡片/.test(userMessage + aiReply);
      if (!shouldKeep) return;

      const source = text.paragraphs[paragraphIndex]?.text || "";
      const excerpt = source.length > 120 ? source.slice(0, 120) + "…" : source;
      const content = [
        aiReply.length > 220 ? aiReply.slice(0, 220) + "…" : aiReply,
        excerpt ? `\n原文片段：${excerpt}` : ""
      ].join("\n").trim();

      text.aiMemoCards = text.aiMemoCards || [];
      text.aiMemoCards.push({
        id: uid("card"),
        title: `第 ${paragraphIndex + 1} 段的阅读发现`,
        content,
        paragraphIndex,
        createdAt: new Date().toISOString()
      });
    }

    function appendChatToMemo(messageIndex, kind) {
      if (!currentChat) return;

      const text = getText(currentChat.textId);
      const p = text.paragraphs[currentChat.paragraphIndex];
      const msg = p.chatHistory[messageIndex];

      if (!msg) return;

      const line = `【第 ${currentChat.paragraphIndex + 1} 段】${msg.content}`;

      if (kind === "ai") {
        text.aiMemo = (text.aiMemo || "").trim()
          ? text.aiMemo.trim() + "\n\n" + line
          : line;
      } else {
        text.myMemo = (text.myMemo || "").trim()
          ? text.myMemo.trim() + "\n\n" + line
          : line;
      }

      saveState();
      showToast(kind === "ai" ? "已摘到 AI 备忘录" : "已摘到我的备忘录");
    }

    function deleteText(textId) {
      const text = getText(textId);
      if (!text) return;

      if (!confirm(`确定删除《${text.title}》？原文、批注、聊天、备忘录都会删除。`)) return;

      state.texts = state.texts.filter(t => t.id !== textId);
      saveState();
      renderHome();
      closePanel();
    }

    renderHome();
  </script>
</body>
</html>
