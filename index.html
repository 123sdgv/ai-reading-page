<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>AI 阅读器</title>
<style>
:root{
  --paper:#f7f1e8;--ink:#2b251f;--muted:#8a7a68;--line:#dfd0be;
  --panel:#fffaf3;--accent:#6f553a;--ai:#8a5f2d;
  --ai-bg:rgba(243,229,207,.55);--dark:#2d241c;
  --card:rgba(255,255,255,.6);--top-h:52px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;font-size:15px;line-height:1.6}
button,input,textarea,select{font:inherit}
button{border:none;cursor:pointer;border-radius:999px}

.btn{padding:6px 14px;font-size:14px;background:var(--dark);color:#fff}
.btn-s{padding:4px 10px;font-size:12px;background:rgba(111,85,58,.1);color:var(--accent);border:1px solid rgba(111,85,58,.15)}
.btn-ghost{padding:4px 10px;font-size:13px;background:transparent;color:var(--muted)}
.btn-icon{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;font-size:16px;background:rgba(255,255,255,.5);color:var(--ink);border:1px solid var(--line)}

input,textarea,select{width:100%;border:1px solid var(--line);background:#fffaf3;color:var(--ink);border-radius:10px;padding:8px 10px;outline:none}
textarea{resize:vertical;min-height:60px;line-height:1.6}
label{display:block;margin:12px 0 4px;font-size:12px;color:var(--muted)}

/* ---- topbar ---- */
.topbar{height:var(--top-h);position:sticky;top:0;z-index:20;background:rgba(247,241,232,.92);backdrop-filter:blur(12px);border-bottom:1px solid rgba(223,208,190,.7);display:flex;align-items:center;justify-content:space-between;padding:0 12px}
.topbar .seg{display:flex;align-items:center;gap:8px}
.brand{font-size:14px;color:var(--muted);letter-spacing:.06em}

/* ---- layout ---- */
.app{display:flex;height:calc(100vh - var(--top-h))}
.main-pane{flex:1;overflow-y:auto;padding:20px 18px 80px;min-width:0}
.side-pane{width:0;flex-shrink:0;overflow:hidden;background:var(--panel);display:flex;flex-direction:column;transition:width .25s ease}
.side-pane.open{width:390px;border-left:1px solid var(--line)}
.side-head{min-height:46px;padding:8px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.side-head h2{font-size:15px;font-weight:600}
.side-body{flex:1;overflow-y:auto;padding:12px 14px}
.side-foot{border-top:1px solid var(--line);padding:10px 12px;display:none;gap:8px;align-items:flex-end}
.side-foot.on{display:flex}
.side-foot textarea{min-height:44px;max-height:120px;flex:1}

/* ---- home ---- */
.home-wrap{max-width:600px;margin:0 auto}
.empty{min-height:50vh;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);line-height:1.8}
.book-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:12px;cursor:pointer;transition:box-shadow .15s}
.book-card:hover{box-shadow:0 4px 16px rgba(74,55,35,.08)}
.book-card h2{font-size:18px;font-weight:600;margin-bottom:6px}
.meta{color:var(--muted);font-size:13px;line-height:1.6}

/* ---- reader ---- */
.reader-head{max-width:680px;margin:0 auto 14px;padding-bottom:12px;border-bottom:1px solid rgba(223,208,190,.6)}
.reader-head h1{font-size:22px;font-weight:650;margin-bottom:4px}
.reader-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}

.novel-wrap{max-width:680px;margin:0 auto}
.novel{font-family:"Songti SC","STSong","Noto Serif SC",serif;font-size:17px;line-height:1.75;letter-spacing:.015em}
.novel-p{text-indent:2em;margin-bottom:.35em;white-space:pre-wrap}
.para-btn{display:inline-flex;align-items:center;justify-content:center;width:1.15em;height:1.15em;border-radius:50%;border:1px solid rgba(111,85,58,.2);background:rgba(111,85,58,.06);color:var(--accent);font-size:.6em;vertical-align:middle;margin-left:.25em;cursor:pointer;padding:0;transition:background .15s}
.para-btn:hover{background:rgba(111,85,58,.18)}

.ai-inline{margin:.15em 0 .45em 2em;padding:5px 10px;border-left:3px solid rgba(138,95,45,.4);background:var(--ai-bg);color:var(--ai);font-family:-apple-system,sans-serif;font-size:13px;line-height:1.55;border-radius:8px;max-width:88%}
.ai-inline .tag{display:inline-block;font-size:11px;background:rgba(138,95,45,.7);color:#fff;border-radius:999px;padding:0 6px;margin-right:4px}

/* ---- note cards ---- */
.nc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-bottom:10px}
.nc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.nc-type{font-size:11px;padding:1px 7px;border-radius:999px;font-weight:500}
.t-ai{background:rgba(138,95,45,.15);color:var(--ai)}
.t-my{background:rgba(111,85,58,.1);color:var(--accent)}
.t-ex{background:rgba(90,130,60,.15);color:#5a7a3a}
.nc-time{font-size:11px;color:var(--muted)}
.nc-body{font-size:13px;line-height:1.6;white-space:pre-wrap}
.nc-foot{display:flex;gap:6px;margin-top:6px}

/* ---- chat ---- */
.ctx-para{background:var(--ai-bg);border:1px solid rgba(223,208,190,.8);border-radius:12px;padding:9px 11px;margin-bottom:10px;font-size:13px;line-height:1.6;white-space:pre-wrap;max-height:110px;overflow-y:auto}
.cm{margin-bottom:10px;padding:9px 11px;border-radius:14px;font-size:14px;line-height:1.6;white-space:pre-wrap}
.cm-u{margin-left:28px;background:var(--dark);color:#fff}
.cm-a{margin-right:28px;background:rgba(111,85,58,.1);border:1px solid rgba(111,85,58,.1)}
.cm-acts{display:flex;gap:6px;margin-top:5px}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:rgba(45,36,28,.9);color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;z-index:100;display:none;pointer-events:none}
.load-mask{position:fixed;inset:0;z-index:90;background:rgba(247,241,232,.6);display:none;align-items:center;justify-content:center;flex-direction:column;gap:8px;font-size:14px;color:var(--muted)}
.load-mask.on{display:flex}

.small{color:var(--muted);font-size:13px;line-height:1.6}
.gap{display:flex;gap:8px;flex-wrap:wrap}
.mt{margin-top:10px}

@media(max-width:768px){
  .side-pane.open{position:fixed;top:var(--top-h);right:0;bottom:0;width:100%;z-index:30;box-shadow:-4px 0 20px rgba(0,0,0,.1)}
  .novel{font-size:16px}
  .main-pane{padding:14px 12px 80px}
  .reader-head h1{font-size:20px}
  .brand{display:none}
}
</style>
</head>

<body>
<header class="topbar">
  <div class="seg">
    <button class="btn-icon" onclick="toggleSide('notes')" title="阅读笔记">📝</button>
    <button class="btn-icon" onclick="toggleSide('settings')" title="设置">⚙</button>
  </div>
  <div class="brand">AI 阅读器</div>
  <div class="seg">
    <button class="btn-icon" onclick="$('fileIn').click()" title="上传 TXT">＋</button>
    <input id="fileIn" type="file" accept=".txt,text/plain" hidden onchange="handleUpload(event)"/>
  </div>
</header>

<div class="app">
  <main id="main" class="main-pane"></main>
  <aside id="side" class="side-pane">
    <div class="side-head"><h2 id="sideTitle">面板</h2><button class="btn-s" onclick="closeSide()">关闭</button></div>
    <div id="sideBody" class="side-body"></div>
    <div id="sideFoot" class="side-foot"></div>
  </aside>
</div>

<div id="loadMask" class="load-mask"><div>⏳ AI 正在阅读…</div><div class="small">首次上传需要等待较长时间</div></div>
<div id="toast" class="toast"></div>

<script>
/* ========== helpers ========== */
const $=id=>document.getElementById(id);
const uid=p=>p+'_'+Math.random().toString(36).slice(2)+Date.now().toString(36);
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function fmtDate(iso){if(!iso)return'';const d=new Date(iso);return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()+' '+d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')}
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',1800)}

/* ========== smart split ========== */
function smartSplit(raw){
  let t=raw.replace(/\r\n/g,'\n').replace(/\r/g,'\n').trim();
  // 1) try double newline
  let parts=t.split(/\n\s*\n+/).map(s=>s.trim()).filter(Boolean);
  // if very few parts, try single newline
  if(parts.length<=2&&t.length>400){
    parts=t.split(/\n/).map(s=>s.trim()).filter(Boolean);
  }
  if(!parts.length) return [t];
  // 2) merge short non-dialogue lines
  const merged=[];let buf='';
  for(const p of parts){
    const isDlg=/^[\u201c\u300c\u300e\u3010\uff08"'\u2018]/.test(p);
    if(!buf){buf=p;continue}
    if(buf.length<60&&p.length<60&&!isDlg&&!/[\u201c\u300c]/.test(buf)){
      buf+='\n'+p;
    }else{
      merged.push(buf);buf=p;
    }
  }
  if(buf)merged.push(buf);
  // 3) split overly long blocks
  const out=[];
  for(const b of merged){
    if(b.length>500){
      out.push(...splitLong(b,200,450));
    }else out.push(b);
  }
  return out.filter(Boolean);
}
function splitLong(txt,mn,mx){
  const r=[];let rem=txt;
  while(rem.length>mx){
    let idx=-1;
    for(let i=mn;i<mx&&i<rem.length;i++){
      if(/[。！？…\u201d\u300d\uff09]/.test(rem[i]))idx=i+1;
    }
    if(idx<0)idx=mx;
    r.push(rem.slice(0,idx).trim());rem=rem.slice(idx).trim();
  }
  if(rem)r.push(rem);
  return r;
}

/* ========== state ========== */
const SK='ai_reader_v3';
let S=loadS(), curText=null, sideMode=null, chatIdx=null;

function defS(){return{settings:{workerUrl:'https://ai-reader-proxy.shun83258.workers.dev',memoryMode:'none'},texts:[]}}
function loadS(){
  try{
    for(const k of[SK,'ai_reader_v2','ai_reader_v1']){const r=localStorage.getItem(k);if(r)return migrate(JSON.parse(r))}
  }catch(e){}
  return defS();
}
function migrate(s){
  const b=defS(),o={...b,...s,settings:{...b.settings,...(s.settings||{})},texts:[]};
  o.texts=(Array.isArray(s.texts)?s.texts:[]).map(t=>{
    let paras=(Array.isArray(t.paragraphs)?t.paragraphs:[]).map(p=>({
      id:p.id||uid('p'),text:typeof p==='string'?p:(p.text||''),chatHistory:Array.isArray(p.chatHistory)?p.chatHistory:[]
    }));
    let cards=Array.isArray(t.noteCards)?t.noteCards:[];
    if(!cards.length){
      if(t.aiMemo||t.aiReadingNote)cards.push({id:uid('nc'),type:'ai-summary',title:'AI 初读笔记',content:t.aiMemo||t.aiReadingNote||'',createdAt:t.createdAt||new Date().toISOString()});
      if(t.myMemo)cards.push({id:uid('nc'),type:'my-note',title:'我的笔记',content:t.myMemo,createdAt:t.createdAt||new Date().toISOString()});
    }
    return{id:t.id||uid('t'),title:t.title||'未命名',content:t.content||'',paragraphs:paras,aiComments:Array.isArray(t.aiComments)?t.aiComments:[],noteCards:cards,createdAt:t.createdAt||new Date().toISOString(),updatedAt:t.updatedAt||new Date().toISOString()};
  });
  return o;
}
function save(){try{localStorage.setItem(SK,JSON.stringify(S))}catch(e){toast('存储空间不足')}}
function getT(id){return S.texts.find(t=>t.id===id)}

/* ========== cross-text memory ========== */
function textAiNote(t){
  return t.noteCards.filter(c=>c.type!=='my-note').map(c=>c.content).join('\n\n');
}
function collectAi(exId){
  return S.texts.filter(t=>t.id!==exId).map(t=>{
    const n=t.noteCards.filter(c=>c.type!=='my-note').map(c=>c.content).join('\n');
    return n?`《${t.title}》\n${n}`:'';
  }).filter(Boolean).slice(-5);
}
function collectMy(exId){
  return S.texts.filter(t=>t.id!==exId).map(t=>{
    const n=t.noteCards.filter(c=>c.type==='my-note').map(c=>c.content).join('\n');
    return n?`《${t.title}》\n${n}`:'';
  }).filter(Boolean).slice(-5);
}

/* ========== API ========== */
async function callW(path,body){
  const base=S.settings.workerUrl.replace(/\/$/,'');
  const res=await fetch(base+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const txt=await res.text();
  let d;try{d=JSON.parse(txt)}catch(e){throw new Error(txt||'Worker 返回非 JSON')}
  if(!res.ok||d.error)throw new Error(d.message||'请求失败');
  return d;
}

/* ========== render: home ========== */
function renderHome(){
  curText=null;closeSide();
  const m=$('main');
  if(!S.texts.length){
    m.innerHTML='<div class="empty"><div><h1 style="margin-bottom:8px">这里暂时是空白</h1><p>点右上角「＋」上传 TXT 文件<br>AI 会自动分段、批注并生成阅读笔记</p></div></div>';
    return;
  }
  m.innerHTML='<div class="home-wrap">'+S.texts.map(t=>`
    <div class="book-card" onclick="openReader('${t.id}')">
      <h2>${esc(t.title)}</h2>
      <div class="meta">${t.content.length} 字 · ${t.paragraphs.length} 段 · 笔记 ${t.noteCards.length} 条<br>${fmtDate(t.updatedAt)}</div>
    </div>`).join('')+'</div>';
}

/* ========== render: reader ========== */
function openReader(id){
  const t=getT(id);if(!t)return renderHome();
  curText=id;t.updatedAt=new Date().toISOString();save();
  renderArticle();
}
function renderArticle(){
  const t=getT(curText);if(!t)return renderHome();
  const comments=t.aiComments||[];
  $('main').innerHTML=`
    <section class="reader-head">
      <div class="reader-tools">
        <button class="btn-s" onclick="renderHome()">← 书架</button>
        <button class="btn-s" onclick="toggleSide('notes')">📝 笔记</button>
        <button class="btn-s" onclick="aiResplit()">AI 重新分段</button>
        <button class="btn-s" onclick="delText('${t.id}')">删除</button>
      </div>
      <h1>${esc(t.title)}</h1>
      <div class="meta">${t.content.length} 字 · ${t.paragraphs.length} 段</div>
    </section>
    <article class="novel-wrap"><div class="novel">${t.paragraphs.map((p,i)=>{
      const cs=comments.filter(c=>Number(c.paragraphIndex)===i);
      return`<section><p class="novel-p">${esc(p.text)}<button class="para-btn" onclick="openChat(${i})" title="聊聊这段">▸</button></p>${cs.map(c=>`<div class="ai-inline"><span class="tag">${esc(c.tag||'AI')}</span>${esc(c.comment||'')}</div>`).join('')}</section>`;
    }).join('')}</div></article>`;
}

/* ========== side panel core ========== */
function openSide(mode){
  sideMode=mode;$('side').classList.add('open');renderSide();
}
function closeSide(){
  sideMode=null;chatIdx=null;$('side').classList.remove('open');
  $('sideFoot').className='side-foot';$('sideFoot').innerHTML='';
}
function toggleSide(mode){
  if(sideMode===mode){closeSide();return}
  openSide(mode);
}
function renderSide(){
  if(sideMode==='chat')renderChat();
  else if(sideMode==='notes')renderNotes();
  else if(sideMode==='all-notes')renderAllNotes();
  else if(sideMode==='settings')renderSettings();
}

/* ========== side: chat ========== */
function openChat(idx){
  chatIdx=idx;openSide('chat');
}
function renderChat(){
  const t=getT(curText);
  if(!t||chatIdx==null){closeSide();return}
  const p=t.paragraphs[chatIdx];if(!p)return;
  const h=p.chatHistory||[];
  $('sideTitle').textContent=`第 ${chatIdx+1} 段`;
  $('sideBody').innerHTML=`
    <div class="ctx-para">${esc(p.text.length>200?p.text.slice(0,200)+'…':p.text)}</div>
    ${h.length?h.map((m,i)=>`
      <div class="cm ${m.role==='user'?'cm-u':'cm-a'}">${esc(m.content)}
        ${m.role==='assistant'?`<div class="cm-acts"><button class="btn-s" onclick="saveAsCard(${i})">📌 存为笔记</button></div>`:''}
      </div>`).join(''):'<p class="small">和 AI 聊聊这一段。AI 能看到前后段落和你的阅读笔记。</p>'}`;
  const ft=$('sideFoot');ft.className='side-foot on';
  ft.innerHTML='<textarea id="chatIn" placeholder="说点什么…"></textarea><button class="btn" onclick="sendChat()">发送</button>';
  // scroll to bottom
  $('sideBody').scrollTop=$('sideBody').scrollHeight;
}

async function sendChat(){
  const t=getT(curText);if(!t||chatIdx==null)return;
  const inp=$('chatIn');const msg=inp.value.trim();if(!msg)return;
  const p=t.paragraphs[chatIdx];
  p.chatHistory=p.chatHistory||[];
  p.chatHistory.push({role:'user',content:msg});
  save();renderChat();
  try{
    const res=await callW('/chat',{
      currentParagraph:p.text,
      previousParagraph:(t.paragraphs[chatIdx-1]||{}).text||'',
      nextParagraph:(t.paragraphs[chatIdx+1]||{}).text||'',
      userMessage:msg,
      chatHistory:p.chatHistory.slice(0,-1),
      textAiNote:textAiNote(t),
      memoryMode:S.settings.memoryMode,
      aiNotes:collectAi(t.id),
      myNotes:collectMy(t.id)
    });
    p.chatHistory.push({role:'assistant',content:res.reply||'AI 没有返回内容。'});
  }catch(e){
    p.chatHistory.push({role:'assistant',content:'出错了：'+e.message});
  }
  save();renderChat();
}

function saveAsCard(msgIdx){
  const t=getT(curText);if(!t||chatIdx==null)return;
  const p=t.paragraphs[chatIdx];
  const m=(p.chatHistory||[])[msgIdx];if(!m)return;
  t.noteCards.push({
    id:uid('nc'),type:'chat-excerpt',
    title:`第${chatIdx+1}段 · 对话摘录`,
    content:m.content,
    createdAt:new Date().toISOString()
  });
  save();toast('已保存为笔记卡片');
}

/* ========== side: notes ========== */
function renderNotes(){
  const t=getT(curText);
  if(!t){renderAllNotes();return}
  $('sideTitle').textContent='阅读笔记';
  const cards=t.noteCards||[];
  $('sideBody').innerHTML=`
    <div class="small" style="margin-bottom:10px">《${esc(t.title)}》· ${cards.length} 条笔记</div>
    ${cards.map(c=>`
      <div class="nc">
        <div class="nc-head">
          <span class="nc-type ${c.type==='my-note'?'t-my':c.type==='chat-excerpt'?'t-ex':'t-ai'}">${c.type==='my-note'?'📝 我的':c.type==='chat-excerpt'?'💬 摘录':'🤖 AI'}</span>
          <span class="nc-time">${fmtDate(c.createdAt)}</span>
        </div>
        <div style="font-size:13px;font-weight:500;margin-bottom:3px">${esc(c.title||'')}</div>
        <div class="nc-body">${esc(c.content.length>300?c.content.slice(0,300)+'…':c.content)}</div>
        <div class="nc-foot"><button class="btn-s" onclick="delCard('${c.id}')">删除</button></div>
      </div>`).join('')}
    <div style="margin-top:14px">
      <textarea id="myNoteIn" placeholder="写一条你的阅读笔记…" style="min-height:50px"></textarea>
      <div class="gap mt">
        <button class="btn-s" onclick="addMyNote()">添加笔记</button>
        <button class="btn-s" onclick="openSide('all-notes')">查看全部文章笔记</button>
      </div>
    </div>`;
  $('sideFoot').className='side-foot';$('sideFoot').innerHTML='';
}

function addMyNote(){
  const t=getT(curText);if(!t)return;
  const inp=$('myNoteIn');const v=inp.value.trim();if(!v)return;
  t.noteCards.push({id:uid('nc'),type:'my-note',title:'我的笔记',content:v,createdAt:new Date().toISOString()});
  save();toast('笔记已添加');renderNotes();
}
function delCard(cid){
  const t=getT(curText);if(!t)return;
  t.noteCards=t.noteCards.filter(c=>c.id!==cid);save();renderNotes();
}

/* ========== side: all notes ========== */
function renderAllNotes(){
  sideMode='all-notes';
  $('sideTitle').textContent='全部笔记';
  $('sideBody').innerHTML=S.texts.length?S.texts.map(t=>`
    <div style="margin-bottom:16px">
      <div style="font-weight:600;margin-bottom:6px">${esc(t.title)}</div>
      ${(t.noteCards||[]).slice(0,3).map(c=>`
        <div class="nc">
          <div class="nc-head"><span class="nc-type ${c.type==='my-note'?'t-my':c.type==='chat-excerpt'?'t-ex':'t-ai'}">${c.type==='my-note'?'📝':c.type==='chat-excerpt'?'💬':'🤖'}</span><span class="nc-time">${fmtDate(c.createdAt)}</span></div>
          <div class="nc-body">${esc((c.content||'').slice(0,150))}</div>
        </div>`).join('')}
      ${t.noteCards.length>3?`<div class="small">还有 ${t.noteCards.length-3} 条…</div>`:''}
      <button class="btn-s" onclick="openReader('${t.id}');openSide('notes')">打开</button>
    </div>`).join(''):'<p class="small">暂无笔记</p>';
  $('sideFoot').className='side-foot';$('sideFoot').innerHTML='';
}

/* ========== side: settings ========== */
function renderSettings(){
  $('sideTitle').textContent='设置';
  $('sideBody').innerHTML=`
    <label>Worker URL</label>
    <input id="urlIn" value="${esc(S.settings.workerUrl)}" placeholder="https://xxx.workers.dev"/>
    <label>跨文本记忆</label>
    <select id="memIn">
      <option value="none"${S.settings.memoryMode==='none'?' selected':''}>不读取其他文章笔记</option>
      <option value="ai"${S.settings.memoryMode==='ai'?' selected':''}>只读取 AI 笔记</option>
      <option value="all"${S.settings.memoryMode==='all'?' selected':''}>读取全部笔记</option>
    </select>
    <p class="small mt">API Key 存在 Worker 环境变量里，不经过浏览器。</p>
    <div class="mt"><button class="btn" onclick="saveSetting()">保存</button></div>`;
  $('sideFoot').className='side-foot';$('sideFoot').innerHTML='';
}
function saveSetting(){
  S.settings.workerUrl=$('urlIn').value.trim();
  S.settings.memoryMode=$('memIn').value;
  save();toast('已保存');closeSide();
}

/* ========== upload & annotate ========== */
async function handleUpload(ev){
  const f=ev.target.files[0];ev.target.value='';if(!f)return;
  if(!S.settings.workerUrl){toggleSide('settings');toast('请先填写 Worker URL');return}
  const raw=await f.text();
  const paras=smartSplit(raw);
  if(!paras.length){toast('没有读到有效段落');return}

  const t={
    id:uid('t'),title:f.name.replace(/\.txt$/i,''),content:raw,
    paragraphs:paras.map(p=>({id:uid('p'),text:p,chatHistory:[]})),
    aiComments:[],noteCards:[],
    createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()
  };
  S.texts.unshift(t);save();openReader(t.id);

  $('loadMask').classList.add('on');
  try{
    const res=await callW('/annotate',{
      title:t.title,
      paragraphs:t.paragraphs.map(p=>p.text),
      memoryMode:S.settings.memoryMode,
      aiNotes:collectAi(t.id),
      myNotes:collectMy(t.id)
    });
    const p=res.parsed;
    if(p){
      t.aiComments=Array.isArray(p.comments)?p.comments:[];
      const note=p.overallNote||'AI 已读完，但没有留下总结。';
      t.noteCards.push({id:uid('nc'),type:'ai-summary',title:`AI 初读笔记 ·《${t.title}》`,content:note,createdAt:new Date().toISOString()});
    }else{
      t.noteCards.push({id:uid('nc'),type:'ai-summary',title:`AI 初读笔记 ·《${t.title}》`,content:res.raw||'AI 返回内容无法解析',createdAt:new Date().toISOString()});
    }
    save();renderArticle();
  }catch(e){
    t.noteCards.push({id:uid('nc'),type:'ai-summary',title:'AI 阅读失败',content:e.message,createdAt:new Date().toISOString()});
    save();renderArticle();toast('AI 阅读失败：'+e.message);
  }finally{
    $('loadMask').classList.remove('on');
  }
}

/* ========== AI re-split ========== */
async function aiResplit(){
  const t=getT(curText);if(!t)return;
  if(!confirm('让 AI 重新分段？原有的段落聊天记录会丢失。'))return;
  $('loadMask').classList.add('on');
  try{
    const res=await callW('/chat',{
      currentParagraph:t.content.slice(0,18000),
      previousParagraph:'',nextParagraph:'',
      userMessage:'请将以上文本分成适合阅读的自然段落。规则：1）按原文语义和场景自然分段 2）每段100-500字左右 3）对话密集处可以几句合为一段 4）只输出分段后的原文，段落之间用 |||SPLIT||| 分隔 5）不要添加任何解释，不要修改原文',
      chatHistory:[],textAiNote:'',memoryMode:'none',aiNotes:[],myNotes:[]
    });
    const parts=(res.reply||'').split('|||SPLIT|||').map(s=>s.trim()).filter(Boolean);
    if(parts.length>=2){
      t.paragraphs=parts.map(p=>({id:uid('p'),text:p,chatHistory:[]}));
      t.aiComments=[];save();renderArticle();toast('AI 分段完成：'+parts.length+' 段');
      // re-annotate
      $('loadMask').querySelector('div').textContent='⏳ AI 正在批注…';
      const res2=await callW('/annotate',{
        title:t.title,paragraphs:t.paragraphs.map(p=>p.text),
        memoryMode:S.settings.memoryMode,aiNotes:collectAi(t.id),myNotes:collectMy(t.id)
      });
      if(res2.parsed){
        t.aiComments=Array.isArray(res2.parsed.comments)?res2.parsed.comments:[];
      }
      save();renderArticle();
    }else{toast('AI 分段结果异常，保持原样');}
  }catch(e){toast('AI 分段失败：'+e.message)}
  finally{$('loadMask').classList.remove('on');$('loadMask').querySelector('div').textContent='⏳ AI 正在阅读…'}
}

/* ========== delete ========== */
function delText(id){
  const t=getT(id);if(!t)return;
  if(!confirm(`确定删除《${t.title}》？所有内容将清除。`))return;
  S.texts=S.texts.filter(x=>x.id!==id);save();renderHome();
}

/* ========== init ========== */
renderHome();
</script>
